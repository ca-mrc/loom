[[test_sharding]]
lane = "tests-root"
shard_count = 2
strategy = "stable-hash"
# 2026-09-02 collection snapshot: 15,260 tests split 7,630 / 7,630.
# Keep salt changes measurement-backed because existing path assignments are stable.
salt = "tests-root-v2-8275"
pins = [
  # Pair measured hotspots across shards; see #1680 and PR #1731 telemetry.
  { path = "tests/ops/test_ci_secret_isolation.py", shard_index = 0 },
  { path = "tests/ops/test_component_ownership_manifest.py", shard_index = 1 },
]

[[test_sharding]]
lane = "integration"
shard_count = 4
strategy = "stable-hash"
# PR #1973 head 69359261: ~155 minutes across 518 timed modules.
# This salt projects 39.0 / 38.2 / 38.8 / 39.1 minutes without splitting modules.
# Stable hashing keeps existing assignments when new test files are added.
salt = "integration-v3-4"
pins = [
  # Preserve the existing auth-before-schema ordering within one process.
  { path = "tests/integration/test_username_password_auth.py", shard_index = 3 },
  { path = "tests/integration/test_username_password_schema.py", shard_index = 3 },
]


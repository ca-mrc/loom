# AUTOGENERATED — do not edit by hand. Regenerate with `loom config codegen`.
# Operator-tunable knobs for `loom cluster render --config <FILE>`.
# Each value below is the default; uncomment + edit to override.

# Object-store bucket for trial artifacts. Rendered into control-plane, worker, and loom-service env. Set per environment when deployments share an object-store endpoint.
artifacts_bucket = "artifacts"
# Optional registry prefix for every locally built loom-* image in the rendered manifest, without a trailing slash. Protected rollouts require it and publish the exact candidate images before apply. Empty is supported only for unprotected local rendering.
container_registry = ""
# Operator-local publication prefix for container_registry (no scheme or trailing slash). It must be set together with container_registry. This may differ from the pull prefix when k3s registry mirrors expose the same registry through a node-local endpoint, for example localhost:5000 -> 192.168.50.13:5000.
container_registry_push = ""
# Public path prefix prepended by the SPA API client before /api/v1. Must match frontend_route_path for protected dev/staging/prod routes.
frontend_api_base_path = ""
# Public SPA environment identity written to the runtime frontend config.
frontend_environment = "local"
# Human-readable public SPA environment label shown in the UI chrome.
frontend_environment_label = "Local development"
# Public SPA path prefix on ingress_host. Empty means host root; canonical hosted environments use /dev, /staging, and /prod.
frontend_route_path = ""
# Predecessor SPA route prefix during a route migration (e.g. "/dev" while migrating to "/staging"). When set and different from frontend_route_path, the rollout preflight probes the live service at this predecessor route (the live env has not moved yet) while the driver moves the route to frontend_route_path and the post-deploy final gate validates the target. Empty (default) means no route transition. Preflight-only: not consumed by the manifest templates.
frontend_route_path_from = ""
# Retired (#2054). Must be empty; register OpenAI-compatible endpoints as Provider Connections.
gateway_local_providers = []
# Image tag applied to every loom-* image.
image_tag = "0.7"
# Optional cert-manager ClusterIssuer name for automatic TLS.
ingress_cert_manager_cluster_issuer = ""
# Kubernetes IngressClass used by the public Web/API ingress.
ingress_class_name = "nginx"
ingress_host = "loom.example.com"
# Optional www/non-www HTTPS counterpart hostnames that bind the public ingress TLS secret and redirect to ingress_host. They must not serve separate frontend/API routes.
ingress_redirect_hosts = []
# TLS Secret name referenced by the public Web/API ingress.
ingress_tls_secret_name = "loom-tls"
# Additional exact legacy object-store buckets that staging lifecycle maintenance must inventory alongside the configured trajectories and artifacts write buckets.
lifecycle_legacy_buckets = []
minio_image = "minio/minio"
minio_storage_gi = 500
namespace = "loom"
# Persistent storage binding mode for Postgres, MinIO, and worker trajectories. Use "dynamic" for the cluster default StorageClass, or "static-host-path" for explicit host-managed Retain PVs.
persistent_storage_backend = "dynamic"
# Absolute host path root used when persistent_storage_backend is "static-host-path", for example /data/loom-staging. Loom renders postgres, minio, and trajectories subdirectories under this root.
persistent_storage_host_path_root = ""
postgres_image = "postgres:16"
postgres_storage_gi = 50
# Approved BYO provider egress targets as IP-or-CIDR:TCP-port entries, e.g. ["202.78.161.51:18001"]. Hostnames must be resolved by the operator before rendering because Kubernetes NetworkPolicy enforces CIDRs, not DNS names.
provider_egress_allowlist = []
# Backend runtime identity written to LOOM_ENV for service/control-plane/gateway pods. Staging profiles must set this to staging; production profiles set production.
runtime_environment = "production"
# Object-store bucket for trial trajectories. Rendered into control-plane, worker, and loom-service env. Set per environment when deployments share an object-store endpoint.
trajectories_bucket = "trajectories"
# Registry repository for the shared trial-image cache. Empty uses only per-worker caches. A configured repository lets workers pull layered images built elsewhere; workers need mounted pull and push credentials. A failed shared pull falls back to a local build.
trial_cache_registry_repo = ""
# Sandbox-facing OpenAI-compatible gateway URL injected into k8s workers as LOOM_WORKER_SUBPROCESS_GATEWAY_URL. The default targets the rendered gateway-router hostPort; deployments with another host service on 30443 should override this, for example to http://host.docker.internal:30444/openai/v1 with a durable host port-forward.
worker_subprocess_gateway_url = "http://host.docker.internal:30443/openai/v1"
worker_trajectory_storage_gi = 100

[gateway_hpa]
enabled = false
min_replicas = 2
max_replicas = 8
cpu_target_pct = 60

[k8s_worker]
enabled = false

[llm_gateway_sandbox]
enabled = false
# Optional canonical staging attachment for the separate Nebius execution cluster. Requires pre-existing source-spool/runtime/admission Secrets, an explicit configuration revision and scoped persistent network routes. Disabled profiles retain Docker behavior; rendering never provisions or migrates databases.

[nebius_execution]
enabled = false
source_secret_name = ""
runtime_profile_secret_name = ""
image_admission_secret_name = ""
configuration_revision = ""
source_egress_allowlist = []
execution_ingress_cidrs = []
# Optional staging-only private service entry on an existing WireGuard peer node. Binds three host ports exclusively to the peer address, reuses the renewable ingress TLS Secret, and creates no public ingress or credentials.

[nebius_private_entry]
enabled = false
node_name = ""
wireguard_address = ""
peer_address = ""
proxy_image = ""
# PgBouncer transaction-mode connection multiplexer. When enabled, renders a Deployment (2 replicas), Service (loom-pgbouncer:6432), PodDisruptionBudget, and NetworkPolicy; bootstrap populates *-db-url-pool secrets by deriving from the direct DSN. Disable it, re-render, and redeploy to make services fall back to db_url (direct). See docs/architecture/pgbouncer.md.

[pgbouncer]
enabled = true
default_pool_size = 25
max_client_conn = 500
min_pool_size = 5
# Postgres runtime tuning. max_connections leaves room for PgBouncer backend pools, LISTEN watchers, Alembic, and administrative connections.

[postgres]
max_connections = 150

[replicas]
service = 2
control_plane = 2
gateway = 2
web = 0
worker = 3
egress_xds = 0
egress_proxy = 0
pgbouncer = 2
# Cluster topology. `multi_node=true` renders Postgres through CloudNativePG, distributed MinIO, cross-node anti-affinity, and disruption budgets; `storage_backend=longhorn` requests the Longhorn StorageClass. `multi_node=false` renders single-pod Postgres and MinIO. Profiles must pin values that match the target cluster and its installed operators and storage classes. Supported storage backends are `host_path` and `longhorn`.

[topology]
multi_node = false
storage_backend = "host_path"
postgres_replicas = 1
minio_replicas = 1
min_available = 1
anti_affinity = "preferred"
# Production worker Deployment capacity knobs. One worker pod handles max_concurrent trials; replicas.worker multiplies total in-cluster trial slots.

[worker_capacity]
max_concurrent = 16
cpu_request = "500m"
cpu_limit = "8"
memory_request = "1Gi"
memory_limit = "16Gi"
# Canonical v1 workload-trust contract injected into loom-service.

[workload_contract]
workload_trust_mode = "internal_trusted"
taskset_transforms_enabled = false
taskset_transform_network_isolated = false
untrusted_workload_isolation = false

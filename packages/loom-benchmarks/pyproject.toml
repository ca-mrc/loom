[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "loom-benchmarks"
version = "0.1.0"
description = "Benchmark/task adapters for Loom."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "loom-bundle-checksum>=0.1.0,<0.2",
    "datasets>=5.0.1,<6",
    "fsspec[http]>=2026.6,<2027",
    "huggingface-hub>=0.30,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
]

[tool.uv.sources]
loom-bundle-checksum = { workspace = true }

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "pytest-asyncio>=1.3,<2"]

[project.entry-points."loom.benchmarks"]
# Each AIME year has its own adapter. The 2022-2024 adapters filter
# `AI-MO/aimo-validation-aime`; AIME 2025 uses MathArena. Every standalone
# adapter declares a series for the SPA taxonomy.
aime-22 = "loom_benchmarks.adapters.aime:AIME22Adapter"
aime-23 = "loom_benchmarks.adapters.aime:AIME23Adapter"
aime-24 = "loom_benchmarks.adapters.aime:AIME24Adapter"
aime-25 = "loom_benchmarks.adapters.aime_2025:AIME25Adapter"
bfcl = "loom_benchmarks.adapters.bfcl:BFCLAdapter"
browsecomp = "loom_benchmarks.adapters.browsecomp:BrowseCompAdapter"
gaia = "loom_benchmarks.adapters.gaia:GAIAAdapter"
gpqa = "loom_benchmarks.adapters.gpqa:GPQAAdapter"
gpqa-diamond = "loom_benchmarks.adapters.gpqa:GPQADiamondAdapter"
hendrycks-math = "loom_benchmarks.adapters.hendrycks_math:HendrycksMATHAdapter"
math-500 = "loom_benchmarks.adapters.hendrycks_math:MATH500Adapter"
humaneval = "loom_benchmarks.adapters.humaneval:HumanEvalAdapter"
livecodebench = "loom_benchmarks.adapters.livecodebench:LiveCodeBenchAdapter"
mbpp = "loom_benchmarks.adapters.mbpp:MBPPAdapter"
mmlu-pro = "loom_benchmarks.adapters.mmlu_pro:MMLUProAdapter"
osworld = "loom_benchmarks.adapters.osworld:OSWorldAdapter"
skillflow = "loom_benchmarks.adapters.skillflow:SkillFlowAdapter"
skillflow-iterative = "loom_benchmarks.adapters.skillflow:SkillFlowIterativeAdapter"
skilllearnbench = "loom_benchmarks.adapters.skilllearnbench:SkillLearnBenchAdapter"
# SkillLearnBench baseline-matrix rows.
"skilllearnbench-human-authored" = "loom_benchmarks.adapters.skilllearnbench:SkillLearnBenchHumanAuthoredAdapter"
"skilllearnbench-b1-one-shot-claude-haiku-4-5" = "loom_benchmarks.adapters.skilllearnbench:SkillLearnBenchB1OneShotClaudeHaiku45Adapter"
"skilllearnbench-b1-one-shot-claude-opus-4-6" = "loom_benchmarks.adapters.skilllearnbench:SkillLearnBenchB1OneShotClaudeOpus46Adapter"
"skilllearnbench-b1-one-shot-claude-sonnet-4-6" = "loom_benchmarks.adapters.skilllearnbench:SkillLearnBenchB1OneShotClaudeSonnet46Adapter"
"skilllearnbench-b1-one-shot-gemini-3-flash-preview" = "loom_benchmarks.adapters.skilllearnbench:SkillLearnBenchB1OneShotGemini3FlashPreviewAdapter"
"skilllearnbench-b1-one-shot-gemini-3.1-flash-lite-preview" = "loom_benchmarks.adapters.skilllearnbench:SkillLearnBenchB1OneShotGemini31FlashLitePreviewAdapter"
"skilllearnbench-b1-one-shot-gemini-3.1-pro-preview" = "loom_benchmarks.adapters.skilllearnbench:SkillLearnBenchB1OneShotGemini31ProPreviewAdapter"
"skilllearnbench-b2-self-feedback-claude-haiku-4-5" = "loom_benchmarks.adapters.skilllearnbench:SkillLearnBenchB2SelfFeedbackClaudeHaiku45Adapter"
"skilllearnbench-b2-self-feedback-claude-opus-4-6" = "loom_benchmarks.adapters.skilllearnbench:SkillLearnBenchB2SelfFeedbackClaudeOpus46Adapter"
"skilllearnbench-b2-self-feedback-claude-sonnet-4-6" = "loom_benchmarks.adapters.skilllearnbench:SkillLearnBenchB2SelfFeedbackClaudeSonnet46Adapter"
"skilllearnbench-b2-self-feedback-gemini-3-flash-preview" = "loom_benchmarks.adapters.skilllearnbench:SkillLearnBenchB2SelfFeedbackGemini3FlashPreviewAdapter"
"skilllearnbench-b2-self-feedback-gemini-3.1-flash-lite-preview" = "loom_benchmarks.adapters.skilllearnbench:SkillLearnBenchB2SelfFeedbackGemini31FlashLitePreviewAdapter"
"skilllearnbench-b2-self-feedback-gemini-3.1-pro-preview" = "loom_benchmarks.adapters.skilllearnbench:SkillLearnBenchB2SelfFeedbackGemini31ProPreviewAdapter"
"skilllearnbench-b3-teacher-feedback-claude-haiku-4-5" = "loom_benchmarks.adapters.skilllearnbench:SkillLearnBenchB3TeacherFeedbackClaudeHaiku45Adapter"
"skilllearnbench-b3-teacher-feedback-claude-opus-4-6" = "loom_benchmarks.adapters.skilllearnbench:SkillLearnBenchB3TeacherFeedbackClaudeOpus46Adapter"
"skilllearnbench-b3-teacher-feedback-claude-sonnet-4-6" = "loom_benchmarks.adapters.skilllearnbench:SkillLearnBenchB3TeacherFeedbackClaudeSonnet46Adapter"
"skilllearnbench-b3-teacher-feedback-gemini-3-flash-preview" = "loom_benchmarks.adapters.skilllearnbench:SkillLearnBenchB3TeacherFeedbackGemini3FlashPreviewAdapter"
"skilllearnbench-b3-teacher-feedback-gemini-3.1-flash-lite-preview" = "loom_benchmarks.adapters.skilllearnbench:SkillLearnBenchB3TeacherFeedbackGemini31FlashLitePreviewAdapter"
"skilllearnbench-b3-teacher-feedback-gemini-3.1-pro-preview" = "loom_benchmarks.adapters.skilllearnbench:SkillLearnBenchB3TeacherFeedbackGemini31ProPreviewAdapter"
"skilllearnbench-b4-skill-creator-claude-haiku-4-5" = "loom_benchmarks.adapters.skilllearnbench:SkillLearnBenchB4SkillCreatorClaudeHaiku45Adapter"
"skilllearnbench-b4-skill-creator-claude-opus-4-6" = "loom_benchmarks.adapters.skilllearnbench:SkillLearnBenchB4SkillCreatorClaudeOpus46Adapter"
"skilllearnbench-b4-skill-creator-claude-sonnet-4-6" = "loom_benchmarks.adapters.skilllearnbench:SkillLearnBenchB4SkillCreatorClaudeSonnet46Adapter"
"skilllearnbench-b4-skill-creator-gemini-3-flash-preview" = "loom_benchmarks.adapters.skilllearnbench:SkillLearnBenchB4SkillCreatorGemini3FlashPreviewAdapter"
"skilllearnbench-b4-skill-creator-gemini-3.1-flash-lite-preview" = "loom_benchmarks.adapters.skilllearnbench:SkillLearnBenchB4SkillCreatorGemini31FlashLitePreviewAdapter"
"skilllearnbench-b4-skill-creator-gemini-3.1-pro-preview" = "loom_benchmarks.adapters.skilllearnbench:SkillLearnBenchB4SkillCreatorGemini31ProPreviewAdapter"
# SkillLearnBench online-mode seed rows use claude-haiku-4-5 as the canonical model.
"skilllearnbench-online-from-human-authored" = "loom_benchmarks.adapters.skilllearnbench:SkillLearnBenchOnlineFromHumanAuthoredAdapter"
"skilllearnbench-online-from-b1-one-shot-claude-haiku-4-5" = "loom_benchmarks.adapters.skilllearnbench:SkillLearnBenchOnlineFromB1OneShotClaudeHaiku45Adapter"
"skilllearnbench-online-from-b2-self-feedback-claude-haiku-4-5" = "loom_benchmarks.adapters.skilllearnbench:SkillLearnBenchOnlineFromB2SelfFeedbackClaudeHaiku45Adapter"
"skilllearnbench-online-from-b3-teacher-feedback-claude-haiku-4-5" = "loom_benchmarks.adapters.skilllearnbench:SkillLearnBenchOnlineFromB3TeacherFeedbackClaudeHaiku45Adapter"
"skilllearnbench-online-from-b4-skill-creator-claude-haiku-4-5" = "loom_benchmarks.adapters.skilllearnbench:SkillLearnBenchOnlineFromB4SkillCreatorClaudeHaiku45Adapter"
swe-bench = "loom_benchmarks.adapters.swe_bench:SWEBenchAdapter"
swe-bench-verified = "loom_benchmarks.adapters.swe_bench_verified:SWEBenchVerifiedAdapter"
swe-bench-multimodal = "loom_benchmarks.adapters.swe_bench_multimodal:SWEBenchMultimodalAdapter"
tau2-bench = "loom_benchmarks.adapters.tau2_bench:Tau2BenchAdapter"
webarena = "loom_benchmarks.adapters.webarena:WebArenaAdapter"

[tool.hatch.build.targets.wheel]
packages = ["loom_benchmarks"]

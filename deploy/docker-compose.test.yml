# Compose stack for full-stack system tests (tests/system/*).
# Brought up by tests/system/docker_compose.py at session start; torn
# down at session end. NOT for development — use docker-compose.dev.yml
# for that.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: loom
      POSTGRES_PASSWORD: loom
      POSTGRES_DB: loom
    ports:
      # The pytest harness requests port 0 and reads Docker's assigned port.
      # Manual compose use keeps the familiar loopback-only default.
      - "127.0.0.1:${LOOM_SYSTEM_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      # initdb's temporary server accepts Unix sockets before final TCP startup.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "loom", "-d", "loom"]
      interval: 2s
      timeout: 2s
      retries: 20

  minio:
    # Shared upstream release and digest: tests/integration/minio_test_images.py.
    image: ${LOOM_SYSTEM_MINIO_IMAGE:-quay.io/minio/minio@sha256:031fd97adca056cdbfd416a26670898d93adb9a79a3cf126aac5a41ddc22c5a3}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: loomtest
      MINIO_ROOT_PASSWORD: loomtest
    ports:
      - "127.0.0.1:${LOOM_SYSTEM_MINIO_PORT:-59000}:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 20

  registry:
    image: registry:2
    ports:
      - "127.0.0.1:${LOOM_SYSTEM_REGISTRY_PORT:-55000}:5000"

  llm-gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    environment:
      LOOM_GW_DB_URL: postgresql+psycopg://loom:loom@postgres/loom
      LOOM_GW_ANTHROPIC_API_KEY: stub-key
      LOOM_GW_MINIO_ENDPOINT: http://minio:9000
      LOOM_GW_MINIO_ACCESS_KEY: loomtest
      LOOM_GW_MINIO_SECRET_KEY: loomtest
      # Test-only shared key. MUST match LOOM_CP_STEP_JWT_SIGNING_KEY.
      LOOM_GW_STEP_JWT_SIGNING_KEY: test-step-jwt-signing-key-do-not-use-in-prod
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LOOM_SYSTEM_GATEWAY_PORT:-59100}:9100"

  control-plane:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.control-plane
    environment:
      LOOM_ENV: development
      LOOM_LOCAL_EXECUTION: "1"
      LOOM_CP_DB_URL: postgresql+psycopg://loom:loom@postgres/loom
      LOOM_CP_MINIO_ENDPOINT: http://minio:9000
      LOOM_CP_MINIO_ACCESS_KEY: loomtest
      LOOM_CP_MINIO_SECRET_KEY: loomtest
      LOOM_CP_LLM_GATEWAY_URL: http://llm-gateway:9100
      # Test-only shared key. MUST match LOOM_GW_STEP_JWT_SIGNING_KEY.
      LOOM_CP_STEP_JWT_SIGNING_KEY: test-step-jwt-signing-key-do-not-use-in-prod
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LOOM_SYSTEM_CONTROL_PLANE_PORT:-58080}:8080"

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    environment:
      LOOM_ENV: development
      LOOM_LOCAL_EXECUTION: "1"
      LOOM_WORKER_CONTROL_PLANE_URL: http://control-plane:8080
      LOOM_WORKER_GATEWAY_URL: http://llm-gateway:9100
      # Trial containers outlive the worker and are outside Compose's own
      # labels. Keep crash recovery inside this stack's ownership boundary.
      LOOM_WORKER_SANDBOX_IDENTITY: ${COMPOSE_PROJECT_NAME}
      # MUST be set in the caller's environment before docker compose up.
      # tests/system/docker_compose.py runs the seed script first to mint
      # a real worker token, exports LOOM_WORKER_TOKEN, then brings this
      # service up. Compose substitutes the env var at parse time — if
      # it isn't set, the worker container is intentionally NOT started
      # (profile=needs_token gates the service).
      LOOM_WORKER_TOKEN: "${LOOM_WORKER_TOKEN:?LOOM_WORKER_TOKEN must be set before compose-up}"
      LOOM_WORKER_MINIO_ENDPOINT: http://minio:9000
      LOOM_WORKER_MINIO_ACCESS_KEY: loomtest
      LOOM_WORKER_MINIO_SECRET_KEY: loomtest
      # System-test tasks are seeded with `fixture://<task_id>` sources; the
      # worker materializes them from this test-only, read-only fixtures root.
      LOOM_WORKER_FIXTURES_ROOT: /app/tests/fixtures/tasks
      # Keep cancellation observation fast for the bounded startup canary.
      # Production keeps the schema-owned default; this applies only here.
      LOOM_WORKER_TRIAL_CANCEL_POLL_INTERVAL_SEC: "0.1"
      # The compose suite validates worker execution, not the host-pressure
      # admission policy. Docker Desktop and hosted runners expose different
      # swap/PSI values; keep those host signals from making system smoke
      # wait five minutes or fail before it can build the fixture image.
      LOOM_WORKER_SETUP_HEALTH_GUARD_ENABLED: "false"
      LOOM_WORKER_TASK_IMAGE_STORAGE_PROBE_PATH: /run/loom/docker-storage-probe
    profiles: ["worker"]
    depends_on:
      control-plane:
        condition: service_started
    volumes:
      - ../tests/fixtures/tasks:/app/tests/fixtures/tasks:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - task_image_builder_storage_probe:/run/loom/docker-storage-probe:ro

  task-image-builder:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    command: ["python", "-m", "loom_worker.task_image_builder"]
    environment:
      # Shared image caches have no exclusive project owner; this identity
      # also prevents builder storage cleanup from evicting shared images.
      LOOM_WORKER_SANDBOX_IDENTITY: ${COMPOSE_PROJECT_NAME}
      LOOM_ENV: development
      LOOM_LOCAL_EXECUTION: "1"
      LOOM_WORKER_CONTROL_PLANE_URL: http://control-plane:8080
      LOOM_WORKER_TOKEN: "${LOOM_TASK_IMAGE_BUILDER_TOKEN:?LOOM_TASK_IMAGE_BUILDER_TOKEN must be set before builder compose-up}"
      LOOM_WORKER_MINIO_ENDPOINT: http://minio:9000
      LOOM_WORKER_MINIO_ACCESS_KEY: loomtest
      LOOM_WORKER_MINIO_SECRET_KEY: loomtest
      LOOM_WORKER_FIXTURES_ROOT: /app/tests/fixtures/tasks
      # Docker runs on the host through the mounted socket, so loopback reaches
      # the registry's published host port and yields real RepoDigests for the
      # subsequent pull-only trial worker.
      LOOM_WORKER_TRIAL_CACHE_REGISTRY_REPO: ${LOOM_SYSTEM_REGISTRY_REPO:-localhost:55000/loom-task-images}
      LOOM_WORKER_TASK_IMAGE_BUILDER_IDLE_EXIT_SECONDS: "120"
      LOOM_WORKER_TASK_IMAGE_STORAGE_PROBE_PATH: /run/loom/docker-storage-probe
    profiles: ["task-image-builder"]
    depends_on:
      control-plane:
        condition: service_started
      registry:
        condition: service_started
    volumes:
      - ../tests/fixtures/tasks:/app/tests/fixtures/tasks:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - task_image_builder_storage_probe:/run/loom/docker-storage-probe:ro

volumes:
  task_image_builder_storage_probe:

# Local development stack. Differs from docker-compose.test.yml in three
# ways: (1) mounts ../src into each loom_* container so edits land
# without a rebuild, (2) persists postgres + minio data across runs,
# (3) reads team/worker/builder tokens from `.env` and mounts the file-backed
# singleton admin secret generated by `loom service up`.
#
# Quickstart (run from the repo root):
#   loom service up
#
# Manual equivalent:
#   loom service init-admin --secret-file .loom/admin/secrets.toml
#   docker compose --env-file .env -f deploy/docker-compose.dev.yml up -d postgres minio
#   alembic -c database/migrations/alembic.ini upgrade head
#   docker compose --env-file .env -f deploy/docker-compose.dev.yml up -d
#   python scripts/seed_test_data.py --mode dev --print all
#   # Put the printed team/worker/builder tokens in .env. Keep the admin token
#   # in .loom/admin/secrets.toml; reveal it only for explicit admin API calls.
#
# `loom service up` passes `--env-file .env` explicitly so compose reads repo
# root tokens without changing bind-mount resolution. If you run compose by
# hand, keep the explicit `--env-file .env` form; changing the project
# directory can make `../src` resolve outside the repo checkout.
# DB-facing services refuse to start when the database Alembic revision is
# behind repository code; `loom service up` runs migrations before token seeding.
#
# Endpoint map (matches the k8s ingress in deploy/k8s/):
#   localhost:5173   React SPA via Vite HMR (the user panel)
#   localhost:8090   loom_service (user-facing REST at /api/v1/*)
#   localhost:8080   control_plane (worker-facing, normally internal-only)
#   localhost:9100   llm_gateway   (agent-facing)
#   localhost:9000   minio S3 API
#   localhost:9001   minio console
#   localhost:55000  loopback task-image registry (laptop builder only)
#
# Host port bindings default to loopback through
# LOOM_DEV_BIND_ADDR=127.0.0.1. Shared-dev operators may opt in to
# wider exposure with LOOM_DEV_BIND_ADDR=0.0.0.0, but public access
# should use the k8s/cluster ingress path instead of dev compose.
#
# Hot-reload: the three uvicorn services (loom_service / control_plane /
# llm_gateway) run with `LOOM_*_DEV_RELOAD=1` so Python edits to
# anything under `src/` hot-restart the process. The SPA runs through
# Vite's own HMR. Worker stays manual: `docker compose restart worker`
# after editing worker code.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: "${LOOM_DEV_POSTGRES_USER:-loom}"
      POSTGRES_PASSWORD: "${LOOM_DEV_POSTGRES_PASSWORD:-loom}"
      POSTGRES_DB: "${LOOM_DEV_POSTGRES_DB:-loom}"
    ports:
      - "${LOOM_DEV_BIND_ADDR:-127.0.0.1}:${LOOM_DEV_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 2s
      retries: 20

  minio:
    # Quay pin — Docker Hub `minio/minio` denies anonymous pulls (#1969).
    # RELEASE.2025-09-07T16-13-09Z (same digest as tests/support/minio_images.MINIO_TLS_IMAGE).
    # Do not downgrade to the 2022 testcontainers pin: existing laptop volumes
    # already use newer xl headers and fail to start on the older binary.
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${LOOM_DEV_MINIO_ROOT_USER:-loomdev}"
      MINIO_ROOT_PASSWORD: "${LOOM_DEV_MINIO_ROOT_PASSWORD:-loomdev123}"
    ports:
      - "${LOOM_DEV_BIND_ADDR:-127.0.0.1}:${LOOM_DEV_MINIO_PORT:-9000}:9000"
      - "${LOOM_DEV_BIND_ADDR:-127.0.0.1}:${LOOM_DEV_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 20

  llm-gateway:
    image: loom-llm-gateway:${LOOM_DEV_IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    environment:
      LOOM_GW_DB_URL: "postgresql+psycopg://${LOOM_DEV_POSTGRES_USER:-loom}:${LOOM_DEV_POSTGRES_PASSWORD:-loom}@postgres/${LOOM_DEV_POSTGRES_DB:-loom}"
      LOOM_GW_ANTHROPIC_API_KEY: ${LOOM_GW_ANTHROPIC_API_KEY:-stub-key}
      LOOM_GW_OPENAI_API_KEY: ${LOOM_GW_OPENAI_API_KEY:-stub-key}
      LOOM_GW_GOOGLE_API_KEY: "${LOOM_GW_GOOGLE_API_KEY:-}"
      LOOM_GW_DEV_RELOAD: "1"
      LOOM_GW_ADMIN_SECRET_FILE: /var/run/loom/admin/secrets.toml
      # HS256 secret shared with the Control Plane to sign + verify
      # step-scoped agent JWTs. Dev-only; production deploys provide
      # this via a k8s Secret. MUST match LOOM_CP_STEP_JWT_SIGNING_KEY
      # below — both services need to derive the same MAC.
      LOOM_GW_STEP_JWT_SIGNING_KEY: "${LOOM_CP_STEP_JWT_SIGNING_KEY:-dev-only-shared-jwt-key-do-not-use-in-prod}"
      # Gateway needs the secret-store key to decrypt provider API keys.
      # Same value loom-service uses (auto-generated by `loom service up`).
      LOOM_SECRET_STORE_MASTER_KEY: "${LOOM_SECRET_STORE_MASTER_KEY:-}"
      LOOM_GW_MINIO_ENDPOINT: http://minio:9000
      LOOM_GW_MINIO_ACCESS_KEY: "${LOOM_DEV_MINIO_ROOT_USER:-loomdev}"
      LOOM_GW_MINIO_SECRET_KEY: "${LOOM_DEV_MINIO_ROOT_PASSWORD:-loomdev123}"
      # Route every facade upstream call through Envoy.
      # Empty by default → fall through to direct mode; the dev compose
      # opts in so development exercises the chain end-to-end. Set it to an
      # empty string and rerun `loom service up` to use direct mode.
      LOOM_GW_EGRESS_PROXY_URL: "${LOOM_GW_EGRESS_PROXY_URL-http://egress-proxy:30443}"
      # QA matrix relay api-key passthrough (see loom-service block below).
      LOOM_QA_RELAY_API_KEY: "${LOOM_QA_RELAY_API_KEY:-}"
    volumes:
      - ../src:/app/src
      - ../packages:/app/packages
      - ${LOOM_DEV_ADMIN_SECRET_FILE:-../.loom/admin/secrets.toml}:/var/run/loom/admin/secrets.toml:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${LOOM_DEV_BIND_ADDR:-127.0.0.1}:${LOOM_DEV_LLM_GATEWAY_PORT:-9100}:9100"
    restart: on-failure
    # python -c probe rather than curl because Dockerfile.gateway is
    # python:3.11-slim and slim images don't ship curl. Reusing the
    # base interpreter keeps the image size unchanged.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9100/healthz', timeout=1).status == 200 else 1)"]
      interval: 2s
      timeout: 3s
      retries: 30

  control-plane:
    image: loom-control-plane:${LOOM_DEV_IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.control-plane
    environment:
      LOOM_ENV: development
      LOOM_LOCAL_EXECUTION: "1"
      LOOM_CP_DB_URL: "postgresql+psycopg://${LOOM_DEV_POSTGRES_USER:-loom}:${LOOM_DEV_POSTGRES_PASSWORD:-loom}@postgres/${LOOM_DEV_POSTGRES_DB:-loom}"
      LOOM_CP_MINIO_ENDPOINT: http://minio:9000
      LOOM_CP_MINIO_ACCESS_KEY: "${LOOM_DEV_MINIO_ROOT_USER:-loomdev}"
      LOOM_CP_MINIO_SECRET_KEY: "${LOOM_DEV_MINIO_ROOT_PASSWORD:-loomdev123}"
      LOOM_CP_LLM_GATEWAY_URL: http://llm-gateway:9100
      LOOM_CP_LOG_LEVEL: debug
      LOOM_CP_DEV_RELOAD: "1"
      LOOM_CP_ADMIN_SECRET_FILE: /var/run/loom/admin/secrets.toml
      # MUST match LOOM_GW_STEP_JWT_SIGNING_KEY on the llm-gateway
      # service — the two derive the same HS256 MAC to sign + verify
      # step-scoped agent JWTs. Dev-only; production uses k8s Secret.
      LOOM_CP_STEP_JWT_SIGNING_KEY: "${LOOM_CP_STEP_JWT_SIGNING_KEY:-dev-only-shared-jwt-key-do-not-use-in-prod}"
    volumes:
      - ../src:/app/src
      - ../packages:/app/packages
      - ${LOOM_DEV_ADMIN_SECRET_FILE:-../.loom/admin/secrets.toml}:/var/run/loom/admin/secrets.toml:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${LOOM_DEV_BIND_ADDR:-127.0.0.1}:${LOOM_DEV_CONTROL_PLANE_PORT:-8080}:8080"
    restart: on-failure
    # python -c probe (see llm-gateway above for rationale).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz', timeout=1).status == 200 else 1)"]
      interval: 2s
      timeout: 3s
      retries: 30

  loom-service:
    image: loom-service:${LOOM_DEV_IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
    environment:
      LOOM_ENV: development
      LOOM_LOCAL_EXECUTION: "1"
      LOOM_SVC_DB_URL: "postgresql+psycopg://${LOOM_DEV_POSTGRES_USER:-loom}:${LOOM_DEV_POSTGRES_PASSWORD:-loom}@postgres/${LOOM_DEV_POSTGRES_DB:-loom}"
      LOOM_SVC_MINIO_ENDPOINT: http://minio:9000
      LOOM_SVC_MINIO_ACCESS_KEY: "${LOOM_DEV_MINIO_ROOT_USER:-loomdev}"
      LOOM_SVC_MINIO_SECRET_KEY: "${LOOM_DEV_MINIO_ROOT_PASSWORD:-loomdev123}"
      LOOM_SVC_TRAJECTORIES_BUCKET: "${LOOM_DEV_TRAJECTORIES_BUCKET:-trajectories}"
      LOOM_SVC_ARTIFACTS_BUCKET: "${LOOM_DEV_ARTIFACTS_BUCKET:-artifacts}"
      LOOM_SVC_CONTROL_PLANE_URL: http://control-plane:8080/
      LOOM_SVC_GATEWAY_URL: http://llm-gateway:9100/
      LOOM_SVC_LOG_LEVEL: debug
      LOOM_SVC_DEV_RELOAD: "1"
      LOOM_SVC_AUTH_LOCAL_HTTP: "true"
      LOOM_SVC_AUTH_SESSION_TTL_SEC: "${LOOM_SVC_AUTH_SESSION_TTL_SEC:-604800}"
      LOOM_SVC_AUTH_LOGIN_CHALLENGE_TTL_SEC: "${LOOM_SVC_AUTH_LOGIN_CHALLENGE_TTL_SEC:-900}"
      LOOM_SVC_AUTH_RETURN_LOGIN_TOKEN: "${LOOM_SVC_AUTH_RETURN_LOGIN_TOKEN:-false}"
      LOOM_SVC_TEAM_REGISTRATION_OPEN: "${LOOM_SVC_TEAM_REGISTRATION_OPEN:-false}"
      LOOM_SVC_ADMIN_SECRET_FILE: /var/run/loom/admin/secrets.toml
      # Minted by `loom service up` via POST /admin/batch-runner-tokens
      # and written to .env. Without this token the batch fan-out loop
      # logs a warning and batches sit at state=submitted.
      LOOM_SVC_BATCH_RUNNER_CP_TOKEN: "${LOOM_SVC_BATCH_RUNNER_CP_TOKEN:-}"
      # Auto-generated by `loom service up` and written to .env once.
      # Never rotated automatically — rotating the key makes all stored
      # provider-connection secrets unreadable.
      LOOM_SECRET_STORE_MASTER_KEY: "${LOOM_SECRET_STORE_MASTER_KEY:-}"
      # QA matrix relay (`loom qa matrix`) — local-dev convenience so
      # the `env:LOOM_QA_RELAY_API_KEY` api-key reference in the
      # qa-relay provider connection resolves inside this container.
      # Optional; safe to leave unset.
      LOOM_QA_RELAY_API_KEY: "${LOOM_QA_RELAY_API_KEY:-}"
    volumes:
      - ../src:/app/src
      - ../packages:/app/packages
      - ${LOOM_DEV_ADMIN_SECRET_FILE:-../.loom/admin/secrets.toml}:/var/run/loom/admin/secrets.toml:ro
    depends_on:
      postgres:
        condition: service_healthy
      control-plane:
        condition: service_healthy
    ports:
      - "${LOOM_DEV_BIND_ADDR:-127.0.0.1}:${LOOM_DEV_LOOM_SERVICE_PORT:-8090}:8090"
    restart: on-failure

  worker:
    image: loom-worker:${LOOM_DEV_IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    environment:
      LOOM_ENV: development
      LOOM_LOCAL_EXECUTION: "1"
      LOOM_WORKER_CONTROL_PLANE_URL: http://control-plane:8080
      LOOM_WORKER_GATEWAY_URL: http://llm-gateway:9100
      # Trial containers spawned by the worker are NOT on `deploy_default`,
      # so the compose-internal `llm-gateway` DNS name doesn't resolve there.
      # Override the agent-facing gateway URL to the host-mapped port so the
      # in-trial agent CLI (claude-code, codex, etc.) can reach the gateway.
      # `_sandbox_extra_hosts_for_url` adds the matching `host-gateway`
      # mapping to each trial container when this URL's hostname is
      # `host.docker.internal`. Without this, real-model trials get
      # `FailedToOpenSocket` retries until they exhaust the agent's retry
      # budget (10× by default for claude-code).
      LOOM_WORKER_SUBPROCESS_GATEWAY_URL: "http://host.docker.internal:${LOOM_DEV_LLM_GATEWAY_PORT:-9100}"
      LOOM_WORKER_TOKEN: "${LOOM_WORKER_TOKEN:-placeholder}"
      LOOM_WORKER_MINIO_ENDPOINT: http://minio:9000
      LOOM_WORKER_MINIO_ACCESS_KEY: "${LOOM_DEV_MINIO_ROOT_USER:-loomdev}"
      LOOM_WORKER_MINIO_SECRET_KEY: "${LOOM_DEV_MINIO_ROOT_PASSWORD:-loomdev123}"
      LOOM_WORKER_MINIO_MAX_POOL_CONNECTIONS: "${LOOM_WORKER_MINIO_MAX_POOL_CONNECTIONS:-256}"
      LOOM_WORKER_MINIO_CONNECT_TIMEOUT_SEC: "${LOOM_WORKER_MINIO_CONNECT_TIMEOUT_SEC:-5}"
      LOOM_WORKER_MINIO_READ_TIMEOUT_SEC: "${LOOM_WORKER_MINIO_READ_TIMEOUT_SEC:-120}"
      LOOM_WORKER_MINIO_OPERATION_TIMEOUT_SEC: "${LOOM_WORKER_MINIO_OPERATION_TIMEOUT_SEC:-300}"
      LOOM_WORKER_MINIO_OPERATION_ATTEMPTS: "${LOOM_WORKER_MINIO_OPERATION_ATTEMPTS:-3}"
      LOOM_WORKER_TASK_MATERIALIZE_TIMEOUT_SEC: "${LOOM_WORKER_TASK_MATERIALIZE_TIMEOUT_SEC:-300}"
      LOOM_WORKER_DOCKER_API_TIMEOUT_SEC: "${LOOM_WORKER_DOCKER_API_TIMEOUT_SEC:-1800}"
      LOOM_WORKER_LOG_LEVEL: debug
      LOOM_WORKER_MAX_CONCURRENT: "${LOOM_WORKER_MAX_CONCURRENT:-5}"
      LOOM_TASK_IMAGE_BUILD_MAX_FILES: "${LOOM_TASK_IMAGE_BUILD_MAX_FILES:-2000}"
      LOOM_TASK_IMAGE_BUILD_MAX_BYTES: "${LOOM_TASK_IMAGE_BUILD_MAX_BYTES:-536870912}"
      LOOM_WORKER_TASK_IMAGE_STORAGE_PROBE_PATH: /run/loom/docker-storage-probe
      # Leave LOOM_WORKER_BLOCKING_IO_MAX_WORKERS unset so the worker derives
      # it from LOOM_WORKER_MAX_CONCURRENT. Set explicitly only for capacity
      # sweeps that need to isolate blocking Docker/S3/HF calls.
      # Where the worker resolves `fixture://<task_id>` sources to —
      # paired with the bind-mount below so the canary hello-world
      # task in tests/fixtures/tasks/ runs end-to-end without a bundle
      # upload to MinIO.
      LOOM_WORKER_FIXTURES_ROOT: /app/tests/fixtures/tasks
      LOOM_OPENHANDS_TERMINUS_STYLE: "${LOOM_OPENHANDS_TERMINUS_STYLE:-}"
      # Host Docker daemon pulls/pushes via the published loopback registry
      # port. Same contract as tests/system: the socket is on the host, so
      # localhost:<port> is the laptop, not the worker container.
      LOOM_WORKER_TRIAL_CACHE_REGISTRY_REPO: "localhost:${LOOM_DEV_REGISTRY_PORT:-55000}/loom-task-images"
    volumes:
      - ../src:/app/src
      - ../packages:/app/packages
      - ../tests/fixtures:/app/tests/fixtures:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - task_image_builder_storage_probe:/run/loom/docker-storage-probe:ro
      - worker_trajectories:/var/lib/loom/trajectories
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      control-plane:
        condition: service_healthy
    restart: on-failure

  # Loopback registry + laptop Docker builder. Trial workers stay pull-only;
  # this sidecar
  # is the only local materialization producer (#1462).
  registry:
    image: registry:2
    ports:
      - "${LOOM_DEV_BIND_ADDR:-127.0.0.1}:${LOOM_DEV_REGISTRY_PORT:-55000}:5000"
    restart: unless-stopped

  task-image-builder:
    image: loom-worker:${LOOM_DEV_IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    command: ["python", "-m", "loom_worker.task_image_builder"]
    environment:
      LOOM_ENV: development
      LOOM_LOCAL_EXECUTION: "1"
      LOOM_WORKER_CONTROL_PLANE_URL: http://control-plane:8080
      LOOM_WORKER_TOKEN: "${LOOM_TASK_IMAGE_BUILDER_TOKEN:-placeholder}"
      LOOM_WORKER_MINIO_ENDPOINT: http://minio:9000
      LOOM_WORKER_MINIO_ACCESS_KEY: "${LOOM_DEV_MINIO_ROOT_USER:-loomdev}"
      LOOM_WORKER_MINIO_SECRET_KEY: "${LOOM_DEV_MINIO_ROOT_PASSWORD:-loomdev123}"
      LOOM_WORKER_LOG_LEVEL: debug
      LOOM_WORKER_FIXTURES_ROOT: /app/tests/fixtures/tasks
      LOOM_WORKER_TRIAL_CACHE_REGISTRY_REPO: "localhost:${LOOM_DEV_REGISTRY_PORT:-55000}/loom-task-images"
      LOOM_TASK_IMAGE_BUILD_MAX_FILES: "${LOOM_TASK_IMAGE_BUILD_MAX_FILES:-2000}"
      LOOM_TASK_IMAGE_BUILD_MAX_BYTES: "${LOOM_TASK_IMAGE_BUILD_MAX_BYTES:-536870912}"
      LOOM_WORKER_TASK_IMAGE_STORAGE_PROBE_PATH: /run/loom/docker-storage-probe
      # Keep the laptop sidecar looping; Compose restarts a clean idle-exit.
      LOOM_WORKER_TASK_IMAGE_BUILDER_IDLE_EXIT_SECONDS: "86400"
    volumes:
      - ../src:/app/src
      - ../packages:/app/packages
      - ../tests/fixtures:/app/tests/fixtures:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - task_image_builder_storage_probe:/run/loom/docker-storage-probe:ro
    depends_on:
      control-plane:
        condition: service_healthy
      registry:
        condition: service_started
    restart: unless-stopped

  # egress-proxy and egress-xds are wired into the development stack.
  # Mirrors the production deploy: gateway-router's outbound provider
  # traffic flows through Envoy on :30443. HTTPS provider calls use
  # CONNECT; HTTP provider calls use ordinary forward-proxy routing.
  # Envoy fetches its CDS+RDS config from the xds-server on :18000
  # (which reads provider_connections from Postgres).
  egress-xds:
    image: loom-egress-xds:${LOOM_DEV_IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.egress-xds
    environment:
      LOOM_EGRESS_XDS_DB_URL: "postgresql://${LOOM_DEV_POSTGRES_USER:-loom}:${LOOM_DEV_POSTGRES_PASSWORD:-loom}@postgres:5432/${LOOM_DEV_POSTGRES_DB:-loom}"
      LOOM_EGRESS_XDS_LISTEN_ADDR: 0.0.0.0:18000
      LOOM_EGRESS_XDS_LOG_LEVEL: info
    # The production Envoy bootstrap (deploy/envoy/egress-proxy.yaml)
    # references this hostname for the static `xds_cluster`. Aliasing
    # in compose so the bootstrap works unchanged in both compose +
    # k8s — k8s uses the loom-egress-xds Service name.
    networks:
      default:
        aliases:
          - loom-egress-xds
    ports:
      - "${LOOM_DEV_BIND_ADDR:-127.0.0.1}:${LOOM_DEV_EGRESS_XDS_PORT:-18000}:18000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  egress-proxy:
    image: envoyproxy/envoy:v1.30-latest
    # Bind-mount the production bootstrap so edits to
    # deploy/envoy/egress-proxy.yaml take effect on `docker compose
    # restart egress-proxy` — no rebuild needed.
    volumes:
      - ./envoy/egress-proxy.yaml:/etc/envoy/envoy.yaml:ro
    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "warn"]
    ports:
      - "${LOOM_DEV_BIND_ADDR:-127.0.0.1}:${LOOM_DEV_EGRESS_PROXY_PORT:-30443}:30443"
      - "${LOOM_DEV_BIND_ADDR:-127.0.0.1}:${LOOM_DEV_EGRESS_ADMIN_PORT:-9901}:9901"   # Envoy admin
    depends_on:
      egress-xds:
        condition: service_started
    restart: on-failure

  # React SPA — Vite dev server with HMR. `npm ci` installs from the
  # lockfile while keeping node_modules on a named volume instead of
  # the bind-mounted source tree.
  # Keep this Node image pinned: the web package-lock.json is
  # bind-mounted, so floating Node/npm tags can create developer-only
  # lockfile churn if this moves back to `npm install`.
  # Edits to web/ files reload in the browser instantly.
  web:
    image: node:20.19.5-slim
    working_dir: /app
    # VITE_API_PROXY_TARGET overrides the default (localhost:8090)
    # because inside the docker network `localhost` is the web
    # container itself; loom_service is reachable via its compose
    # service name.
    environment:
      VITE_API_PROXY_TARGET: http://loom-service:8090
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"]
    volumes:
      - ../web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "${LOOM_DEV_BIND_ADDR:-127.0.0.1}:${LOOM_DEV_WEB_PORT:-5173}:5173"
    depends_on:
      loom-service:
        condition: service_started

volumes:
  postgres_data:
  minio_data:
  task_image_builder_storage_probe:
  worker_trajectories:
  web_node_modules:

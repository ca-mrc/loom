apiVersion: v1
kind: ConfigMap
metadata:
  name: loom-execution-capacity-collector
  namespace: loom-nebius-development
data:
  LOOM_EXECUTION_CAPACITY_COLLECTOR_SAMPLE_WINDOW_SECONDS: "50"
  LOOM_EXECUTION_CAPACITY_COLLECTOR_SAMPLE_INTERVAL_SECONDS: "15"
  LOOM_EXECUTION_CAPACITY_COLLECTOR_SAMPLE_STOP_BEFORE_MINUTE_SECONDS: "5"
  LOOM_EXECUTION_CAPACITY_COLLECTOR_TARGET_ID: nebius-eu-north1-development
  LOOM_EXECUTION_CAPACITY_COLLECTOR_POOL_ID: nebius-cpu
  LOOM_EXECUTION_CAPACITY_COLLECTOR_NAMESPACE: loom-nebius-development
  LOOM_EXECUTION_CAPACITY_COLLECTOR_NODE_LABEL_SELECTOR: loom.nebius/node-role=execution
  LOOM_EXECUTION_CAPACITY_COLLECTOR_NEBIUS_PROJECT_ID: project-e00ksehzpr00ftw5pe61gt
  LOOM_EXECUTION_CAPACITY_COLLECTOR_NEBIUS_QUOTA_PARENT_ID: tenant-e00zcze7mmwb61vk7e
  LOOM_EXECUTION_CAPACITY_COLLECTOR_NEBIUS_NODE_GROUP_ID: mk8snodegroup-e00n6mbxcz8jgp8bat
  LOOM_EXECUTION_CAPACITY_COLLECTOR_NEBIUS_REGION: eu-north1
  LOOM_EXECUTION_CAPACITY_COLLECTOR_CONTROL_PLANE_URL: http://loom-control-plane.loom.svc.cluster.local:8080
  LOOM_EXECUTION_CAPACITY_COLLECTOR_QUOTA_NODES_NAME: compute.instance.count
  LOOM_EXECUTION_CAPACITY_COLLECTOR_QUOTA_VCPU_NAME: compute.instance.non-gpu.vcpu
  LOOM_EXECUTION_CAPACITY_COLLECTOR_QUOTA_STORAGE_NAME: compute.disk.size.network-ssd
  LOOM_EXECUTION_CAPACITY_COLLECTOR_QUOTA_NODES_UNIT: count
  LOOM_EXECUTION_CAPACITY_COLLECTOR_QUOTA_VCPU_UNIT: count
  LOOM_EXECUTION_CAPACITY_COLLECTOR_QUOTA_STORAGE_UNIT: byte
  LOOM_EXECUTION_CAPACITY_COLLECTOR_QUOTA_SERVICE: compute
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loom-execution-capacity-collector
  namespace: loom-nebius-development
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: loom-execution-capacity-collector
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["nodes/stats"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: loom-execution-capacity-collector
subjects:
  - kind: ServiceAccount
    name: loom-execution-capacity-collector
    namespace: loom-nebius-development
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: loom-execution-capacity-collector
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: loom-execution-capacity-collector
  namespace: loom-nebius-development
spec:
  suspend: false
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 30
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 120
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: loom-execution-capacity-collector
            app.kubernetes.io/part-of: loom
        spec:
          serviceAccountName: loom-execution-capacity-collector
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: prepare-credentials
              image: cr.eu-north1.nebius.cloud/e00na1cny1498503v1/loom-execution-actuator@sha256:69c9c542875be1b55eaa2418643819c606835e94b1d3aaa7f6aa75b61101dd49
              imagePullPolicy: IfNotPresent
              command:
                - python
                - -m
                - loom_execution_capacity_collector.secret_init
                - --source
                - /var/run/loom-projected
                - --destination
                - /var/run/loom-owned/credentials
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              volumeMounts:
                - name: projected-credentials
                  mountPath: /var/run/loom-projected
                  readOnly: true
                - name: credentials
                  mountPath: /var/run/loom-owned
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
          containers:
            - name: collector
              image: cr.eu-north1.nebius.cloud/e00na1cny1498503v1/loom-execution-actuator@sha256:69c9c542875be1b55eaa2418643819c606835e94b1d3aaa7f6aa75b61101dd49
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "loom_execution_capacity_collector"]
              envFrom:
                - configMapRef:
                    name: loom-execution-capacity-collector
              env:
                - name: LOOM_EXECUTION_CAPACITY_COLLECTOR_NEBIUS_CREDENTIALS_FILE
                  value: /var/run/loom-owned/credentials/nebius-credentials.json
                - name: LOOM_EXECUTION_CAPACITY_COLLECTOR_CONTROL_PLANE_BEARER_TOKEN_FILE
                  value: /var/run/loom-owned/credentials/control-plane-token
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 1
                  memory: 512Mi
              volumeMounts:
                - name: credentials
                  mountPath: /var/run/loom-owned
                  readOnly: true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: projected-credentials
              projected:
                defaultMode: 288
                sources:
                  - secret:
                      name: loom-execution-capacity-collector-nebius
                      items:
                        - key: credentials.json
                          path: nebius-credentials.json
                  - secret:
                      name: loom-execution-capacity-collector-control-plane
                      items:
                        - key: token
                          path: control-plane-token
            - name: credentials
              emptyDir: {}
          nodeSelector:
            loom.nebius/node-role: system

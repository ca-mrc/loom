apiVersion: v1
kind: Namespace
metadata:
  name: loom-nebius-development
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: loom-execution-runtime-capacity
  namespace: loom-nebius-development
spec:
  hard:
    pods: "72"
    requests.cpu: "128"
    requests.memory: 512Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loom-execution-actuator
  namespace: loom-nebius-development
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loom-execution-attempt
  namespace: loom-nebius-development
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: loom-execution-actuator
  namespace: loom-nebius-development
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: loom-execution-actuator
  namespace: loom-nebius-development
subjects:
  - kind: ServiceAccount
    name: loom-execution-actuator
    namespace: loom-nebius-development
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: loom-execution-actuator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: loom-execution-actuator-usage
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/stats"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: loom-execution-actuator-usage
subjects:
  - kind: ServiceAccount
    name: loom-execution-actuator
    namespace: loom-nebius-development
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: loom-execution-actuator-usage
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loom-execution-attempt-default-deny
  namespace: loom-nebius-development
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: execution-unit
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loom-execution-attempt-egress
  namespace: loom-nebius-development
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: execution-unit
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchExpressions:
              - key: k8s-app
                operator: In
                values: [kube-dns, coredns]
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: loom
          podSelector:
            matchLabels:
              app: loom-llm-gateway
      ports:
        - {protocol: TCP, port: 9100}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loom-execution-actuator
  namespace: loom-nebius-development
  labels:
    app.kubernetes.io/name: loom-execution-actuator
    app.kubernetes.io/part-of: loom
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loom-execution-actuator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loom-execution-actuator
        app.kubernetes.io/part-of: loom
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8093"
    spec:
      serviceAccountName: loom-execution-actuator
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: actuator
          image: cr.eu-north1.nebius.cloud/e00na1cny1498503v1/loom-execution-actuator@sha256:69c9c542875be1b55eaa2418643819c606835e94b1d3aaa7f6aa75b61101dd49
          imagePullPolicy: IfNotPresent
          env:
            - name: LOOM_EXECUTION_ACTUATOR_DB_URL
              valueFrom:
                secretKeyRef:
                  name: loom-execution-actuator-db
                  key: db-url
            - name: LOOM_EXECUTION_ACTUATOR_CONTROLLER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: LOOM_EXECUTION_ACTUATOR_TARGET_ID
              value: nebius-eu-north1-development
            - name: LOOM_EXECUTION_ACTUATOR_NAMESPACE
              value: loom-nebius-development
            - name: LOOM_EXECUTION_ACTUATOR_NODE_SELECTOR
              value: '{"loom.nebius/node-role":"execution"}'
            - name: LOOM_EXECUTION_ACTUATOR_TOLERATIONS
              value: '[{"key":"loom.nebius/execution","operator":"Equal","value":"true","effect":"NoSchedule"}]'
            - name: LOOM_EXECUTION_ACTUATOR_CREDENTIAL_BROKER_URL
              value: http://loom-llm-gateway.loom.svc.cluster.local:9100/internal/service-execution
          ports:
            - name: health
              containerPort: 8093
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: loom-execution-actuator
      nodeSelector:
        loom.nebius/node-role: system
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: loom-execution-actuator
  namespace: loom-nebius-development
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loom-execution-actuator

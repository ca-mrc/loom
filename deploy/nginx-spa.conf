# Nginx config for the Loom SPA.
#
# - Listens on 8080 (the `nginxinc/nginx-unprivileged` base image runs
#   as uid 101 and can't bind to <1024).
# - Hashed Vite asset filenames (`assets/index-*.js` etc.) get a
#   1-year immutable cache. Vite emits content-hashed filenames so
#   cache-busting comes for free on the next deploy.
# - `index.html` is explicitly `no-cache` — without this, browsers
#   heuristically cache the SPA shell, and users see stale HTML
#   referencing missing hashed bundles after a deploy.
# - `loom-frontend-config.json` is runtime-generated and `no-store`.
#   It carries only public route metadata, but it must not be cached
#   across prod/dev/staging routes.
# - `try_files` falls back to `index.html` for client-side routes
#   (React Router handles `/trials/:id`, `/campaigns/:id` etc.); the
#   SPA's API client talks to `loom_service` directly at
#   `loom.example.com/api/v1/*`, which the cluster Ingress routes to
#   the `loom-service` Service. We do NOT proxy `/api/*` through nginx
#   here — keeping nginx purely static-asset means the SPA pod stays
#   stateless and trivially scalable.

# Migrate links generated before query-based TaskSet details. Match only the
# exact lowercase SPA route and one URI-encoded identifier, never a normalized
# path. The identifier stays encoded when moved into the query string.
map $request_uri $loom_legacy_taskset_redirect {
    default "";
    "~^(?<ts_prefix>/(?:dev|prod|staging))?/task-sets/(?<ts_id>ts%2[fF](?:[A-Za-z0-9_.~!()*'-]|%(?!5[cC]|[01][0-9A-Fa-f]|7[fF])[0-9A-Fa-f]{2})+)(?:[?](?<ts_query>.*))?$" $ts_prefix/task-sets/detail?id=$ts_id&$ts_query;
}

# ingress-nginx evaluates regex paths case-insensitively. Keep the pod's direct
# surface aligned with that public boundary while rejecting raw path forms
# before Nginx normalizes them. The first rule owns path-side separators; the
# lower-case allow rule must precede the case-insensitive rejection rule.
map $request_uri $loom_ambiguous_path {
    default 0;
    ~*^[^?]*(?:%2f|%5c|\x5c|//) 1;
    "~*^/[^/?]*%[0-9a-f]{2}[^/?]*(?:/|[?]|$)" 1;
    ~^/(?:dev|prod|staging)(?:/|\?|$) 0;
    ~*^/(?:dev|prod|staging)(?:/|\?|$) 1;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    merge_slashes off;

    # The web origin owns the SPA's browser policy. ingress-nginx retains HSTS
    # for TLS responses that it generates, while this include covers Nginx
    # responses at every status because each directive uses `always`.
    include /etc/nginx/loom-spa-security-headers.conf;

    if ($loom_legacy_taskset_redirect) {
        return 308 $loom_legacy_taskset_redirect;
    }

    if ($loom_ambiguous_path) {
        return 404;
    }

    gzip on;
    # TLS proxies (including Caddy) add Via. These are public static responses;
    # keep compression enabled behind a proxy as well as on direct requests.
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    root /usr/share/nginx/html;
    index index.html;

    # Keep redirects origin-relative behind TLS-terminating ingress. Without
    # this, nginx can expose its internal http://host:8080 listener.
    absolute_redirect off;

    location = /dev {
        return 308 /dev/$is_args$args;
    }

    location = /prod {
        return 308 /prod/$is_args$args;
    }

    location = /staging {
        return 308 /staging/$is_args$args;
    }

    location ~ ^/(?:prod|dev|staging)/assets/(.+)$ {
        rewrite ^/(?:prod|dev|staging)/(assets/.+)$ /$1 break;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/loom-spa-security-headers.conf;
        access_log off;
        try_files $uri =404;
    }

    # A nested `assets` segment is a broken relative-URL resolution, not a
    # client-side route. Reject it before the generic SPA fallback can turn the
    # request into `200 text/html`. The canonical `/assets/*` and
    # `/dev|prod|staging/assets/*` locations above remain valid.
    location ~* ^/(?:.+/)+assets(?:/|$) {
        return 404;
    }

    # Hashed Vite assets — far-future cache, immutable.
    location ~* ^/assets/.+\.(?:js|css|woff2?|ttf|svg|png|jpg|webp|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/loom-spa-security-headers.conf;
        access_log off;
        try_files $uri =404;
    }

    location ~ ^/(?:prod|dev|staging)/loom-frontend-config\.json$ {
        rewrite ^/(?:prod|dev|staging)/(loom-frontend-config\.json)$ /$1 break;
        add_header Cache-Control "no-store, must-revalidate";
        include /etc/nginx/loom-spa-security-headers.conf;
        try_files $uri =404;
    }

    location = /loom-frontend-config.json {
        add_header Cache-Control "no-store, must-revalidate";
        include /etc/nginx/loom-spa-security-headers.conf;
        try_files $uri =404;
    }

    location ~ ^/(?:prod|dev|staging)(?:/.*)?$ {
        rewrite ^/(?:prod|dev|staging)/(.*)$ /$1 break;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/loom-spa-security-headers.conf;
        try_files $uri /index.html;
    }

    # URI matching happens after percent-decoding. Keep a final normalized
    # case guard behind every valid lowercase prefixed location so encoded or
    # literal mixed-case prefixes cannot fall through to the root SPA.
    location ~* ^/(?:prod|dev|staging)(?:/|$) {
        return 404;
    }

    # SPA shell — must never be cached, otherwise deploys are masked
    # by browser cache and users see stale HTML pointing at missing
    # bundles. Both `/` (served via index directive) and SPA fallback
    # paths (`/trials/...`, etc.) end up here, so the header lives on
    # this location, not on a separate `= /index.html` exact match
    # (which would only catch literal `/index.html` requests).
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/loom-spa-security-headers.conf;
        try_files $uri /index.html;
    }
}

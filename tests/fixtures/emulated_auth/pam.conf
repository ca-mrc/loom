pam_pkcs11 {
    debug = false;
    quiet = true;
    nullok = false;
    card_only = true;
    wait_for_card = false;
    use_pkcs11_module = forwarded;
    pkcs11_module forwarded {
        module = /usr/lib/x86_64-linux-gnu/pkcs11/p11-kit-client.so;
        slot_num = 0;
        ca_dir = /etc/pam_pkcs11/cacerts;
        cert_policy = ca, signature;
    }
    use_mappers = cn;
    mapper cn {
        module = internal;
        ignorecase = false;
        mapfile = "none";
    }
}

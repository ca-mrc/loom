Port 2222
ListenAddress 127.0.0.1
ListenAddress ::1
HostKey /run/auth-host-key
PidFile /run/auth-sshd.pid
UsePAM no
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AllowUsers authuser
# OpenSSH 8.9 shares remote-forward permission state between TCP and Unix sockets.
AllowTcpForwarding remote
PermitListen none
AllowStreamLocalForwarding remote
StreamLocalBindUnlink yes
StreamLocalBindMask 0177
X11Forwarding no
PrintMotd no

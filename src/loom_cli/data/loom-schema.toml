default     = ""
description = "Optional registry prefix for every locally built loom-* image in the rendered manifest, without a trailing slash. Protected rollouts require it and publish the exact candidate images before apply. Empty is supported only for unprotected local rendering."

[render_config.container_registry_push]
python_type = "str"
default     = ""
description = "Operator-local publication prefix for container_registry (no scheme or trailing slash). It must be set together with container_registry. This may differ from the pull prefix when k3s registry mirrors expose the same registry through a node-local endpoint, for example localhost:5000 -> 192.168.50.13:5000."

[render_config.runtime_environment]
python_type = "str"
default     = "production"
description = "Backend runtime identity written to LOOM_ENV for service/control-plane/gateway pods. Staging profiles must set this to staging; production profiles set production."

[render_config.ingress_host]
python_type = "str"
default     = "loom.example.com"

[render_config.ingress_redirect_hosts]
python_type = "str_list"
default     = []
description = "Optional www/non-www HTTPS counterpart hostnames that bind the public ingress TLS secret and redirect to ingress_host. They must not serve separate frontend/API routes."

[render_config.ingress_class_name]
python_type = "str"
default     = "nginx"
description = "Kubernetes IngressClass used by the public Web/API ingress."

[render_config.ingress_tls_secret_name]
python_type = "str"
default     = "loom-tls"
description = "TLS Secret name referenced by the public Web/API ingress."

[render_config.ingress_cert_manager_cluster_issuer]
python_type = "str"
default     = ""
description = "Optional cert-manager ClusterIssuer name for automatic TLS."

[render_config.frontend_environment]
python_type = "str"
default     = "local"
description = "Public SPA environment identity written to the runtime frontend config."

[render_config.frontend_environment_label]
python_type = "str"
default     = "Local development"
description = "Human-readable public SPA environment label shown in the UI chrome."

[render_config.frontend_route_path]
python_type = "str"
default     = ""
description = "Public SPA path prefix on ingress_host. Empty means host root; canonical hosted environments use /dev, /staging, and /prod."

[render_config.frontend_api_base_path]
python_type = "str"
default     = ""
description = "Public path prefix prepended by the SPA API client before /api/v1. Must match frontend_route_path for protected dev/staging/prod routes."

[render_config.frontend_route_path_from]
python_type = "str"
default     = ""
description = "Predecessor SPA route prefix during a route migration (e.g. \"/dev\" while migrating to \"/staging\"). When set and different from frontend_route_path, the rollout preflight probes the live service at this predecessor route (the live env has not moved yet) while the driver moves the route to frontend_route_path and the post-deploy final gate validates the target. Empty (default) means no route transition. Preflight-only: not consumed by the manifest templates."

[render_config.postgres_image]
python_type = "str"
default     = "postgres:16"

[render_config.postgres_storage_gi]
python_type = "int"
default     = 50

[render_config.minio_image]
python_type = "str"
default     = "minio/minio"

[render_config.minio_storage_gi]
python_type = "int"
default     = 500

[render_config.persistent_storage_backend]
python_type = "str"
default     = "dynamic"
description = "Persistent storage binding mode for Postgres, MinIO, and worker trajectories. Use \"dynamic\" for the cluster default StorageClass, or \"static-host-path\" for explicit host-managed Retain PVs."

[render_config.persistent_storage_host_path_root]
python_type = "str"
default     = ""
description = "Absolute host path root used when persistent_storage_backend is \"static-host-path\", for example /data/loom-staging. Loom renders postgres, minio, and trajectories subdirectories under this root."

[render_config.provider_egress_allowlist]
python_type = "str_list"
default     = []
description = "Approved BYO provider egress targets as IP-or-CIDR:TCP-port entries, e.g. [\"202.78.161.51:18001\"]. Hostnames must be resolved by the operator before rendering because Kubernetes NetworkPolicy enforces CIDRs, not DNS names."

[render_config.gateway_local_providers]
python_type = "str_list"
default     = []
description = "OpenAI-compatible upstreams the llm-gateway exposes as `local/<name>/<model>` routes, one `<name>|<base_url>|<secret_key>` entry each, e.g. [\"yibu|https://yibuapi.com/v1|qa-relay-api-key\"]. Renders LOOM_GW_LOCAL_<NAME>_BASE_URL (literal) + LOOM_GW_LOCAL_<NAME>_API_KEY (from loom-secrets/<secret_key>, optional) onto the gateway. Env-scoped: set on environments that carry an operator relay; leave empty on production."

[render_config.trajectories_bucket]
python_type = "str"
default     = "trajectories"
description = "Object-store bucket for trial trajectories. Rendered into control-plane, worker, and loom-service env. Set per environment when deployments share an object-store endpoint."

[render_config.artifacts_bucket]
python_type = "str"
default     = "artifacts"
description = "Object-store bucket for trial artifacts. Rendered into control-plane, worker, and loom-service env. Set per environment when deployments share an object-store endpoint."

[render_config.lifecycle_legacy_buckets]
python_type = "str_list"
default     = []
description = "Additional exact legacy object-store buckets that staging lifecycle maintenance must inventory alongside the configured trajectories and artifacts write buckets."

[render_config.worker_trajectory_storage_gi]
python_type = "int"
default     = 100

[render_config.workload_contract]
python_type = "table"
description = "Canonical v1 workload-trust contract injected into loom-service."
fields      = { workload_trust_mode = "internal_trusted", taskset_transforms_enabled = false, taskset_transform_network_isolated = false, untrusted_workload_isolation = false }

[render_config.worker_capacity]
python_type = "table"
description = "Production worker Deployment capacity knobs. One worker pod handles max_concurrent trials; replicas.worker multiplies total in-cluster trial slots."
fields      = { max_concurrent = 16, cpu_request = "500m", cpu_limit = "8", memory_request = "1Gi", memory_limit = "16Gi" }

[render_config.worker_subprocess_gateway_url]
python_type = "str"
default     = "http://host.docker.internal:30443/openai/v1"
description = "Sandbox-facing OpenAI-compatible gateway URL injected into k8s workers as LOOM_WORKER_SUBPROCESS_GATEWAY_URL. The default targets the rendered gateway-router hostPort; deployments with another host service on 30443 should override this, for example to http://host.docker.internal:30444/openai/v1 with a durable host port-forward."

[render_config.replicas]
python_type = "table"
# egress_xds and egress_proxy default to zero, which disables the optional
# sandbox egress chain. Set both to positive replica counts when enabling it.
fields      = { service = 2, control_plane = 2, gateway = 2, web = 0, worker = 3, egress_xds = 0, egress_proxy = 0, pgbouncer = 2 }

[render_config.k8s_worker]
python_type = "table"
# The Docker-backed worker is optional for disposable local development.
# Hosted workloads use native Nebius execution. Disabled omits the local worker
# Deployment and rejects submissions requiring its k8s-worker pool.
fields      = { enabled = false }

[render_config.trial_cache_registry_repo]
python_type = "str"
default     = ""
description = "Registry repository for the shared trial-image cache. Empty uses only per-worker caches. A configured repository lets workers pull layered images built elsewhere; workers need mounted pull and push credentials. A failed shared pull falls back to a local build."

[render_config.gateway_hpa]
python_type = "table"
# Off by default: fixed `replicas.gateway` pods are rendered without a
# HorizontalPodAutoscaler. Profiles that expect variable trial-batch load
# flip `enabled = true` and tune `min_replicas` / `max_replicas` /
# `cpu_target_pct`. Requires a metrics-server or equivalent CPU-metric
# provider in the cluster; local development does not have one by
# default, so leave this off for local dev.
fields      = { enabled = false, min_replicas = 2, max_replicas = 8, cpu_target_pct = 60 }

[render_config.llm_gateway_sandbox]
python_type = "table"
# Off by default because the DaemonSet requires operator to pre-
# provision `loom-sandbox-gateway-tls` Secret (a `tls`-shaped
# k8s Secret with cert + key for `loom-sandbox-gateway.local`).
# The `loom cluster bootstrap-secrets` command intentionally does
# NOT generate this — operators pick a cert issuance path
# (self-signed for dev, cert-manager or loom-CA-signed for prod).
# When enabled, the DaemonSet places one loom-llm-gateway-sandbox
# pod per node (hostPort 8443) that terminates TLS + verifies the
# HS256 step-JWT before tunneling bytes to loom-llm-gateway.
# This provides per-node edge authentication rather than destination-only
# routing.
fields      = { enabled = false }

[render_config.nebius_execution]
python_type = "table"
description = "Optional canonical staging attachment for the separate Nebius execution cluster. Requires pre-existing source-spool/runtime/admission Secrets, an explicit configuration revision and scoped persistent network routes. Disabled profiles retain Docker behavior; rendering never provisions or migrates databases."
fields = { enabled = false, source_secret_name = "", runtime_profile_secret_name = "", image_admission_secret_name = "", configuration_revision = "", source_egress_allowlist = [], execution_ingress_cidrs = [] }

[render_config.nebius_private_entry]
python_type = "table"
description = "Optional staging-only private service entry on an existing WireGuard peer node. Binds three host ports exclusively to the peer address, reuses the renewable ingress TLS Secret, and creates no public ingress or credentials."
fields = { enabled = false, node_name = "", wireguard_address = "", peer_address = "", proxy_image = "" }

[render_config.pgbouncer]
python_type = "table"
description = "PgBouncer transaction-mode connection multiplexer. When enabled, renders a Deployment (2 replicas), Service (loom-pgbouncer:6432), PodDisruptionBudget, and NetworkPolicy; bootstrap populates *-db-url-pool secrets by deriving from the direct DSN. Disable it, re-render, and redeploy to make services fall back to db_url (direct). See docs/architecture/pgbouncer.md."
fields      = { enabled = true, default_pool_size = 25, max_client_conn = 500, min_pool_size = 5 }

[render_config.postgres]
python_type = "table"
description = "Postgres runtime tuning. max_connections leaves room for PgBouncer backend pools, LISTEN watchers, Alembic, and administrative connections."
fields      = { max_connections = 150 }

[render_config.topology]
python_type = "table"
description = "Cluster topology. `multi_node=true` renders Postgres through CloudNativePG, distributed MinIO, cross-node anti-affinity, and disruption budgets; `storage_backend=longhorn` requests the Longhorn StorageClass. `multi_node=false` renders single-pod Postgres and MinIO. Profiles must pin values that match the target cluster and its installed operators and storage classes. Supported storage backends are `host_path` and `longhorn`."
fields      = { multi_node = false, storage_backend = "host_path", postgres_replicas = 1, minio_replicas = 1, min_available = 1, anti_affinity = "preferred" }

[service_config.service_execution_kubernetes_config_file]
used_by = ["llm-gateway"]
python_type = "Path"
description = "Mounted JSON mapping physical cluster scopes to explicit Kubernetes endpoint, CA file and native Nebius credential file for Pod TokenReview."

[service_config.task_egress_config_file]
used_by = ["llm-gateway"]
python_type = "Path"
description = "Explicit task web egress opt-in: mounted JSON containing protected_cidrs for all platform/control-plane addresses and bounded connection limits. Missing configuration disables task egress."

# ─── Per-trial agent install and cache ────────────────
# Worker builds a content-addressed image per (task_image_digest,
# install_script) combo the first time it's encountered. Cluster-wide
# coordination via the active_trial_cache_builds table (CP-owned;
# workers reach it via /api/v1/internal/trial-cache/*). Optional
# shared registry sharing for cross-worker cache hits.

[service_config.trial_cache_registry_repo]
used_by     = ["worker"]
python_type = "str"
default     = ""
description = "Repository path for the shared trial-image cache. It may use any registry the worker can authenticate to. Empty uses only each worker's local cache. Cross-worker sharing requires pull and push credentials through the mounted Docker-config Secret. Cached images use `<repository>:<cache_key>`."

[service_config.trial_cache_registry_pull_timeout_sec]
used_by     = ["worker"]
python_type = "float"
default     = 15.0
description = "Max wait for shared-registry pull of a cached agent-installed image before falling back to local build. Keeps registry outage from slowing trial start. Distinct from `trial_cache_base_image_pull_timeout_sec` which controls the slower task-base-image pull."

[service_config.trial_cache_base_image_pull_timeout_sec]
used_by     = ["worker"]
python_type = "float"
default     = 1800.0
description = "Max wait for the task base image pull (e.g. `python:3.11-slim`, `swebench/sweb.eval...`). SWE-Bench instance images are 1-2GB; on slow networks the pull can take 10-20 min. 30-min default."

[service_config.trial_cache_ttl_hours]
used_by     = ["worker"]
python_type = "int"
default     = 168
description = "TTL on cached trial images before `docker image prune --filter until=<ttl>h` evicts them. 7 days default. Docker tracks creation age, not last-access — operators size for cache-warmth horizon."

[service_config.trial_cache_min_free_gb]
used_by     = ["worker"]
python_type = "int"
default     = 20
description = "Capacity-pressure backstop: when worker disk free drops below this, delete oldest-by-creation trial-cache images regardless of TTL."

[service_config.task_image_local_ttl_hours]
used_by     = ["worker"]
python_type = "int"
default     = 168
description = "Creation-age TTL for all Loom-managed local task, sidecar, and layered images."

[service_config.task_image_min_free_gb]
used_by     = ["worker"]
python_type = "int"
default     = 20
description = "Free-space floor for managed-image eviction on builder and execution Docker daemons."

[service_config.task_image_storage_probe_path]
used_by     = ["worker"]
python_type = "Path"
description = "Optional explicit path on the Docker data filesystem used for free-space admission. Containerized builders mount an empty Docker-managed volume here; native builders default to the daemon-reported Docker root."

[service_config.task_image_registry_grace_hours]
used_by     = ["control-plane"]
python_type = "int"
default     = 168
description = "Grace period before an unreferenced task-image materialization becomes eligible for registry deletion and garbage collection."

[service_config.task_image_builder_idle_exit_seconds]
used_by     = ["worker"]
python_type = "int"
default     = 120
description = "Idle duration after which an exclusive task-image builder exits to release local resources."

[service_config.task_image_builder_lease_seconds]
used_by     = ["control-plane"]
python_type = "float"
default     = 300.0
description = "Server-authoritative task-image builder lease duration renewed by fenced heartbeats."

[service_config.trial_cache_build_lock_timeout_sec]
used_by     = ["worker"]
python_type = "float"
default     = 1800.0
description = "TTL on the builder slot in active_trial_cache_builds (30-min default). Sized for worst-case base-image-pull + install + push budget. Builder refreshes TTL every 60s during long operations; on crash, the heartbeat dies and the slot expires within ~60s."

[service_config.trial_cache_build_max_concurrent]
used_by     = ["worker"]
python_type = "int"
default     = 1
description = "Maximum concurrent layered trial-cache image builds allowed for the same worker daemon group. Workers coordinate daemon-wide synthetic slots through active_trial_cache_builds using pool_name, hostname, and docker_socket as the daemon fingerprint. Keep 1 for shared local Docker daemons; raise only for isolated daemon hosts."

[service_config.setup_health_guard_enabled]
used_by     = ["worker"]
python_type = "bool"
default     = true
description = "Enable worker-side node-health admission before claiming work and before Docker setup/build work. When enabled, the worker pauses claims and setup containers when host I/O pressure, available memory, swap, or D-state process counts exceed configured thresholds."

[service_config.setup_health_io_full_avg10_max]
used_by     = ["worker"]
python_type = "float"
default     = 50.0
description = "Maximum Linux /proc/pressure/io full avg10 value allowed before a worker admits new Docker setup/build work. Values above this indicate sustained host I/O stalls."

[service_config.setup_health_min_mem_available_mb]
used_by     = ["worker"]
python_type = "int"
default     = 2048
description = "Minimum Linux MemAvailable in MiB required before a worker claims new trials or admits Docker setup/build work. This protects local hosts where swap-only admission cannot detect physical-memory exhaustion."

[service_config.setup_health_min_swap_free_mb]
used_by     = ["worker"]
python_type = "int"
default     = 1024
description = "Minimum free swap in MiB required before a worker admits new Docker setup/build work on hosts with swap configured. Hosts with SwapTotal=0 are treated as no-swap systems and are not blocked by this threshold."

[service_config.setup_health_dstate_max]
used_by     = ["worker"]
python_type = "int"
default     = 32
description = "Maximum number of Linux D-state processes allowed before a worker admits new Docker setup/build work. D-state pressure is a strong signal of storage or kernel I/O stalls on shared worker hosts."

[service_config.setup_health_wait_timeout_sec]
used_by     = ["worker"]
python_type = "float"
default     = 300.0
description = "Maximum seconds a claimed trial waits for setup-health recovery before requeueing with failure_reason=node_setup_health. The worker keeps pre-start heartbeats running while it waits; the Control Plane refunds the pre-start placement attempt."

[service_config.setup_health_poll_interval_sec]
used_by     = ["worker"]
python_type = "float"
default     = 5.0
description = "Polling interval while a claimed trial waits for setup-health recovery before Docker setup/build admission."

[service_config.k8s_worker_enabled]
used_by     = ["loom-service"]
python_type = "bool"
default     = true
description = "Whether the Kubernetes loom-worker Deployment is rendered. When false, batch submission rejects `required_worker_pools` containing `k8s-worker`. Derived from k8s_worker.enabled in the cluster profile."

[service_config.gateway_drain_timeout_sec]
used_by     = ["llm-gateway"]
python_type = "float"
default     = 270.0
description = "Maximum seconds `POST /drain` waits for in-flight requests to reach zero before returning 503. Keep it below the Gateway pod termination grace so the response arrives before kubelet stops the pod."

# ─── non-codegen secrets: keys mounted from loom-secrets without Settings fields ───
# Not Pydantic fields — bootstrap-secrets covers them, doctor verifies them,
# but no codegen Settings field is emitted. Use this for third-party containers
# and env-only secrets that must not appear in Settings validation errors.
#
# Note: minio uses the same minio-access-key / minio-secret-key as the loom
# services (declared in service_config above), so they need no entry here.

[infra_secrets.postgres-user]
description = "Postgres superuser (POSTGRES_USER in postgres.yaml.j2)"

[infra_secrets.postgres-password]
description = "Postgres superuser password (POSTGRES_PASSWORD in postgres.yaml.j2)"
generate    = "openssl rand -hex 16"

[infra_secrets.secret-store-master-key]
description = "Base64 AES-256 key for LocalEncryptedSecretStore (LOOM_SECRET_STORE_MASTER_KEY)."
generate    = "python -c 'import base64,secrets; print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode().rstrip(\"=\"))'"

[infra_secrets.family-orchestrator-token]
description = "Optional dedicated family-run orchestrator token (LOOM_FAMILY_ORCHESTRATOR_GATEWAY_TOKEN). It carries only family:cancel and family:evolve, cancels family-linked trials through the Control Plane authority, and is exchanged there for trial/team/provider-bound step JWTs; omitted from bootstrap-secrets so new clusters do not install placeholder credentials."
bootstrap   = false


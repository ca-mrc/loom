[meta]
version = 1

[service_prefix]
control-plane = "CP"
llm-gateway   = "GW"
loom-service  = "SVC"
worker        = "WORKER"

# ─── service_config: shared fields first ───

[service_config.db_url]
used_by     = ["control-plane", "llm-gateway", "loom-service"]
python_type = "PostgresDsn"
required    = true
secret      = { key_per_service = { control-plane = "cp-db-url", llm-gateway = "gw-db-url", loom-service = "svc-db-url" } }
description = "Postgres connection string. Per-service Secret keys so DB credentials rotate independently."

[service_config.db_url_pool]
used_by     = ["control-plane", "llm-gateway", "loom-service"]
python_type = "PostgresDsn"
required    = false
default     = ""
secret      = { key_per_service = { control-plane = "cp-db-url-pool", llm-gateway = "gw-db-url-pool", loom-service = "svc-db-url-pool" } }
description = "PgBouncer transaction-mode pool DSN. When non-empty, SQLAlchemy engines use this instead of db_url. Empty means direct-to-Postgres. LISTEN/NOTIFY watchers and Alembic migrations always use db_url."

[service_config.db_pool_size]
used_by     = ["control-plane"]
python_type = "int"
default     = 20
description = "Control Plane SQLAlchemy DB connection pool size. Size this for concurrent worker heartbeats, claims, state patches, and trajectory index writes."

[service_config.db_max_overflow]
used_by     = ["control-plane"]
python_type = "int"
default     = 40
description = "Control Plane SQLAlchemy DB overflow connections above db_pool_size for short writeback bursts."

[service_config.db_pool_timeout_sec]
used_by     = ["control-plane"]
python_type = "float"
default     = 30.0
description = "Control Plane SQLAlchemy timeout in seconds when waiting for a DB connection from the pool."

[service_config.step_jwt_signing_key]
used_by     = ["control-plane", "llm-gateway"]
python_type = "SecretStr"
required    = true
secret      = { key = "step-jwt-signing-key", generate = "openssl rand -hex 64" }
description = "HS256 step-JWT key. CP mints, gateway verifies; mismatch → 401 on every facade call."

[service_config.legacy_attempt_deadline_compat_sec]
used_by     = ["llm-gateway"]
python_type = "float"
default     = 86400.0
constraints = { ge = 0.0 }
description = "Bounded process-lifetime compatibility window for pre-deadline step JWTs during rollout. Set LOOM_GW_LEGACY_ATTEMPT_DEADLINE_COMPAT_SEC=0 to fail closed immediately."

[service_config.execution_image_admission_public_keys_json]
used_by     = ["control-plane"]
python_type = "str"
default     = '{"schema_version":1,"keys":[]}'
description = "Bounded Ed25519 public-key registry for signed execution image admission evidence. The empty default intentionally rejects every service-execution reservation."

[service_config.service_execution_scheduler_enabled]
used_by     = ["control-plane"]
python_type = "bool"
default     = false
description = "Enable normal queued-Trial reservation for tasks carrying an immutable service_execution binding. Disabled environments retain the legacy worker-only claim path."

[service_config.service_execution_global_pool_json]
used_by     = ["control-plane"]
python_type = "str"
description = "Protected global pool participant runtime JSON: registration, data environment, logical pool, HTTPS management origin and owner-only machine token file. When configured, queued execution uses global selection and direct admin reservations are rejected; activation still requires the protected writer migration."

[service_config.service_execution_materializer_enabled]
used_by     = ["control-plane"]
python_type = "bool"
default     = true
description = "Continuously materialize committed service-execution bundles into canonical Trial objects and database projections."

[service_config.service_execution_materializer_interval_sec]
used_by     = ["control-plane"]
python_type = "float"
default     = 2.0
description = "Polling interval when no committed service-execution output is ready for canonical materialization."

[service_config.service_execution_materializer_claim_ttl_sec]
used_by     = ["control-plane"]
python_type = "float"
default     = 300.0
description = "Lease duration for one materialization attempt; expired work is reclaimed after process failure."

[service_config.service_execution_materializer_concurrency]
used_by     = ["control-plane"]
python_type = "int"
default     = 8
description = "Concurrent canonical materialization/retention workers per Control Plane process; database claims remain cross-process exclusive."

[service_config.service_execution_source_retention_sec]
used_by     = ["control-plane"]
python_type = "int"
default     = 86400
description = "Recovery window after canonical acknowledgement before the immutable service-execution source spool is deleted."

[service_config.service_execution_source_endpoint]
used_by     = ["control-plane", "llm-gateway"]
python_type = "str"
description = "Optional independent S3 source spool endpoint. Configure endpoint, region, bucket, and both source credentials together; all unset reuses canonical storage."

[service_config.service_execution_source_access_key]
used_by     = ["control-plane", "llm-gateway"]
python_type = "SecretStr"
secret      = { key = "service-execution-source-access-key" }
description = "Independent source spool access key; never defaults to canonical store credentials."

[service_config.service_execution_source_secret_key]
used_by     = ["control-plane", "llm-gateway"]
python_type = "SecretStr"
secret      = { key = "service-execution-source-secret-key" }
description = "Independent source spool secret key; never defaults to canonical store credentials."

[service_config.service_execution_source_access_key_file]
used_by     = ["control-plane", "llm-gateway"]
python_type = "Path"
description = "Mounted source spool access-key file, as an alternative to the source access key."

[service_config.service_execution_source_secret_key_file]
used_by     = ["control-plane", "llm-gateway"]
python_type = "Path"
description = "Mounted source spool secret-key file, as an alternative to the source secret key."

[service_config.service_execution_source_region]
used_by     = ["control-plane", "llm-gateway"]
python_type = "str"
description = "Explicit region of the independent source spool. Required when any source spool configuration is set."

[service_config.service_execution_source_bucket]
used_by     = ["control-plane", "llm-gateway"]
python_type = "str"
description = "Independent bucket for service-execution commits and acknowledged retention GC; canonical artifacts_bucket remains unchanged."

[service_config.service_execution_scheduler_environment]
used_by     = ["control-plane"]
python_type = "str"
default     = "development"
description = "Logical environment whose healthy execution target may receive normal service-execution reservations."

[service_config.service_execution_scheduler_pool_id]
used_by     = ["control-plane"]
python_type = "str"
default     = "nebius-cpu"
description = "Logical pool selected by the service-execution scheduler. Tasks must carry the same immutable pool binding."

[service_config.service_execution_runtime_profile_json]
used_by     = ["loom-service"]
python_type = "str"
default     = '{}'
description = "Versioned deployment-owned profile used to compile compatible ordinary TaskSets into immutable Nebius runtime plans. Empty disables automatic compilation while retaining explicitly bound legacy tasks."

[service_config.service_mode]
used_by     = ["loom-service"]
python_type = "str"
default     = "application"
description = "application serves workload APIs and owns background workers; api_only serves the same APIs without starting shared background workers; management serves only identity and environment management from its own database, with no child workload clients or loops."

[service_config.environment_management_config_file]
used_by     = ["loom-service"]
python_type = "Path"
description = "Protected management-installation JSON: foundation, pinned publications, public image trust and child platform allowance. Management mode only; absent leaves provisioning unconfigured. Never mount in personal applications."

[service_config.management_http_max_body_bytes]
used_by     = ["loom-service"]
python_type = "int"
default     = 1048576
description = "Management mode only: maximum raw request bytes before parsing/authentication. Bodies are bounded in memory; reserve this limit times management_http_max_inflight plus parsing overhead per process. Does not change application uploads."

[service_config.management_http_max_inflight]
used_by     = ["loom-service"]
python_type = "int"
default     = 8
description = "Management mode only: per-process in-flight HTTP requests including response completion. Excess requests receive 503 without queuing or reading the body."

[service_config.management_http_body_timeout_sec]
used_by     = ["loom-service"]
python_type = "float"
default     = 30.0
description = "Management mode only: positive finite total body-reception deadline before parsing, not a response-streaming timeout. Expired reception returns 408."

[service_config.environment_management_github_token]
used_by     = ["loom-service"]
python_type = "SecretStr"
description = "Read-only GitHub credential for protected candidate run, PR-check and artifact verification. Required with environment_management_config_file; never passed to child Pods or artifact redirect hosts."

[service_config.managed_environment_config_file]
used_by     = ["loom-service"]
python_type = "Path"
description = "Protected child environment JSON with its exact owner, incarnation, namespace and public host. Enables singleton-admin owner enrollment and one-use child login proof issuance in application mode only. Contains no management credentials."

[service_config.service_execution_scheduler_interval_sec]
used_by     = ["control-plane"]
python_type = "float"
default     = 2.0
description = "Polling interval when no converted queued Trial is currently reservable."

[service_config.service_execution_scheduler_max_deadline_sec]
used_by     = ["control-plane"]
python_type = "int"
default     = 7200
description = "Maximum admitted deadline, including phase timeouts, termination grace, and result-commit allowance."

[service_config.storage_backend]
used_by     = ["control-plane", "llm-gateway", "loom-service", "worker"]
python_type = "str"
default     = "minio"
description = "Object-store backend. S3-compatible values are minio (default), s3, r2, b2, and wasabi. Non-S3 backends are unsupported. The lifecycle policy must match this backend."

[service_config.storage_auth_kind]
used_by     = ["control-plane", "llm-gateway", "loom-service", "worker"]
python_type = "str"
default     = "static_keys"
description = "Credentials strategy. static_keys reads minio-access-key and minio-secret-key from loom-secrets for MinIO and other S3-compatible stores. irsa lets boto3 use an AWS IAM role from the projected service-account token. Other credential strategies are unsupported."

[service_config.minio_endpoint]
used_by     = ["control-plane", "llm-gateway", "loom-service", "worker"]
python_type = "str"
default     = "http://loom-minio:9000"

[service_config.minio_access_key]
used_by     = ["control-plane", "llm-gateway", "loom-service", "worker"]
python_type = "SecretStr"
required    = true
required_per_service = { loom-service = false }
secret      = { key = "minio-access-key" }

[service_config.minio_secret_key]
used_by     = ["control-plane", "llm-gateway", "loom-service", "worker"]
python_type = "SecretStr"
required    = true
required_per_service = { loom-service = false }
secret      = { key = "minio-secret-key" }

[service_config.minio_region]
used_by     = ["control-plane", "llm-gateway", "loom-service", "worker"]
python_type = "str"
default     = "us-east-1"

[service_config.minio_max_pool_connections]
used_by     = ["worker"]
python_type = "int"
default     = 256
description = "Worker-side boto3 S3 connection pool size. Size this with worker concurrency because task materialization, artifact upload, and trajectory upload can overlap heavily during benchmark sweeps."

[service_config.minio_connect_timeout_sec]
used_by     = ["worker"]
python_type = "float"
default     = 5.0
description = "Worker-side boto3 S3 connect timeout in seconds."

[service_config.minio_read_timeout_sec]
used_by     = ["worker"]
python_type = "float"
default     = 120.0
description = "Worker-side boto3 S3 socket read timeout in seconds. Keep above transient MinIO latency under high-concurrency materialization/upload pressure."

[service_config.minio_operation_timeout_sec]
used_by     = ["worker"]
python_type = "float"
default     = 300.0
description = "Worker-side wall-clock timeout for each S3 operation wrapper such as download_prefix, put_object, multipart part upload, and presign."

[service_config.minio_operation_attempts]
used_by     = ["worker"]
python_type = "int"
default     = 3
description = "Worker-side S3 operation attempts after timeout/reconnect. Each attempt uses minio_operation_timeout_sec."

[service_config.llm_gateway_url]
used_by     = ["control-plane"]
python_type = "HttpUrl"
default     = "http://loom-llm-gateway:9100"

[service_config.control_plane_url]
used_by     = ["control-plane", "loom-service", "worker"]
python_type = "HttpUrl"
default     = "http://loom-control-plane:8080"

[service_config.gateway_url]
used_by     = ["loom-service", "worker"]
python_type = "HttpUrl"
default     = "http://loom-llm-gateway:9100"

[service_config.subprocess_gateway_url]
used_by     = ["worker"]
python_type = "HttpUrl"
description = "Optional OpenAI-compatible facade base URL as seen from trial sandbox subprocess agents. Use when the worker's own gateway_url is not resolvable from Docker sandboxes, e.g. http://host.docker.internal:30443/openai/v1 on k8s nodes with gateway-router hostPort."

[service_config.admin_secret_file]
used_by     = ["control-plane", "llm-gateway", "loom-service"]
python_type = "Path"
# no required, no default → `Path | None = None`
# k8s templates inject a template-local literal after the env_block macro

[service_config.task_image_execution_config_file]
used_by     = ["control-plane", "worker"]
python_type = "Path"
description = "Optional owner-only release configuration for signed task-image execution. Workers load only a public execution root and fixed purpose; the control plane additionally loads a fixed mTLS signer connection. Absent keeps the legacy reader path."

[service_config.log_level]
used_by     = ["control-plane", "llm-gateway", "loom-service", "worker"]
python_type = "LogLevel"
default     = "info"

[service_config.dev_reload]
used_by     = ["control-plane", "llm-gateway", "loom-service"]
python_type = "bool"
default     = false

[service_config.bind_host]
used_by     = ["control-plane", "llm-gateway", "loom-service"]
python_type = "str"
default     = "0.0.0.0"

[service_config.bind_port]
used_by             = ["control-plane", "llm-gateway", "loom-service"]
python_type         = "int"
default_per_service = { control-plane = 8080, llm-gateway = 9100, loom-service = 8090 }

[service_config.metrics_port]
used_by             = ["control-plane", "llm-gateway", "worker"]
python_type         = "int"
default_per_service = { control-plane = 9090, llm-gateway = 9101, worker = 9090 }

# ─── control-plane only ───

[service_config.worker_heartbeat_expiry_sec]
used_by     = ["control-plane", "loom-service"]
python_type = "int"
default     = 120

[service_config.worker_reclaim_sweep_interval_sec]
used_by     = ["control-plane"]
python_type = "int"
default     = 30

[service_config.claimed_without_start_expiry_sec]
used_by     = ["control-plane"]
python_type = "int"
default     = 3600
description = "Seconds before the crash detector reclaims a trial stuck in claimed with no started_at while the owning worker is still fresh. The crash detector measures from pre_start_heartbeat_at when upgraded workers report setup/cache progress, falling back to claimed_at for older workers. Default is sized for cold source setup while preserving abandoned-claim recovery."

[service_config.stale_running_trial_reclaim_enabled]
used_by     = ["control-plane", "loom-service"]
python_type = "bool"
default     = true
description = "Enable the conservative stale-running reclaim sweep. It fails a running trial only when the worker heartbeat is fresh, runtime exceeds the effective agent-timeout backstop, and trial events and LLM calls have been silent beyond the configured window."

[service_config.stale_running_trial_timeout_multiplier]
used_by     = ["control-plane", "loom-service"]
python_type = "float"
default     = 3.0
description = "Multiplier applied to the effective agent timeout for the Control Plane stale-running reclaim decision. Used with stale_running_trial_grace_sec; reclaim also requires a fresh worker heartbeat."

[service_config.stale_running_trial_grace_sec]
used_by     = ["control-plane", "loom-service"]
python_type = "float"
default     = 900.0
description = "Additive grace for the Control Plane stale-running reclaim deadline. The default is larger than the worker hard-deadline grace so the worker normally records the terminal diagnostic first."

[service_config.stale_running_trial_silence_sec]
used_by     = ["control-plane", "loom-service"]
python_type = "float"
default     = 900.0
description = "Required silence window for stale-running reclaim. A running trial is not failed while it has recent trial_events or llm_calls activity inside this window, even if runtime exceeds the timeout backstop."

[service_config.signed_url_expiry_sec]
used_by     = ["control-plane", "loom-service"]
python_type = "int"
default     = 3600

[service_config.anthropic_api_key]
used_by     = ["llm-gateway"]
python_type = "SecretStr"
secret      = { key = "anthropic-api-key" }

[service_config.openai_api_key]
used_by     = ["llm-gateway"]
python_type = "SecretStr"
secret      = { key = "openai-api-key" }

[service_config.google_api_key]
used_by     = ["llm-gateway"]
python_type = "SecretStr"
secret      = { key = "google-api-key" }

[service_config.together_api_key]
used_by     = ["llm-gateway"]
python_type = "SecretStr"
secret      = { key = "together-api-key" }

[service_config.huggingface_api_key]
used_by      = ["llm-gateway"]
python_type  = "SecretStr"
secret       = { key = "huggingface-api-key" }
description  = "Optional Hugging Face inference token for retained local execution through the gateway. Upstream dataset download/adaptation uses its own HF_TOKEN environment input; workers materialize datasets from internal mirrors."

[service_config.rate_card_cache_ttl_sec]
used_by     = ["llm-gateway"]
python_type = "int"
default     = 300

[service_config.upstream_timeout_sec]
used_by     = ["llm-gateway"]
python_type = "float"
default     = 200.0

# ─── Per-request retry on transient upstream failures ───
# Retry classification + budget live in `loom_llm_gateway/retry.py`.
# Defaults are sized to ride out a rolling LLM-gateway / upstream
# restart window: 5 attempts with up to 8s backoff each,
# capped at a 60s wall-clock budget. Agent timeouts on TaskConfig are
# 30min default; keeping the budget at 60s leaves ample headroom for
# the rest of the agent run.

[service_config.llm_retry_max_attempts]
used_by     = ["llm-gateway"]
python_type = "int"
default     = 5
description = "Maximum attempts per upstream LLM request, including the initial call. A value of 1 disables retries. The default covers transient failures during a typical Kubernetes Gateway rolling restart."

[service_config.llm_retry_base_backoff_sec]
used_by     = ["llm-gateway"]
python_type = "float"
default     = 0.5
description = "Exponential-backoff base. Attempt N waits min(base * 2^(N-1) + jitter, max_backoff_sec)."

[service_config.llm_retry_jitter_sec]
used_by     = ["llm-gateway"]
python_type = "float"
default     = 0.25
description = "Uniform jitter ±this many seconds added to each backoff wait. Reduces thundering-herd against the upstream."

[service_config.llm_retry_max_backoff_sec]
used_by     = ["llm-gateway"]
python_type = "float"
default     = 8.0
description = "Per-attempt backoff ceiling. It bounds exponential growth while leaving time for a rolling-restart window to settle before subprocess agent timeouts."

[service_config.llm_retry_budget_sec]
used_by     = ["llm-gateway"]
python_type = "float"
default     = 60.0
description = "Total wall-clock retry budget per request. Retries stop when cumulative wait plus elapsed time exceeds this value, even if attempts remain. The default is below TaskConfig.agent.timeout_sec."

# ─── Deployment-wide RetryPolicy defaults snapshotted at trial submit ───
# Operators can tune these per environment without a code change. The submit
# route snapshots the values
# into TrialConfig.retry when the submitter didn't set an explicit policy, so
# a saved trial is reproducible on any cluster regardless of subsequent retunes.

[service_config.trial_retry_default_max_attempts]
used_by     = ["control-plane", "loom-service"]
python_type = "int"
default     = 3
description = "Default TrialConfig.retry.max_attempts snapshotted into the trial payload at submit time when the submitter didn't set an explicit RetryPolicy. Represents 'how many attempts does a well-behaved trial want?'. Clamped at submit to min(this, team_quota_max_attempts_ceiling_default). Semantically distinct from the team ceiling below."

[service_config.trial_retry_default_retry_on]
used_by     = ["control-plane", "loom-service"]
python_type = "str_list"
default     = ["gateway_error", "provider_transport_disconnect", "node_setup_health"]
description = "Default TrialConfig.retry.retry_on snapshotted at submit time when unset. Members of the RetryReason enum (see src/loom/models/trial.py). node_setup_health is platform-owned and is requeued even for older or explicit policies that omit it, without consuming user or team attempt budget. Other members remain deployment-policy knobs."

[service_config.trial_retry_default_backoff_base_sec]
used_by     = ["control-plane", "loom-service"]
python_type = "float"
default     = 30.0
description = "Default BackoffSpec.base_sec snapshotted at submit time when unset. First-retry delay before exponential growth kicks in."

[service_config.trial_retry_default_backoff_max_sec]
used_by     = ["control-plane", "loom-service"]
python_type = "float"
default     = 600.0
description = "Default BackoffSpec.max_sec snapshotted at submit time when unset. Cap on the exponential curve so retries don't stretch beyond a reasonable outer bound."

[service_config.trial_retry_default_backoff_multiplier]
used_by     = ["control-plane", "loom-service"]
python_type = "float"
default     = 2.0
description = "Default BackoffSpec.multiplier snapshotted at submit time when unset. Exponential growth factor: attempt N waits base * multiplier^(N-1)."

[service_config.trial_retry_default_backoff_jitter]
used_by     = ["control-plane", "loom-service"]
python_type = "float"
default     = 0.2
description = "Default BackoffSpec.jitter snapshotted at submit time when unset. Fractional jitter in [0, 1]: actual wait = curve * Uniform(1-jitter, 1+jitter) to spread thundering-herd across restarts."

# ─── family-run orchestrator ───
# Shared across control-plane + worker: CP owns the finalize hook,
# orchestrator (deployed as a CP-siblings service that loads
# ControlPlaneSettings) owns the adapting -> pending transition, and
# workers read family_state_download_timeout_sec at pre-start.

[service_config.skill_evolver_default_model]
used_by     = ["control-plane"]
python_type = "str"
default     = "anthropic/claude-sonnet-4-6"
description = "Cluster-default evolver model for skill_patcher_llm when the batch does not override it in trial_config.family_run.adapter.params.model."

[service_config.family_orchestrator_poll_sec]
used_by     = ["control-plane"]
python_type = "float"
default     = 5.0
description = "Family-run orchestrator poll cadence for the adapting-state scan."

[service_config.family_adapter_call_timeout_sec]
used_by     = ["control-plane"]
python_type = "float"
default     = 300.0
description = "Per-call timeout wrapping the family adapter's evolve(); a trip is fed to the batch's failure_policy."

[service_config.family_state_download_timeout_sec]
used_by     = ["control-plane", "worker"]
python_type = "float"
default     = 120.0
description = "Bounds worker-side family state materialisation before trial start."

[service_config.team_quota_max_attempts_ceiling_default]
used_by     = ["loom-service"]
python_type = "int"
default     = 3
description = "Default value written to TeamQuota.max_attempts_ceiling at team creation. Represents 'how many attempts is this team allowed at most?' — the admin's ceiling, enforced by the scheduler at claim time. Semantically distinct from trial_retry_default_max_attempts (the submitter's requested count)."

[service_config.egress_proxy_url]
used_by     = ["llm-gateway"]
python_type = "str"
default     = ""
description = "Envoy egress-proxy URL. Empty disables proxy mode and sends upstream HTTP directly. Set this to the proxy service URL to route facade and native passthrough traffic through the Envoy egress chain."

# ─── loom-service only ───

[service_config.team_registration_open]
used_by     = ["loom-service"]
python_type = "bool"
default     = false

[service_config.public_base_url]
used_by     = ["loom-service"]
python_type = "HttpUrl"
description = "Canonical public Web/API origin used for one-time setup, reset, and invite links. Deployed k8s environments render this as https://<ingress_host>; local/dev may leave it unset and use forwarded headers or the request base URL."

[service_config.auth_session_cookie_name]
used_by     = ["loom-service"]
python_type = "str"
default     = "loom_session"
description = "Browser-session cookie base name. Hosted sessions add the __Host- prefix, use Secure and Path=/, and never set Domain."

[service_config.auth_session_audience_json]
used_by     = ["loom-service"]
python_type = "str"
description = "Protected loom.application-session-audience.v1 JSON: application_id, canonical HTTPS origin and positive access_generation. Binds browser sessions and login challenges to one application sharing a database. Requires matching public_base_url; unset preserves legacy isolated-database authentication. Not a process-revocation or provisioning mechanism."

[service_config.auth_local_http]
used_by     = ["loom-service"]
python_type = "bool"
default     = false
description = "Explicit HTTP-only local-development compatibility. Uses the legacy cookie name without Secure; cannot downgrade production or a canonical HTTPS public_base_url. Never enable for hosted development."

[service_config.pool_submission_source_json]
used_by     = ["loom-service"]
python_type = "str"

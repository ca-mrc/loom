name: nebius-candidate

# Protected publication from dev. PR CI cannot invoke this workflow;
# production promotion reuses these immutable Nebius image references.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Publish the platform candidate or only a Harbor runtime release
        type: choice
        options: [platform, harness-only]
        default: platform
      agent_version:
        description: Runtime version label (required for harness-only; immutable after registration)
        type: string
        required: false
      qualify_tb21_images:
        description: Resolve and qualify all reviewed TB2.1 rev6 prebuilt images (platform only)
        type: boolean
        default: false
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: nebius-candidate-publication
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository_id == '1281629473' &&
      github.ref == 'refs/heads/dev' &&
      vars.NEBIUS_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: nebius-integration
      deployment: false
    timeout-minutes: ${{ inputs.qualify_tb21_images && 360 || 180 }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.26"
          checksum: 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0
          enable-cache: true
          save-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked candidate tooling
        shell: bash
        run: |
          uv sync --locked --no-dev --extra cluster
          # Skopeo needs Ubuntu packages, not the runner's unrelated vendor repositories.
          test -s /etc/apt/sources.list.d/ubuntu.sources
          apt_sources=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-)
          sudo apt-get "${apt_sources[@]}" update
          sudo apt-get "${apt_sources[@]}" install -y --no-install-recommends skopeo=1.13.3+ds1-2ubuntu0.24.04.3
          test "$(dpkg-query -W -f='${Version}' skopeo)" = '1.13.3+ds1-2ubuntu0.24.04.3'
          skopeo --version
      - name: Start pinned BuildKit
        shell: bash
        run: |
          set -euo pipefail
          exec 2> >(tee "$RUNNER_TEMP/nebius-buildkit-startup.stderr" >&2)
          image='docker.io/moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3'
          docker create --name nebius-candidate-buildkit --privileged \
            --publish 127.0.0.1:1234:1234 "$image" \
            --addr=tcp://0.0.0.0:1234
          docker cp nebius-candidate-buildkit:/usr/bin/buildctl "$RUNNER_TEMP/buildctl"
          chmod 0755 "$RUNNER_TEMP/buildctl"
          docker start nebius-candidate-buildkit
          export BUILDKIT_HOST=tcp://127.0.0.1:1234
          "$RUNNER_TEMP/buildctl" --version
          for _ in $(seq 1 30); do
            if "$RUNNER_TEMP/buildctl" debug workers; then
              echo "BUILDKIT_HOST=$BUILDKIT_HOST" >> "$GITHUB_ENV"
              echo "BUILDKIT_CLIENT=$RUNNER_TEMP/buildctl" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          echo 'BuildKit failed to become ready' >&2
          exit 1
      - name: Build and publish the fixed candidate
        env:
          NEBIUS_REGISTRY_PREFIX: ${{ vars.NEBIUS_REGISTRY_PREFIX }}
          NEBIUS_REGISTRY_SERVICE_ACCOUNT_JSON: ${{ secrets.NEBIUS_REGISTRY_SERVICE_ACCOUNT_JSON }}
          NEBIUS_SIGNING_KEY: ${{ secrets.NEBIUS_IMAGE_ADMISSION_SIGNING_KEY }}
          NEBIUS_SIGNING_KEY_ID: ${{ vars.NEBIUS_IMAGE_ADMISSION_SIGNING_KEY_ID }}
          NEBIUS_TRUSTED_KEYRING: ${{ vars.NEBIUS_IMAGE_ADMISSION_TRUSTED_KEYRING_JSON }}
          NEBIUS_IMAGE_UPLOAD_TIMEOUT_SECONDS: ${{ vars.NEBIUS_IMAGE_UPLOAD_TIMEOUT_SECONDS || '900' }}
          NEBIUS_TASK_WEB_EGRESS_READY: ${{ vars.NEBIUS_TASK_WEB_EGRESS_READY || 'false' }}
          NEBIUS_SERVICE_LIFECYCLE_READY: ${{ vars.NEBIUS_SERVICE_LIFECYCLE_READY || 'false' }}
          NEBIUS_TASK_IDENTITY_READY: ${{ vars.NEBIUS_TASK_IDENTITY_READY || 'false' }}
          NEBIUS_GUEST_RUNTIME_READY: ${{ vars.NEBIUS_GUEST_RUNTIME_READY || 'false' }}
          NEBIUS_EMULATED_PKCS11_READY: ${{ vars.NEBIUS_EMULATED_PKCS11_READY || 'false' }}
          NEBIUS_GUEST_RUNTIME_VOLUME_MIB: ${{ vars.NEBIUS_GUEST_RUNTIME_VOLUME_MIB }}
          NEBIUS_GUEST_MAX_ARTIFACT_BYTES: ${{ vars.NEBIUS_GUEST_MAX_ARTIFACT_BYTES }}
          PUBLICATION_MODE: ${{ inputs.mode || 'platform' }}
          AGENT_VERSION: ${{ inputs.agent_version }}
          QUALIFY_TB21_IMAGES: ${{ inputs.qualify_tb21_images || false }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work=$(mktemp -d "$RUNNER_TEMP/nebius-publish.XXXXXX")
          trap 'rm -rf -- "$work"' EXIT
          export DOCKER_CONFIG="$work/docker"
          mkdir "$DOCKER_CONFIG"
          export REGISTRY_AUTH_FILE="$DOCKER_CONFIG/config.json"
          export NEBIUS_REGISTRY_CREDENTIALS_FILE="$work/registry-service-account.json"
          export NEBIUS_PUBLISH_WORK="$work"
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          registry = os.environ["NEBIUS_REGISTRY_PREFIX"]
          if not re.fullmatch(r"cr\.[a-z0-9-]+\.nebius\.cloud/[a-z0-9]+", registry):
              raise SystemExit("Invalid Nebius registry prefix")
          for name in ("NEBIUS_REGISTRY_SERVICE_ACCOUNT_JSON", "NEBIUS_SIGNING_KEY_ID"):
              if not os.environ[name]:
                  raise SystemExit("Missing required publication configuration")
          root = Path(os.environ["NEBIUS_PUBLISH_WORK"])
          (root / "signing.pem").write_text(os.environ.pop("NEBIUS_SIGNING_KEY"))
          (root / "keyring.json").write_text(os.environ["NEBIUS_TRUSTED_KEYRING"])
          Path(os.environ["NEBIUS_REGISTRY_CREDENTIALS_FILE"]).write_text(os.environ.pop("NEBIUS_REGISTRY_SERVICE_ACCOUNT_JSON"))
          PY
          unset NEBIUS_REGISTRY_SERVICE_ACCOUNT_JSON NEBIUS_SIGNING_KEY
          uv run --no-sync python scripts/ops/nebius_registry_auth.py \
            --credentials "$NEBIUS_REGISTRY_CREDENTIALS_FILE" \
            --registry-prefix "$NEBIUS_REGISTRY_PREFIX" \
            --auth-file "$REGISTRY_AUTH_FILE"
          publication_args=(--mode "$PUBLICATION_MODE")
          if [[ -n "$AGENT_VERSION" ]]; then publication_args+=(--agent-version "$AGENT_VERSION"); fi
          if [[ "${QUALIFY_TB21_IMAGES:-false}" == true ]]; then
            test "$PUBLICATION_MODE" == platform
            # Reuse the established pinned registry reader; no image is rebuilt or mirrored.
            read -r crane_version crane_sha < <(uv run --no-sync python -c 'from scripts.ops.mirror_nebius_release_via_gateway import CRANE_VERSION, CRANE_LINUX_X86_64_SHA256; print(CRANE_VERSION, CRANE_LINUX_X86_64_SHA256)')
            curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
              -o "$work/crane.tar.gz" "https://github.com/google/go-containerregistry/releases/download/v$crane_version/go-containerregistry_Linux_x86_64.tar.gz"
            printf '%s  %s\n' "$crane_sha" "$work/crane.tar.gz" | sha256sum -c - >/dev/null
            tar -xzf "$work/crane.tar.gz" -C "$work" crane
            chmod 500 "$work/crane"
            publication_args+=(--prebuilt-images-json deploy/catalog/tb21-r6-prebuilt-images.json --prebuilt-crane "$work/crane")
          fi
          if [[ "$PUBLICATION_MODE" == platform ]]; then
            : "${NEBIUS_EMULATED_PKCS11_READY:=false}"
            for setting in NEBIUS_TASK_WEB_EGRESS_READY NEBIUS_SERVICE_LIFECYCLE_READY NEBIUS_TASK_IDENTITY_READY NEBIUS_GUEST_RUNTIME_READY NEBIUS_EMULATED_PKCS11_READY; do
              case "${!setting}" in
                true|false) ;;
                *) echo "Invalid runtime readiness setting: $setting" >&2; exit 1 ;;
              esac
            done
            if [[ "$NEBIUS_TASK_WEB_EGRESS_READY" == true ]]; then publication_args+=(--supports-task-web-egress); fi
            if [[ "$NEBIUS_SERVICE_LIFECYCLE_READY" == true ]]; then publication_args+=(--service-lifecycle-ready); fi
            if [[ "$NEBIUS_TASK_IDENTITY_READY" == true ]]; then publication_args+=(--supports-task-identity); fi
            if [[ "$NEBIUS_GUEST_RUNTIME_READY" == true ]]; then
              test -n "$NEBIUS_GUEST_RUNTIME_VOLUME_MIB"
              test -n "$NEBIUS_GUEST_MAX_ARTIFACT_BYTES"
              publication_args+=(--guest-runtime qemu-tcg-v1
                --guest-runtime-volume-mib "$NEBIUS_GUEST_RUNTIME_VOLUME_MIB"
                --guest-max-artifact-bytes "$NEBIUS_GUEST_MAX_ARTIFACT_BYTES")
            elif [[ -n "$NEBIUS_GUEST_RUNTIME_VOLUME_MIB" || -n "$NEBIUS_GUEST_MAX_ARTIFACT_BYTES" ]]; then
              echo "Guest budgets require explicit guest runtime readiness" >&2
              exit 1
            fi
            if [[ "$NEBIUS_EMULATED_PKCS11_READY" == true ]]; then
              test "$NEBIUS_GUEST_RUNTIME_READY" == true
              test "$NEBIUS_TASK_IDENTITY_READY" == true
              publication_args+=(--supports-emulated-pkcs11)
            fi
          fi
          uv run --no-sync python scripts/ops/nebius_candidate.py build \
            "${publication_args[@]}" \
            --registry-prefix "$NEBIUS_REGISTRY_PREFIX" \
            --upload-timeout-seconds "$NEBIUS_IMAGE_UPLOAD_TIMEOUT_SECONDS" \
            --signing-key "$work/signing.pem" \
            --signing-key-id "$NEBIUS_SIGNING_KEY_ID" \
            --trusted-keyring "$work/keyring.json" \
            --output "$RUNNER_TEMP/nebius-candidate"
      - name: Preserve builder state and stop ephemeral builder
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/nebius-candidate"
          trap 'docker rm --force --volumes nebius-candidate-buildkit || true' EXIT
          if [[ -x .venv/bin/python ]]; then
            .venv/bin/python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          from scripts.ops.nebius_candidate import sanitize_diagnostic, write_json
          result = subprocess.run(
              ["docker", "logs", "--tail", "200", "nebius-candidate-buildkit"],
              capture_output=True, text=True, check=False,
          )
          state_result = subprocess.run(
              ["docker", "inspect", "--format", "{{json .State}}", "nebius-candidate-buildkit"],
              capture_output=True, text=True, check=False,
          )
          state = json.loads(state_result.stdout) if state_result.returncode == 0 else {}
          startup = Path(os.environ["RUNNER_TEMP"]) / "nebius-buildkit-startup.stderr"
          write_json(Path(os.environ["RUNNER_TEMP"]) / "nebius-candidate" / "builder-diagnostic.json", {
              "operation": "buildkit daemon logs",
              "returncode": result.returncode,
              "status": state.get("Status", "not-created"),
              "exit_code": state.get("ExitCode"),
              "error": sanitize_diagnostic(state.get("Error", "") + state_result.stderr),
              "diagnostic": sanitize_diagnostic(result.stdout + result.stderr),
              "startup": sanitize_diagnostic(startup.read_text() if startup.exists() else ""),
          })
          PY
          fi
      - name: Preserve candidate and partial scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.mode == 'harness-only' && 'nebius-agent-runtime' || 'nebius-candidate' }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nebius-candidate/
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve upstream task-image qualification evidence
        if: ${{ always() && inputs.qualify_tb21_images }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nebius-tb21-images-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nebius-prebuilt-task-images/
          if-no-files-found: warn
          retention-days: 30

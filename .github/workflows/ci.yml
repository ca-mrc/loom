name: CI

run-name: >-
  ${{ github.event_name == 'workflow_dispatch' &&
      format('gate=manual / head={0} / base={1} / updated={2} / action={3} / label={4} / labels={5} / pull={6}',
             github.sha,
             github.event.before || github.sha,
             github.event.pull_request.updated_at || 'none',
             github.event.action || github.event_name,
             github.event.label.name || 'none',
             format('{0}{1}{2}{3}{4}{5}',
                    contains(github.event.pull_request.labels.*.name, 'ci:integration') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:integration-docker') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:images') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'cluster-smoke') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'staging-smoke') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:coverage-summary') && '1' || '0'),
             github.event.pull_request.number || 'none') ||
      github.event_name == 'pull_request' &&
      (github.event.pull_request.draft ||
       github.event.action == 'converted_to_draft') &&
      format('gate=filtered / head={0} / base={1} / updated={2} / action={3} / label={4} / labels={5} / pull={6}',
             github.event.pull_request.head.sha,
             github.event.pull_request.base.sha,
             github.event.pull_request.updated_at,
             github.event.action,
             github.event.label.name || 'none',
             format('{0}{1}{2}{3}{4}{5}',
                    contains(github.event.pull_request.labels.*.name, 'ci:integration') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:integration-docker') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:images') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'cluster-smoke') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'staging-smoke') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:coverage-summary') && '1' || '0'),
             github.event.pull_request.number || 'none') ||
      format('gate=full / head={0} / base={1} / updated={2} / action={3} / label={4} / labels={5} / pull={6}',
             github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha,
             github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || github.sha,
             github.event.pull_request.updated_at || 'none',
             github.event.action || github.event_name,
             github.event.label.name || 'none',
             format('{0}{1}{2}{3}{4}{5}',
                    contains(github.event.pull_request.labels.*.name, 'ci:integration') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:integration-docker') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:images') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'cluster-smoke') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'staging-smoke') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:coverage-summary') && '1' || '0'),
             github.event.pull_request.number || 'none') }}

on:
  push:
    # PR heads already passed the protected four-gate admission path before
    # they reach dev. Keep the push safety net only for production promotion.
    branches: [main]
  pull_request:
    # `labeled` is included so adding the `ci:integration` label to an
    # existing PR re-triggers CI and runs the gated `integration` job.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled]
  merge_group:
    # Required if dev later enables GitHub merge queue: queued merge groups
    # need to emit the same required `repository-checks` context as PRs.
    types: [checks_requested]
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:
    inputs:
      legacy_compatibility:
        description: "Include historical platform tests and both integration tiers (manual only)"
        required: false
        type: boolean
        default: false
      integration:
        description: "Run fast integration tier (testcontainers, no real Docker driver)"
        required: false
        type: boolean
        default: false
      coverage_summary:
        description: "Collect full selected-scope coverage (historical 70% floor applies only to compatibility scope)"
        required: false
        type: boolean
        default: false
      integration_docker:
        description: "Run docker-heavy integration tier (DockerDriver, trial-e2e, ~30 min)"
        required: false
        type: boolean
        default: false

# Every non-draft PR event supersedes older admission runs, including metadata
# edits: a newer filtered suite can strand older green required checks. Draft
# events keep a unique slot so a delayed draft event cannot cancel a Ready run.
concurrency:
  group: >-
    ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{
      github.event_name == 'pull_request' &&
      (github.event.pull_request.draft ||
       github.event.action == 'converted_to_draft') &&
      format('filtered-{0}', github.run_id) || 'authoritative' }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' &&
        !(github.event.pull_request.draft ||
          github.event.action == 'converted_to_draft') }}

permissions:
  contents: read
  # No pull-requests:write needed — coverage report is published via
  # the GitHub Actions step summary, not as a PR comment.

env:
  CI_TEST_SCOPE: ${{ ((github.event_name == 'workflow_dispatch' && inputs.legacy_compatibility) || github.ref == 'refs/heads/main' || github.base_ref == 'main') && 'all' || 'nebius' }}
  CI_PYTEST_MARKERS: ${{ ((github.event_name == 'workflow_dispatch' && inputs.legacy_compatibility) || github.ref == 'refs/heads/main' || github.base_ref == 'main') && 'legacy_pool or not legacy_pool' || 'not legacy_pool' }}

jobs:
  workflow-plan:
    name: workflow-plan
    runs-on: ${{ vars.LOOM_CI_UNIFIED_RUNNERS == 'true' && github.ref != 'refs/heads/main' && github.base_ref != 'main' && github.event.merge_group.base_ref != 'refs/heads/main' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","loom-ci-exec","loom-ci-isolated-v1"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      event_relevant: ${{ steps.plan.outputs.event_relevant || steps.event.outputs.event_relevant }}
      full_gate: ${{ steps.plan.outputs.full_gate || steps.event.outputs.full_gate }}
      gate_mode: ${{ steps.plan.outputs.gate_mode || steps.event.outputs.gate_mode }}
      docs_only: ${{ steps.plan.outputs.docs_only || steps.event.outputs.docs_only }}
      integration: ${{ steps.plan.outputs.integration || steps.event.outputs.integration }}
      integration_docker: ${{ steps.plan.outputs.integration_docker || steps.event.outputs.integration_docker }}
      images: ${{ steps.plan.outputs.images || steps.event.outputs.images }}
      cluster_smoke: ${{ steps.plan.outputs.cluster_smoke || steps.event.outputs.cluster_smoke }}
      staging_smoke: ${{ steps.plan.outputs.staging_smoke || steps.event.outputs.staging_smoke }}
      coverage_summary: ${{ steps.plan.outputs.coverage_summary || steps.event.outputs.coverage_summary }}
      web_checks: ${{ steps.plan.outputs.web_checks || steps.event.outputs.web_checks }}
      web_runtime: ${{ steps.plan.outputs.web_runtime }}
      go_packages: ${{ steps.plan.outputs.go_packages || '["./cmd/...","./internal/..."]' }}
      iac_targets: ${{ steps.plan.outputs.iac_targets || '[]' }}
      lint_and_static: ${{ steps.plan.outputs.lint_and_static || steps.event.outputs.lint_and_static }}
      tests_root: ${{ steps.plan.outputs.tests_root || steps.event.outputs.tests_root }}
      nebius_pool: ${{ steps.plan.outputs.nebius_pool || steps.event.outputs.nebius_pool }}
      tests_packages: ${{ steps.plan.outputs.tests_packages || steps.event.outputs.tests_packages }}
      go_checks: ${{ steps.plan.outputs.go_checks || steps.event.outputs.go_checks }}
      runtime_payload: ${{ steps.plan.outputs.runtime_payload || steps.event.outputs.runtime_payload }}
      nebius_iac: ${{ steps.plan.outputs.nebius_iac || steps.event.outputs.nebius_iac }}
      locked_environments: ${{ steps.plan.outputs.locked_environments || steps.event.outputs.locked_environments }}
      test_changes: ${{ steps.plan.outputs.test_changes || '[]' }}
      tests_root_matrix: ${{ steps.plan.outputs.tests_root_matrix || '[]' }}
      nebius_pool_matrix: ${{ steps.plan.outputs.nebius_pool_matrix || '[]' }}
      integration_matrix: ${{ steps.plan.outputs.integration_matrix || '[]' }}
      integration_docker_matrix: ${{ steps.plan.outputs.integration_docker_matrix || '[]' }}
    steps:
      - name: Classify filtered event before checkout
        id: event
        shell: bash
        env:
          FILTERED_EVENT: >-
            ${{ github.event_name == 'pull_request' &&
                (github.event.pull_request.draft ||
                 github.event.action == 'converted_to_draft') }}
        run: |
          set -euo pipefail
          if [[ "$FILTERED_EVENT" == "true" ]]; then
            {
              echo 'checkout_required=false'
              echo 'event_relevant=false'
              echo 'full_gate=false'
              echo 'gate_mode=filtered'
              echo 'docs_only=true'
              echo 'integration=false'
              echo 'integration_docker=false'
              echo 'images=false'
              echo 'cluster_smoke=false'
              echo 'staging_smoke=false'
              echo 'coverage_summary=false'
              echo 'web_checks=false'
              echo 'lint_and_static=false'
              echo 'tests_root=false'
              echo 'nebius_pool=false'
              echo 'tests_packages=false'
              echo 'go_checks=false'
              echo 'runtime_payload=false'
              echo 'nebius_iac=false'
              echo 'locked_environments=false'
            } >> "$GITHUB_OUTPUT"
          else
            echo 'checkout_required=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        if: steps.event.outputs.checkout_required == 'true'
        with:
          fetch-depth: 0

      - name: Enforce repository path policy
        if: steps.event.outputs.checkout_required == 'true'
        run: python3 scripts/check_repository_paths.py

      - name: Plan required validations
        id: plan
        if: steps.event.outputs.checkout_required == 'true'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_ACTION: ${{ github.event.action }}
          PR_ACTION_LABEL: ${{ github.event.label.name }}
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
          PR_BASE_CHANGED: ${{ github.event.changes.base != null }}
          DISPATCH_INTEGRATION: ${{ inputs.integration || inputs.legacy_compatibility }}
          DISPATCH_INTEGRATION_DOCKER: ${{ inputs.integration_docker || inputs.legacy_compatibility }}
          DISPATCH_COVERAGE_SUMMARY: ${{ inputs.coverage_summary }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              git diff --name-only "$BASE_SHA...$HEAD_SHA" \
                > /tmp/loom-changed-files.txt
              ;;
            merge_group)
              git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
                > /tmp/loom-changed-files.txt
              ;;
            push)
              if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
                git ls-tree -r --name-only "$HEAD_SHA" \
                  > /tmp/loom-changed-files.txt
              else
                git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
                  > /tmp/loom-changed-files.txt
              fi
              ;;
            workflow_dispatch|schedule)
              git show --pretty=format: --name-only "$HEAD_SHA" \
                > /tmp/loom-changed-files.txt
              PR_LABELS_JSON="$(python3 - <<'PYLABELS'
          import json
          import os
          print(json.dumps([
              label for flag, label in (
                  ("DISPATCH_INTEGRATION", "ci:integration"),
                  ("DISPATCH_INTEGRATION_DOCKER", "ci:integration-docker"),
                  ("DISPATCH_COVERAGE_SUMMARY", "ci:coverage-summary"),
              ) if os.environ[flag] == "true"
          ]))
          PYLABELS
              )"
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac
          sort -u -o /tmp/loom-changed-files.txt /tmp/loom-changed-files.txt
          if [[ -z "$PR_LABELS_JSON" || "$PR_LABELS_JSON" == "null" ]]; then
            PR_LABELS_JSON='[]'
          fi
          python3 scripts/plan_ci_validations.py \
            --changed-files /tmp/loom-changed-files.txt \
            --labels-json "$PR_LABELS_JSON" \
            --event-name "$EVENT_NAME" \
            --pull-request-action "$PR_ACTION" \
            --pull-request-action-label "$PR_ACTION_LABEL" \
            --pull-request-draft "$PR_DRAFT" \
            --pull-request-base-changed "$PR_BASE_CHANGED" \
            --base-sha "${BASE_SHA:-}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Docs-only fast path
        if: steps.plan.outputs.docs_only == 'true'
        run: echo "Only docs/repo metadata changed; heavy checks skipped."

  locked-environments:
    name: locked-environment (${{ matrix.target }})
    needs: workflow-plan
    if: needs.workflow-plan.outputs.locked_environments == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
            expected_system: Linux
            expected_machine: x86_64
            uv_checksum: 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0
    runs-on: ${{ vars.LOOM_CI_UNIFIED_RUNNERS == 'true' && github.ref != 'refs/heads/main' && github.base_ref != 'main' && github.event.merge_group.base_ref != 'refs/heads/main' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","loom-ci-exec","loom-ci-isolated-v1"]') || matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install exact uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.26"
          checksum: ${{ matrix.uv_checksum }}
          enable-cache: true
          prune-cache: true
          save-cache: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
          cache-dependency-glob: uv.lock

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Verify target and install locked workspace
        env:
          EXPECTED_SYSTEM: ${{ matrix.expected_system }}
          EXPECTED_MACHINE: ${{ matrix.expected_machine }}
        run: |
          uv sync --locked --all-packages --extra dev --python 3.11
          uv pip check --python .venv/bin/python
          uv run --no-sync python - <<'PY'
          import os
          import platform

          actual = (platform.system(), platform.machine())
          expected = (os.environ["EXPECTED_SYSTEM"], os.environ["EXPECTED_MACHINE"])
          if actual != expected:
              raise SystemExit(f"runner target mismatch: expected {expected}, got {actual}")

          import loom  # noqa: F401
          import loom_benchmark_terminal_bench_2  # noqa: F401
          import loom_benchmarks  # noqa: F401
          import loom_bundle_checksum  # noqa: F401
          import loom_launcher  # noqa: F401
          import terminalgen  # noqa: F401
          PY

  lint-and-static:
    name: lint-and-static
    runs-on: ${{ vars.LOOM_CI_UNIFIED_RUNNERS == 'true' && github.ref != 'refs/heads/main' && github.base_ref != 'main' && github.event.merge_group.base_ref != 'refs/heads/main' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","loom-ci-exec","loom-ci-isolated-v1"]') || 'ubuntu-24.04' }}
    needs: [workflow-plan]
    timeout-minutes: 12
    if: >-
      needs.workflow-plan.outputs.lint_and_static == 'true' &&
      needs.workflow-plan.outputs.gate_mode == 'full'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.26"
          checksum: 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0
          enable-cache: true
          # Read-only full wheel cache; only ci-dependency-cache.yml saves it.
          save-cache: false
          prune-cache: false
          cache-suffix: ci-wheels-v2
          # Same path on GitHub-hosted and self-hosted runners; setup-uv's
          # defaults differ and the cache version hashes the path.
          cache-local-path: /home/runner/.cache/uv
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Sync locked workspace
        run: |
          uv sync --locked --all-packages --extra dev --python 3.11
          uv pip check --python .venv/bin/python

      - name: Ruff
        run: uv run --no-sync ruff check src tests packages database/migrations database/capacity_guard_migrations database/capacity_migrations

      - name: Ruff format (normalized integration suites)
        run: |
          uv run --no-sync ruff format --check \
            tests/integration/test_control_plane_client.py \
            tests/integration/test_state_patch_fenced.py \
            tests/integration/test_trajectory_index.py

      - name: Mypy (strict)
        run: uv run --no-sync mypy

      - name: Verify codegen up-to-date
        run: uv run --no-sync loom config codegen --check

      - name: Verify agent install_scripts are pinned (#317)
        run: uv run --no-sync python scripts/check_install_scripts_pinned.py

      - name: Verify GitHub Action SHA lock
        run: uv run --no-sync python scripts/check_ci_action_pins.py

      - name: Verify controlled CI upgrade policy
        run: uv run --no-sync python scripts/check_ci_upgrade_policy.py

  # Native dependencies reserve runner slots for quick checks first. Unselected
  # prerequisites may skip; a selected skip/failure/cancellation blocks fan-out.
  tests-root:
    name: tests-root (${{ matrix.shard }})
    runs-on: ${{ vars.LOOM_CI_UNIFIED_RUNNERS == 'true' && github.ref != 'refs/heads/main' && github.base_ref != 'main' && github.event.merge_group.base_ref != 'refs/heads/main' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","loom-ci-exec","loom-ci-isolated-v1"]') || 'ubuntu-24.04' }}
    needs: [workflow-plan, lint-and-static, locked-environments, tests-packages, go-checks, nebius-iac]
    # Shards project ~7 minutes of pytest without coverage; leave room for
    # coverage, setup, wheel verification and cleanup.
    timeout-minutes: 50
    if: >-
      !cancelled() &&
      needs.workflow-plan.result == 'success' &&
      ((needs.workflow-plan.outputs.lint_and_static == 'true' && needs.lint-and-static.result == 'success') ||
       (needs.workflow-plan.outputs.lint_and_static == 'false' && needs.lint-and-static.result == 'skipped')) &&
      ((needs.workflow-plan.outputs.locked_environments == 'true' && needs.locked-environments.result == 'success') ||
       (needs.workflow-plan.outputs.locked_environments == 'false' && needs.locked-environments.result == 'skipped')) &&
      ((needs.workflow-plan.outputs.tests_packages == 'true' && needs.tests-packages.result == 'success') ||
       (needs.workflow-plan.outputs.tests_packages == 'false' && needs.tests-packages.result == 'skipped')) &&
      ((needs.workflow-plan.outputs.go_checks == 'true' && needs.go-checks.result == 'success') ||
       (needs.workflow-plan.outputs.go_checks == 'false' && needs.go-checks.result == 'skipped')) &&
      ((needs.workflow-plan.outputs.nebius_iac == 'true' && needs.nebius-iac.result == 'success') ||
       (needs.workflow-plan.outputs.nebius_iac == 'false' && needs.nebius-iac.result == 'skipped')) &&
      needs.workflow-plan.outputs.tests_root == 'true' &&
      needs.workflow-plan.outputs.gate_mode == 'full'
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
      matrix:
        include: ${{ fromJSON(needs.workflow-plan.outputs.tests_root_matrix) }}
    env:
      COVERAGE_FILE: .coverage.root-${{ matrix.shard }}
      COVERAGE_ENABLED: ${{ needs.workflow-plan.outputs.coverage_summary }}
      TEST_CHANGED_PATHS: ${{ needs.workflow-plan.outputs.test_changes }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Configure credential-free Docker Hub mirror
        run: python3 scripts/configure_ci_registry_mirror.py

      - name: Select nonempty tests-root manifest
        id: manifest
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard_index }}
          SHARD_COUNT: ${{ matrix.shard_count }}
        run: |
          set -euo pipefail
          manifest_paths_file="${RUNNER_TEMP}/tests-root-manifest.txt"
          python3 scripts/component_ownership.py test-paths --lane tests-root --test-scope "${CI_TEST_SCOPE:-all}" \
            --changed-paths-json "$TEST_CHANGED_PATHS" \
            --shard-index "$SHARD_INDEX" --shard-count "$SHARD_COUNT" \
            > "$manifest_paths_file"
          test -s "$manifest_paths_file"
          echo "paths_file=$manifest_paths_file" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.26"
          checksum: 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0
          enable-cache: true
          # Read-only full wheel cache; only ci-dependency-cache.yml saves it.
          save-cache: false
          prune-cache: false
          cache-suffix: ci-wheels-v2
          # Same path on GitHub-hosted and self-hosted runners; setup-uv's
          # defaults differ and the cache version hashes the path.
          cache-local-path: /home/runner/.cache/uv
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Sync locked workspace
        run: |
          uv sync --locked --all-packages --extra dev --python 3.11
          uv pip check --python .venv/bin/python

      - name: Pytest — manifest-owned root shard
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard_index }}
          SHARD_COUNT: ${{ matrix.shard_count }}
        run: |
          set -euo pipefail
          mapfile -t test_paths < "${{ steps.manifest.outputs.paths_file }}"
          [[ ${#test_paths[@]} -gt 0 ]]
          coverage_args=(-p no:cov)
          if [[ "$COVERAGE_ENABLED" == "true" ]]; then
            coverage_args=(--cov=src --cov=packages --cov-report=)
          fi
          uv run --no-sync pytest -m "${CI_PYTEST_MARKERS:-not legacy_pool}" "${test_paths[@]}" \
            -x --durations=25 \
            "${coverage_args[@]}"

      - name: Build and exercise non-editable runtime wheel
        if: matrix.shard_index == 0 && needs.workflow-plan.outputs.runtime_payload == 'true'
        shell: bash
        run: |
          set -euo pipefail
          wheel_dir="${RUNNER_TEMP}/loom-wheel"
          rm -rf "${wheel_dir}"
          uv build --wheel --out-dir "${wheel_dir}"
          wheels=("${wheel_dir}"/loom-*.whl)
          if [[ ${#wheels[@]} -ne 1 || ! -f "${wheels[0]}" ]]; then
            echo "expected exactly one Loom wheel" >&2
            exit 1
          fi
          uv pip install \
            --python .venv/bin/python \
            --reinstall \
            --no-deps \
            "${wheels[0]}"
          cd "${RUNNER_TEMP}"
          "${GITHUB_WORKSPACE}/.venv/bin/python" -I -B - <<'PY'
          from __future__ import annotations

          import os
          from importlib import resources
          from pathlib import Path

          import loom_cli
          import loom.nebius_platform_render
          import loom_execution_actuator.task_image_controller

          repo_root = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          for module in (loom_cli, loom.nebius_platform_render,
                         loom_execution_actuator.task_image_controller):
              module_path = Path(module.__file__).resolve()
              assert not module_path.is_relative_to(repo_root / "src"), module_path
          runtime_assets = {
              Path("config/loom-schema.toml"): ("loom-schema.toml",),
              Path("deploy/grafana/dashboards/operator-overview.json"): (
                  "grafana",
                  "operator-overview.json",
              ),
              Path("deploy/grafana/dashboards/control-plane.json"): (
                  "grafana",
                  "control-plane.json",
              ),
              Path("deploy/grafana/dashboards/llm-gateway.json"): (
                  "grafana",
                  "llm-gateway.json",
              ),
              Path("deploy/grafana/dashboards/loom-service.json"): (
                  "grafana",
                  "loom-service.json",
              ),
              Path("deploy/grafana/dashboards/worker.json"): (
                  "grafana",
                  "worker.json",
              ),
              Path("deploy/envoy/egress-proxy.yaml"): (
                  "envoy",
                  "egress-proxy.yaml",
              ),
          }
          if os.environ.get("CI_TEST_SCOPE", "all") != "all":
              runtime_assets = {Path("config/loom-schema.toml"): ("loom-schema.toml",)}
          package_root = resources.files("loom_cli.data")
          for source_path, resource_parts in runtime_assets.items():
              assert package_root.joinpath(*resource_parts).read_bytes() == (
                  repo_root / source_path
              ).read_bytes()
          if os.environ.get("CI_TEST_SCOPE", "all") == "all":
              assert (
                  resources.files("loom_cli.templates.k8s")
                  .joinpath("_env.j2")
                  .read_text(encoding="utf-8")
                  .strip()
              )
              from loom_cli.migration_readiness import inspect_migration_plan

              assert callable(inspect_migration_plan)
              from loom_cli.cluster_cmd import render_manifests
              from loom_cli.cluster_config import ClusterConfig

              rendered = render_manifests(ClusterConfig())
              assert "kind: ConfigMap" in rendered
              assert "name: loom-grafana-dashboards" in rendered
          PY

      - name: Upload root coverage data
        if: always() && env.COVERAGE_ENABLED == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data-root-${{ matrix.shard }}
          path: ${{ env.COVERAGE_FILE }}
          include-hidden-files: true
          if-no-files-found: error

  fast-feedback:
    name: fast-feedback
    runs-on: ${{ vars.LOOM_CI_UNIFIED_RUNNERS == 'true' && github.ref != 'refs/heads/main' && github.base_ref != 'main' && github.event.merge_group.base_ref != 'refs/heads/main' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","loom-ci-exec","loom-ci-isolated-v1"]') || 'ubuntu-latest' }}
    needs: [workflow-plan, lint-and-static, locked-environments, tests-packages, go-checks, nebius-iac, tests-root, integration, web-checks]
    if: always() && needs.workflow-plan.outputs.gate_mode == 'full' && needs.workflow-plan.outputs.docs_only != 'true'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Enforce selected quick checks and affected tests
        env:
          FEEDBACK_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci_fast_feedback.py enforce

  # Heavy execution starts only after the selected quick and affected-test jobs.
  # Reuse the existing manifests; no tests are duplicated or moved out of admission.
  nebius-pool:
    name: nebius-pool (${{ matrix.shard }})
    runs-on: ${{ vars.LOOM_CI_UNIFIED_RUNNERS == 'true' && github.ref != 'refs/heads/main' && github.base_ref != 'main' && github.event.merge_group.base_ref != 'refs/heads/main' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","loom-ci-exec","loom-ci-isolated-v1"]') || 'ubuntu-24.04' }}
    needs: [workflow-plan, fast-feedback]
    # Pool operator lifecycle modules; the slowest shard needs ~40 minutes
    # for pytest alone. Selected only when operator inputs change.
    timeout-minutes: 50
    if: >-
      needs.workflow-plan.outputs.nebius_pool == 'true' &&
      needs.workflow-plan.outputs.gate_mode == 'full'
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
      matrix:
        include: ${{ fromJSON(needs.workflow-plan.outputs.nebius_pool_matrix) }}
    env:
      TEST_CHANGED_PATHS: ${{ needs.workflow-plan.outputs.test_changes }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Configure credential-free Docker Hub mirror
        run: python3 scripts/configure_ci_registry_mirror.py

      - name: Select nonempty nebius-pool manifest
        id: manifest
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard_index }}
          SHARD_COUNT: ${{ matrix.shard_count }}
        run: |
          set -euo pipefail
          manifest_paths_file="${RUNNER_TEMP}/nebius-pool-manifest.txt"
          python3 scripts/component_ownership.py test-paths --lane nebius-pool --test-scope "${CI_TEST_SCOPE:-all}" \
            --changed-paths-json "$TEST_CHANGED_PATHS" \
            --shard-index "$SHARD_INDEX" --shard-count "$SHARD_COUNT" \
            > "$manifest_paths_file"
          test -s "$manifest_paths_file"
          echo "paths_file=$manifest_paths_file" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.26"
          checksum: 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0
          enable-cache: true
          # Read-only full wheel cache; only ci-dependency-cache.yml saves it.
          save-cache: false
          prune-cache: false
          cache-suffix: ci-wheels-v2
          # Same path on GitHub-hosted and self-hosted runners; setup-uv's
          # defaults differ and the cache version hashes the path.
          cache-local-path: /home/runner/.cache/uv
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Sync locked workspace
        run: |
          uv sync --locked --all-packages --extra dev --python 3.11
          uv pip check --python .venv/bin/python

      - name: Pytest — manifest-owned pool shard
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard_index }}
          SHARD_COUNT: ${{ matrix.shard_count }}
        run: |
          set -euo pipefail
          mapfile -t test_paths < "${{ steps.manifest.outputs.paths_file }}"
          [[ ${#test_paths[@]} -gt 0 ]]
          uv run --no-sync pytest -m "${CI_PYTEST_MARKERS:-not legacy_pool}" "${test_paths[@]}" \
            -x --durations=25 \
            -p no:cov

  tests-packages:
    name: tests-packages
    runs-on: ${{ vars.LOOM_CI_UNIFIED_RUNNERS == 'true' && github.ref != 'refs/heads/main' && github.base_ref != 'main' && github.event.merge_group.base_ref != 'refs/heads/main' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","loom-ci-exec","loom-ci-isolated-v1"]') || 'ubuntu-24.04' }}
    needs: [workflow-plan]
    timeout-minutes: 10
    if: >-
      needs.workflow-plan.outputs.tests_packages == 'true' &&
      needs.workflow-plan.outputs.gate_mode == 'full'
    env:
      COVERAGE_ENABLED: ${{ needs.workflow-plan.outputs.coverage_summary }}
      TEST_CHANGED_PATHS: ${{ needs.workflow-plan.outputs.test_changes }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.26"
          checksum: 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0
          enable-cache: true
          # Read-only full wheel cache; only ci-dependency-cache.yml saves it.
          save-cache: false
          prune-cache: false
          cache-suffix: ci-wheels-v2
          # Same path on GitHub-hosted and self-hosted runners; setup-uv's
          # defaults differ and the cache version hashes the path.
          cache-local-path: /home/runner/.cache/uv
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Sync locked workspace
        run: |
          uv sync --locked --all-packages --extra dev --python 3.11
          uv pip check --python .venv/bin/python

      - name: Pytest — manifest-owned package lane
        shell: bash
        run: |
          set -euo pipefail
          manifest_paths_file="${RUNNER_TEMP}/tests-packages-manifest.txt"
          uv run --no-sync python scripts/component_ownership.py test-paths --lane tests-packages --test-scope "${CI_TEST_SCOPE:-all}" \
            --changed-paths-json "$TEST_CHANGED_PATHS" > "$manifest_paths_file"
          mapfile -t test_paths < "$manifest_paths_file"
          if [[ ${#test_paths[@]} -eq 0 ]]; then
            echo "No independent test edits belong to this shard."
            exit 0
          fi
          coverage_args=(-p no:cov)
          if [[ "$COVERAGE_ENABLED" == "true" ]]; then
            coverage_args=(--cov=src --cov=packages --cov-report=)
          fi
          uv run --no-sync pytest -m "${CI_PYTEST_MARKERS:-not legacy_pool}" "${test_paths[@]}" \
            "${coverage_args[@]}"

      - name: Upload package coverage data
        if: always() && env.COVERAGE_ENABLED == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data-packages
          path: .coverage
          include-hidden-files: true
          if-no-files-found: warn

  runtime-payload:
    name: runtime-payload
    runs-on: ${{ vars.LOOM_CI_UNIFIED_RUNNERS == 'true' && github.ref != 'refs/heads/main' && github.base_ref != 'main' && github.event.merge_group.base_ref != 'refs/heads/main' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","loom-ci-exec","loom-ci-isolated-v1"]') || 'ubuntu-24.04' }}
    needs: [workflow-plan, fast-feedback]
    timeout-minutes: 10
    if: >-
      needs.workflow-plan.outputs.runtime_payload == 'true' &&
      (needs.workflow-plan.outputs.gate_mode == 'full' ||
       needs.workflow-plan.outputs.gate_mode == 'preflight')
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Configure credential-free Docker Hub mirror
        run: python3 scripts/configure_ci_registry_mirror.py

      - name: Execute manifest-owned runtime payload conformance
        run: python3 scripts/runtime_payload_conformance.py --test-scope "${CI_TEST_SCOPE:-all}"

  nebius-iac:
    name: nebius-iac
    runs-on: ${{ vars.LOOM_CI_UNIFIED_RUNNERS == 'true' && github.ref != 'refs/heads/main' && github.base_ref != 'main' && github.event.merge_group.base_ref != 'refs/heads/main' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","loom-ci-exec","loom-ci-isolated-v1"]') || 'ubuntu-latest' }}
    needs: [workflow-plan]
    timeout-minutes: 10
    if: >-
      needs.workflow-plan.outputs.nebius_iac == 'true' &&
      (needs.workflow-plan.outputs.gate_mode == 'full' ||
       needs.workflow-plan.outputs.gate_mode == 'preflight')
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Validate Nebius repository contract
        run: python3 scripts/check_nebius_iac.py

      - name: Install exact Terraform
        env:
          TERRAFORM_VERSION: "1.16.0"
          TERRAFORM_LINUX_AMD64_SHA256: 41d05b927aa174f15d1228c4eba832a323b716c68b415ef5a00179f46cc602d3
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          install_dir="${RUNNER_TEMP}/terraform-bin"
          curl --fail --silent --show-error --location \
            --output "${archive}" \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          echo "${TERRAFORM_LINUX_AMD64_SHA256}  ${archive}" | sha256sum --check
          mkdir -p "${install_dir}"
          unzip -q "${archive}" -d "${install_dir}"
          echo "${install_dir}" >> "${GITHUB_PATH}"

      - name: Validate pinned Nebius module and stack
        env:
          IAC_TARGETS_JSON: ${{ needs.workflow-plan.outputs.iac_targets }}
        run: |
          set -euo pipefail
          terraform fmt -check -recursive deploy/terraform/nebius
          python3 - <<'PY' > "$RUNNER_TEMP/iac-targets.txt"
          import json, os
          from scripts.plan_ci_validations import IAC_ALL_TARGETS
          targets = json.loads(os.environ['IAC_TARGETS_JSON'])
          assert targets and all(target in IAC_ALL_TARGETS for target in targets)
          print('\n'.join(targets))
          PY
          while IFS= read -r target; do
            directory="deploy/terraform/nebius/$target"
            terraform -chdir="$directory" init -backend=false -input=false
            case "$target" in
              stack) terraform -chdir="$directory" validate ;;
              platform)
                terraform -chdir="$directory" validate
                terraform -chdir="$directory" test ;;
              *) terraform -chdir="$directory" test ;;
            esac
          done < "$RUNNER_TEMP/iac-targets.txt"

  # Coverage instrumentation is optional. Ordinary PRs validate each selected
  # source job directly in repository-checks, without an intermediate runner.
  fast-coverage:
    name: fast-coverage
    runs-on: ${{ vars.LOOM_CI_UNIFIED_RUNNERS == 'true' && github.ref != 'refs/heads/main' && github.base_ref != 'main' && github.event.merge_group.base_ref != 'refs/heads/main' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","loom-ci-exec","loom-ci-isolated-v1"]') || 'ubuntu-latest' }}
    needs: [workflow-plan, tests-root, tests-packages]
    timeout-minutes: 10
    if: >-
      needs.workflow-plan.outputs.coverage_summary == 'true' &&
      needs.workflow-plan.outputs.gate_mode == 'full'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install exact uv
        if: needs.workflow-plan.outputs.coverage_summary == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.26"
          checksum: 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0
          enable-cache: true
          # Read-only full wheel cache; only ci-dependency-cache.yml saves it.
          save-cache: false
          prune-cache: false
          cache-suffix: ci-wheels-v2
          # Same path on GitHub-hosted and self-hosted runners; setup-uv's
          # defaults differ and the cache version hashes the path.
          cache-local-path: /home/runner/.cache/uv
          cache-dependency-glob: uv.lock

      - name: Sync locked coverage tool
        if: needs.workflow-plan.outputs.coverage_summary == 'true'
        run: uv sync --locked --only-group ci-coverage --python 3.11

      - name: Download root coverage shards
        if: >-
          needs.workflow-plan.outputs.coverage_summary == 'true' &&
          needs.workflow-plan.outputs.gate_mode == 'full'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-data-root-*
          path: cov-root
          merge-multiple: true

      - name: Download package coverage
        if: >-
          needs.workflow-plan.outputs.coverage_summary == 'true' &&
          needs.workflow-plan.outputs.gate_mode == 'full'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-data-packages
          path: cov-packages

      - name: Combine fast-tier coverage
        if: >-
          needs.workflow-plan.outputs.coverage_summary == 'true' &&
          needs.workflow-plan.outputs.gate_mode == 'full'
        run: |
          cp cov-packages/.coverage .coverage.packages
          cp .coverage.packages cov-root/.coverage.packages
          uv run --no-sync coverage combine cov-root
          uv run --no-sync coverage xml

      - name: Upload coverage.xml
        if: >-
          always() && needs.workflow-plan.outputs.coverage_summary == 'true' &&
          needs.workflow-plan.outputs.gate_mode == 'full'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml-fast
          path: coverage.xml
          if-no-files-found: warn

      # Binary .coverage data file (SQLite) consumed by coverage-summary
      # job to combine with integration-tier coverage.
      - name: Upload fast-tier coverage data
        if: >-
          always() && needs.workflow-plan.outputs.coverage_summary == 'true' &&
          needs.workflow-plan.outputs.gate_mode == 'full'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data-fast
          path: .coverage
          include-hidden-files: true
          if-no-files-found: warn

      # The 70% baseline belongs to the historical all-platform population.
      # Nebius reports coverage without comparing it to that different population.
      - name: Coverage gate + summary (fast tier)
        if: >-
          needs.workflow-plan.outputs.coverage_summary == 'true' &&
          needs.workflow-plan.outputs.gate_mode == 'full'
        run: |
          set +e
          coverage_floor=()
          coverage_note="Nebius scope; historical all-platform floor is not comparable"
          if [[ "${CI_TEST_SCOPE:-all}" == "all" ]]; then
            coverage_floor=(--fail-under=70)
            coverage_note="all-platform gate >= 70 %"
          fi
          uv run --no-sync coverage report "${coverage_floor[@]}" | tee coverage-report.txt
          status=${PIPESTATUS[0]}
          set -e
          fast_pct=$(uv run --no-sync coverage report --format=total)
          fast_summary=$(tail -1 coverage-report.txt)
          {
            echo "## Coverage report"
            echo ""
            echo "**Fast tier: ${fast_pct} %** (${coverage_note})."
            echo ""
            echo '```'
            echo "${fast_summary}"
            echo '```'
            echo ""
            echo "Per-file XML attached as the \`coverage-xml-fast\` workflow artifact."
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # Go binary checks (#78 Phase B). This stays separate from Python coverage
  # because Go is its own toolchain; the final repository-checks job waits
  # for both toolchains without increasing Python CI latency.
  go-checks:
    name: go-checks
    runs-on: ${{ vars.LOOM_CI_UNIFIED_RUNNERS == 'true' && github.ref != 'refs/heads/main' && github.base_ref != 'main' && github.event.merge_group.base_ref != 'refs/heads/main' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","loom-ci-exec","loom-ci-isolated-v1"]') || 'ubuntu-24.04' }}
    env:
      GO_PACKAGES_JSON: ${{ needs.workflow-plan.outputs.go_packages }}
    needs: [workflow-plan]
    if: >-
      needs.workflow-plan.outputs.gate_mode == 'full' &&
      needs.workflow-plan.outputs.go_checks == 'true'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.23.4'
          cache: false
      - name: gofmt
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/go-packages.txt"
          import json, os
          packages = json.loads(os.environ['GO_PACKAGES_JSON'])
          allowed = {'./cmd/...', './internal/...', './internal/guestchannel/...'}
          from scripts.plan_ci_validations import GO_INPUT_PREFIXES
          allowed.update('./' + prefix.rstrip('/') + '/...' for prefix in GO_INPUT_PREFIXES)
          assert packages and all(package in allowed for package in packages)
          print('\n'.join(packages))
          PY
          mapfile -t packages < "$RUNNER_TEMP/go-packages.txt"
          directories=("${packages[@]%/...}")
          out=$(gofmt -l "${directories[@]}")
          if [ -n "$out" ]; then
            echo "$out"
            echo "gofmt found issues; run \`gofmt -w ./cmd/ ./internal/\` to fix"
            exit 1
          fi
      - name: go vet
        run: |
          mapfile -t packages < "$RUNNER_TEMP/go-packages.txt"
          go vet "${packages[@]}"
      - name: go test
        run: |
          mapfile -t packages < "$RUNNER_TEMP/go-packages.txt"
          go test -race "${packages[@]}"

  # Frontend contract, static and unit feedback precedes production/browser work.
  web-checks:
    name: web-checks
    runs-on: ${{ vars.LOOM_CI_UNIFIED_RUNNERS == 'true' && github.ref != 'refs/heads/main' && github.base_ref != 'main' && github.event.merge_group.base_ref != 'refs/heads/main' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","loom-ci-exec","loom-ci-isolated-v1"]') || 'ubuntu-24.04' }}
    needs: [workflow-plan]
    timeout-minutes: 20
    if: >-
      needs.workflow-plan.outputs.web_checks == 'true' &&
      (needs.workflow-plan.outputs.gate_mode == 'full' ||
       needs.workflow-plan.outputs.gate_mode == 'preflight')
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Node.js 20
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frozen frontend dependencies
        working-directory: web
        run: npm ci

      - name: Set up offline API code generation
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.26"
          checksum: 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0
          enable-cache: true
          # Read-only full wheel cache; only ci-dependency-cache.yml saves it.
          save-cache: false
          prune-cache: false
          cache-suffix: ci-wheels-v2
          # Same path on GitHub-hosted and self-hosted runners; setup-uv's
          # defaults differ and the cache version hashes the path.
          cache-local-path: /home/runner/.cache/uv
          cache-dependency-glob: uv.lock

      - name: Install locked service contract dependencies
        run: uv sync --locked --extra dev --python 3.11

      - name: Verify generated API types
        working-directory: web
        env:
          WEB_RUNTIME: ${{ needs.workflow-plan.outputs.web_runtime }}
        run: |
          [[ "$WEB_RUNTIME" == 'true' || "$WEB_RUNTIME" == 'false' ]]
          npm run gen-api -- --check

      - name: TypeScript strict and ESLint
        if: needs.workflow-plan.outputs.web_runtime == 'true'
        working-directory: web
        run: |
          npm run typecheck
          npm run lint

      - name: Vitest coverage gate
        if: needs.workflow-plan.outputs.web_runtime == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f config/component-ownership.toml && \
                -f scripts/component_ownership.py ]] && \
             python3 scripts/component_ownership.py --help | grep -q -- 'test-paths'; then
            python3 scripts/component_ownership.py test-paths --lane frontend --test-scope "${CI_TEST_SCOPE:-all}" \
              > "$RUNNER_TEMP/frontend-tests.txt"
            mapfile -t owned_tests < "$RUNNER_TEMP/frontend-tests.txt"
            [[ ${#owned_tests[@]} -gt 0 ]]
            web_tests=()
            for test_path in "${owned_tests[@]}"; do
              [[ "$test_path" == web/* ]]
              web_tests+=("${test_path#web/}")
            done
            cd web
            npx --no-install vitest run --coverage \
              "${web_tests[@]}" \
              scripts/frontend-route-browser-smoke.test.mjs \
              scripts/admin-browser-smoke.test.mjs \
              scripts/check-bundle-budget.test.mjs
          else
            cd web
            npm run test:coverage
          fi

  # Production/browser work remains required, after shared fast feedback.
  web-runtime:
    name: web-runtime
    runs-on: ${{ vars.LOOM_CI_UNIFIED_RUNNERS == 'true' && github.ref != 'refs/heads/main' && github.base_ref != 'main' && github.event.merge_group.base_ref != 'refs/heads/main' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","loom-ci-exec","loom-ci-isolated-v1"]') || 'ubuntu-24.04' }}
    needs: [workflow-plan, fast-feedback]
    timeout-minutes: 20
    if: >-
      needs.workflow-plan.outputs.web_runtime == 'true' &&
      needs.workflow-plan.outputs.gate_mode == 'full'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Node.js 20
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frozen frontend dependencies
        working-directory: web
        run: npm ci

      - name: Production build
        if: needs.workflow-plan.outputs.web_runtime == 'true'
        working-directory: web
        run: npm run build

      - name: Retain production bundle composition and budget report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: frontend-bundle-budget
          path: web/dist/bundle-report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Install Chromium
        if: needs.workflow-plan.outputs.web_runtime == 'true'
        working-directory: web
        run: npx --no-install playwright install --with-deps chromium

      - name: Prefix-route browser, axe, console, and network gate
        if: needs.workflow-plan.outputs.web_runtime == 'true'
        working-directory: web
        run: npm run test:e2e

      - name: Retain frontend browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-browser-evidence
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Fast integration tier uses the existing affected manifests.
  integration:
    name: integration (${{ matrix.shard }})
    runs-on: ${{ vars.LOOM_CI_UNIFIED_RUNNERS == 'true' && github.ref != 'refs/heads/main' && github.base_ref != 'main' && github.event.merge_group.base_ref != 'refs/heads/main' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","loom-ci-exec","loom-ci-isolated-v1"]') || 'ubuntu-latest' }}
    needs: [workflow-plan, lint-and-static, locked-environments, tests-packages, go-checks, nebius-iac]
    timeout-minutes: 75
    if: >-
      !cancelled() &&
      needs.workflow-plan.result == 'success' &&
      ((needs.workflow-plan.outputs.lint_and_static == 'true' && needs.lint-and-static.result == 'success') ||
       (needs.workflow-plan.outputs.lint_and_static == 'false' && needs.lint-and-static.result == 'skipped')) &&
      ((needs.workflow-plan.outputs.locked_environments == 'true' && needs.locked-environments.result == 'success') ||
       (needs.workflow-plan.outputs.locked_environments == 'false' && needs.locked-environments.result == 'skipped')) &&
      ((needs.workflow-plan.outputs.tests_packages == 'true' && needs.tests-packages.result == 'success') ||
       (needs.workflow-plan.outputs.tests_packages == 'false' && needs.tests-packages.result == 'skipped')) &&
      ((needs.workflow-plan.outputs.go_checks == 'true' && needs.go-checks.result == 'success') ||
       (needs.workflow-plan.outputs.go_checks == 'false' && needs.go-checks.result == 'skipped')) &&
      ((needs.workflow-plan.outputs.nebius_iac == 'true' && needs.nebius-iac.result == 'success') ||
       (needs.workflow-plan.outputs.nebius_iac == 'false' && needs.nebius-iac.result == 'skipped')) &&
      needs.workflow-plan.outputs.gate_mode == 'full' &&
      needs.workflow-plan.outputs.integration == 'true'
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
      matrix:
        include: ${{ fromJSON(needs.workflow-plan.outputs.integration_matrix) }}
    env:
      COVERAGE_FILE: .coverage.integration-${{ matrix.shard }}
      COVERAGE_ENABLED: ${{ needs.workflow-plan.outputs.coverage_summary }}
      TEST_CHANGED_PATHS: ${{ needs.workflow-plan.outputs.test_changes }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Configure credential-free Docker Hub mirror
        run: python3 scripts/configure_ci_registry_mirror.py

      - name: Select nonempty integration manifest
        id: manifest
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard_index }}
          SHARD_COUNT: ${{ matrix.shard_count }}
        run: |
          set -euo pipefail
          manifest_paths_file="${RUNNER_TEMP}/integration-manifest.txt"
          python3 scripts/component_ownership.py test-paths --lane integration --test-scope "${CI_TEST_SCOPE:-all}" \
            --changed-paths-json "$TEST_CHANGED_PATHS" \
            --shard-index "$SHARD_INDEX" --shard-count "$SHARD_COUNT" \
            > "$manifest_paths_file"
          test -s "$manifest_paths_file"
          echo "paths_file=$manifest_paths_file" >> "$GITHUB_OUTPUT"
          minio_cache_key=$(python3 -m tests.support.minio_images --test-paths-file "$manifest_paths_file" --cache-key)
          echo "minio_cache_key=$minio_cache_key" >> "$GITHUB_OUTPUT"

      - name: Restore verified MinIO fixtures
        if: steps.manifest.outputs.minio_cache_key != 'none'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # Read-only; only ci-dependency-cache.yml saves it. A fixed path, since
          # the cache version hashes it and RUNNER_TEMP differs per hosted worker.
          path: /home/runner/.cache/loom-minio-fixtures
          key: ${{ runner.os }}-${{ steps.manifest.outputs.minio_cache_key }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.26"
          checksum: 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0
          enable-cache: true
          # Read-only full wheel cache; only ci-dependency-cache.yml saves it.
          save-cache: false
          prune-cache: false
          cache-suffix: ci-wheels-v2
          # Same path on GitHub-hosted and self-hosted runners; setup-uv's
          # defaults differ and the cache version hashes the path.
          cache-local-path: /home/runner/.cache/uv
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Sync locked workspace
        run: |
          uv sync --locked --all-packages --extra dev --python 3.11
          uv pip check --python .venv/bin/python

      - name: Prepare selected pinned MinIO fixtures
        if: steps.manifest.outputs.minio_cache_key != 'none'
        run: >-
          uv run --no-sync python -m tests.support.minio_images
          --test-paths-file "${{ steps.manifest.outputs.paths_file }}"
          --cache-dir /home/runner/.cache/loom-minio-fixtures

      - name: Prepare selected Docker Hub fixtures before test deadlines
        run: >-
          uv run --no-sync python -m tests.support.docker_hub_images
          --test-paths-file "${{ steps.manifest.outputs.paths_file }}"

      - name: Pytest — integration (fast tier, no docker)
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard_index }}
          SHARD_COUNT: ${{ matrix.shard_count }}
        run: |
          set -euo pipefail
          mapfile -t test_paths < "${{ steps.manifest.outputs.paths_file }}"
          [[ ${#test_paths[@]} -gt 0 ]]
          coverage_args=(-p no:cov)
          if [[ "$COVERAGE_ENABLED" == "true" ]]; then
            coverage_args=(--cov=src --cov=packages --cov-report=)
          fi
          uv run --no-sync pytest "${test_paths[@]}" \
            -m "not docker and (${CI_PYTEST_MARKERS:-not legacy_pool})" \
            --maxfail=1 \
            --durations=15 \
            "${coverage_args[@]}"

      # Binary .coverage data file consumed by coverage-summary to
      # combine with fast-tier coverage. No standalone gate yet —
      # collecting combined-tier baseline first (Phase 3 of #260).
      - name: Upload integration coverage data
        if: success() && env.COVERAGE_ENABLED == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data-integration-${{ matrix.shard }}
          path: ${{ env.COVERAGE_FILE }}
          include-hidden-files: true
          if-no-files-found: error

  # Docker-heavy tier: real DockerDriver / network-policy / trial-e2e /
  # subprocess-agent / gateway-with-litellm. Cost ~15-25 min and
  # spins up dozens of containers, so the planner limits it to relevant
  # paths, the `ci:integration-docker` label, or a workflow_dispatch input.
  integration-docker:
    name: integration-docker (${{ matrix.shard }})
    runs-on: ${{ vars.LOOM_CI_UNIFIED_RUNNERS == 'true' && github.ref != 'refs/heads/main' && github.base_ref != 'main' && github.event.merge_group.base_ref != 'refs/heads/main' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","loom-ci-exec","loom-ci-isolated-v1"]') || 'ubuntu-24.04' }}
    needs: [workflow-plan, fast-feedback]
    timeout-minutes: 40
    if: >-
      needs.workflow-plan.outputs.gate_mode == 'full' &&
      needs.workflow-plan.outputs.integration_docker == 'true'
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
      matrix:
        include: ${{ fromJSON(needs.workflow-plan.outputs.integration_docker_matrix) }}
    env:
      TEST_CHANGED_PATHS: ${{ needs.workflow-plan.outputs.test_changes }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Configure credential-free Docker Hub mirror
        run: python3 scripts/configure_ci_registry_mirror.py

      - name: Select nonempty integration-docker manifest
        id: manifest
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard_index }}
          SHARD_COUNT: ${{ matrix.shard_count }}
        run: |
          set -euo pipefail
          manifest_paths_file="${RUNNER_TEMP}/integration-docker-manifest.txt"
          python3 scripts/component_ownership.py test-paths --lane integration-docker --test-scope "${CI_TEST_SCOPE:-all}" \
            --changed-paths-json "$TEST_CHANGED_PATHS" \
            --shard-index "$SHARD_INDEX" --shard-count "$SHARD_COUNT" \
            > "$manifest_paths_file"
          test -s "$manifest_paths_file"
          echo "paths_file=$manifest_paths_file" >> "$GITHUB_OUTPUT"
          minio_cache_key=$(python3 -m tests.support.minio_images --test-paths-file "$manifest_paths_file" --cache-key)
          echo "minio_cache_key=$minio_cache_key" >> "$GITHUB_OUTPUT"

      - name: Restore verified MinIO fixtures
        if: steps.manifest.outputs.minio_cache_key != 'none'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # Read-only; only ci-dependency-cache.yml saves it. A fixed path, since
          # the cache version hashes it and RUNNER_TEMP differs per hosted worker.
          path: /home/runner/.cache/loom-minio-fixtures
          key: ${{ runner.os }}-${{ steps.manifest.outputs.minio_cache_key }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.26"
          checksum: 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0
          enable-cache: true
          # Read-only full wheel cache; only ci-dependency-cache.yml saves it.
          save-cache: false
          prune-cache: false
          cache-suffix: ci-wheels-v2
          # Same path on GitHub-hosted and self-hosted runners; setup-uv's
          # defaults differ and the cache version hashes the path.
          cache-local-path: /home/runner/.cache/uv
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Sync locked workspace
        run: |
          uv sync --locked --all-packages --extra dev --python 3.11
          uv pip check --python .venv/bin/python

      - name: Prepare selected pinned MinIO fixtures
        if: steps.manifest.outputs.minio_cache_key != 'none'
        run: >-
          uv run --no-sync python -m tests.support.minio_images
          --test-paths-file "${{ steps.manifest.outputs.paths_file }}"
          --cache-dir /home/runner/.cache/loom-minio-fixtures

      - name: Prepare selected Docker Hub fixtures before test deadlines
        run: >-
          uv run --no-sync python -m tests.support.docker_hub_images
          --test-paths-file "${{ steps.manifest.outputs.paths_file }}"

      - name: Build and extract the admitted software-guest payload
        if: matrix.guest_payload
        shell: bash
        run: |
          set -euo pipefail
          docker build -f deploy/Dockerfile.execution-runtime -t loom-guest-ci:local .
          guest_container=$(docker create loom-guest-ci:local)
          trap 'docker rm -f "$guest_container" >/dev/null' EXIT
          mkdir -p "$RUNNER_TEMP/loom-guest-payload"
          docker cp "$guest_container:/guest/." "$RUNNER_TEMP/loom-guest-payload/"
          echo "LOOM_GUEST_PAYLOAD=$RUNNER_TEMP/loom-guest-payload" >> "$GITHUB_ENV"

      - name: Pytest — integration (docker tier)
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t test_paths < "${{ steps.manifest.outputs.paths_file }}"
          [[ ${#test_paths[@]} -gt 0 ]]
          uv run --no-sync pytest -m "${CI_PYTEST_MARKERS:-not legacy_pool}" "${test_paths[@]}" \
            --maxfail=1 --durations=15

  # Optional combined coverage summary for PRs and manual diagnostics.
  # The default fast-tier
  # summary is written by fast-coverage so ordinary PRs do not
  # start another runner only for summary text. Apply ci:coverage-summary
  # or use the manual coverage_summary input for combined coverage details.
  # This used to post a PR comment via `gh pr comment`; step summary
  # keeps the same information on the workflow page without email spam.
  coverage-summary:
    name: coverage-summary
    runs-on: ${{ vars.LOOM_CI_UNIFIED_RUNNERS == 'true' && github.ref != 'refs/heads/main' && github.base_ref != 'main' && github.event.merge_group.base_ref != 'refs/heads/main' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","loom-ci-exec","loom-ci-isolated-v1"]') || 'ubuntu-latest' }}
    needs: [workflow-plan, fast-coverage, integration]
    if: >-
      always() &&
      needs.workflow-plan.outputs.coverage_summary == 'true' &&
      needs.workflow-plan.outputs.gate_mode == 'full' &&
      needs.fast-coverage.result == 'success' &&
      needs.workflow-plan.outputs.docs_only != 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.26"
          checksum: 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0
          enable-cache: true
          # Read-only full wheel cache; only ci-dependency-cache.yml saves it.
          save-cache: false
          prune-cache: false
          cache-suffix: ci-wheels-v2
          # Same path on GitHub-hosted and self-hosted runners; setup-uv's
          # defaults differ and the cache version hashes the path.
          cache-local-path: /home/runner/.cache/uv
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Sync locked coverage tool
        run: uv sync --locked --only-group ci-coverage --python 3.11

      - name: Download fast-tier coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-data-fast
          path: cov-fast

      - name: Download integration coverage
        if: needs.integration.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-data-integration-*
          path: cov-integration
          merge-multiple: true

      # Writes the coverage summary to GitHub Actions' step-summary
      # markdown rather than posting a PR comment. The step summary
      # appears at the bottom of the workflow run page and at the top
      # of the PR's "Checks" tab — same info, no email spam to PR
      # authors on every push (was the case while we posted comments
      # via `gh pr comment`).
      - name: Combine + write step summary
        env:
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          fast_pct=$(uv run --no-sync coverage report --data-file=cov-fast/.coverage --format=total)
          fast_summary=$(uv run --no-sync coverage report --data-file=cov-fast/.coverage | tail -1)

          combined_block=""
          if [ "$INTEGRATION_RESULT" = "success" ] && compgen -G 'cov-integration/.coverage.integration-*' >/dev/null; then
            cp cov-fast/.coverage .coverage.fast
            cp cov-integration/.coverage.integration-* .
            uv run --no-sync coverage combine
            combined_pct=$(uv run --no-sync coverage report --format=total)
            combined_block="**Combined (fast + integration): ${combined_pct} %** (no gate yet — Phase 3 baseline)."
          elif [ "$INTEGRATION_RESULT" = "skipped" ]; then
            combined_block="_Combined coverage **not measured** this PR — apply the \`ci:integration\` label to run the integration tier._"
          else
            combined_block="_Combined coverage **not measured** — integration job result: \`${INTEGRATION_RESULT}\`._"
          fi

          {
            echo "## Coverage report"
            echo ""
            echo "**Fast tier: ${fast_pct} %** (scope: ${CI_TEST_SCOPE:-all})."
            echo ""
            echo "${combined_block}"
            echo ""
            echo '```'
            echo "${fast_summary}"
            echo '```'
            echo ""
            echo "Per-file XML attached as the \`coverage-xml-fast\` workflow artifact. Tracking #260."
          } >> "$GITHUB_STEP_SUMMARY"

  repository-checks:
    name: >-
      ${{ github.event_name == 'schedule' && 'repository-checks-scheduled' ||
          github.event_name == 'workflow_dispatch' && 'repository-checks-manual' ||
          github.event_name == 'push' && 'repository-checks-push' ||
          needs.workflow-plan.outputs.gate_mode == 'full' && 'repository-checks' ||
          'repository-checks-filtered' }}
    runs-on: ${{ vars.LOOM_CI_UNIFIED_RUNNERS == 'true' && github.ref != 'refs/heads/main' && github.base_ref != 'main' && github.event.merge_group.base_ref != 'refs/heads/main' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","loom-ci-exec","loom-ci-isolated-v1"]') || 'ubuntu-latest' }}
    if: >-
      always() &&
      needs.workflow-plan.outputs.gate_mode != 'filtered'
    needs:
      - workflow-plan
      - fast-feedback
      - locked-environments
      - lint-and-static
      - runtime-payload
      - nebius-iac
      - tests-root
      - nebius-pool
      - tests-packages
      - fast-coverage
      - go-checks
      - integration
      - integration-docker
      - coverage-summary
      - web-checks
      - web-runtime
    steps:
      - name: Enforce selected validation results
        env:
          PLAN_RESULT: ${{ needs.workflow-plan.result }}
          FEEDBACK_RESULT: ${{ needs.fast-feedback.result }}
          GATE_MODE: ${{ needs.workflow-plan.outputs.gate_mode }}
          LINT_RESULT: ${{ needs.lint-and-static.result }}
          LINT_SELECTED: ${{ needs.workflow-plan.outputs.lint_and_static }}
          LOCKED_SELECTED: ${{ needs.workflow-plan.outputs.locked_environments }}
          LOCKED_RESULT: ${{ needs.locked-environments.result }}
          ROOT_SELECTED: ${{ needs.workflow-plan.outputs.tests_root }}
          ROOT_RESULT: ${{ needs.tests-root.result }}
          POOL_SELECTED: ${{ needs.workflow-plan.outputs.nebius_pool }}
          POOL_RESULT: ${{ needs.nebius-pool.result }}
          PACKAGES_SELECTED: ${{ needs.workflow-plan.outputs.tests_packages }}
          PACKAGES_RESULT: ${{ needs.tests-packages.result }}
          PAYLOAD_SELECTED: ${{ needs.workflow-plan.outputs.runtime_payload }}
          PAYLOAD_RESULT: ${{ needs.runtime-payload.result }}
          IAC_SELECTED: ${{ needs.workflow-plan.outputs.nebius_iac }}
          IAC_RESULT: ${{ needs.nebius-iac.result }}
          FAST_COVERAGE_RESULT: ${{ needs.fast-coverage.result }}
          GO_SELECTED: ${{ needs.workflow-plan.outputs.go_checks }}
          GO_RESULT: ${{ needs.go-checks.result }}
          DOCS_ONLY: ${{ needs.workflow-plan.outputs.docs_only }}
          INTEGRATION_SELECTED: ${{ needs.workflow-plan.outputs.integration }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          DOCKER_SELECTED: ${{ needs.workflow-plan.outputs.integration_docker }}
          DOCKER_RESULT: ${{ needs.integration-docker.result }}
          COVERAGE_SELECTED: ${{ needs.workflow-plan.outputs.coverage_summary }}
          COVERAGE_RESULT: ${{ needs.coverage-summary.result }}
          WEB_SELECTED: ${{ needs.workflow-plan.outputs.web_checks }}
          WEB_RESULT: ${{ needs.web-checks.result }}
          WEB_RUNTIME_SELECTED: ${{ needs.workflow-plan.outputs.web_runtime }}
          WEB_RUNTIME_RESULT: ${{ needs.web-runtime.result }}
        run: |
          set -euo pipefail
          case "$GATE_MODE" in
            full|filtered) ;;
            *) echo "FAIL: invalid gate mode ${GATE_MODE@Q}" >&2; exit 1 ;;
          esac
          [[ "$PLAN_RESULT" == "success" ]] || exit 1
          if [[ "$GATE_MODE" == "filtered" ]]; then
            echo "Metadata-only event filtered."
            exit 0
          fi
          require_boolean() {
            local name="$1" value="$2"
            case "$value" in
              true|false) ;;
              *) echo "FAIL: invalid planner boolean ${name}=${value@Q}" >&2; exit 1 ;;
            esac
          }
          require_success() {
            local name="$1" result="$2"
            if [[ "$result" != "success" ]]; then
              echo "FAIL: ${name} result=${result}" >&2
              exit 1
            fi
          }
          require_selected() {
            local selected="$1" name="$2" result="$3"
            if [[ "$selected" == "true" ]]; then
              require_success "$name" "$result"
            elif [[ "$result" != "skipped" && "$result" != "success" ]]; then
              echo "FAIL: unselected ${name} ended ${result}" >&2
              exit 1
            fi
          }
          require_boolean go_checks "$GO_SELECTED"
          require_boolean lint_and_static "$LINT_SELECTED"
          require_boolean docs_only "$DOCS_ONLY"
          require_boolean integration "$INTEGRATION_SELECTED"
          require_boolean integration_docker "$DOCKER_SELECTED"
          require_boolean coverage_summary "$COVERAGE_SELECTED"
          require_boolean web_checks "$WEB_SELECTED"
          require_boolean web_runtime "$WEB_RUNTIME_SELECTED"
          require_success workflow-plan "$PLAN_RESULT"
          if [[ "$DOCS_ONLY" != "true" ]]; then
            require_success fast-feedback "$FEEDBACK_RESULT"
          fi
          require_boolean locked_environments "$LOCKED_SELECTED"
          require_boolean tests_root "$ROOT_SELECTED"
          require_boolean nebius_pool "$POOL_SELECTED"
          require_boolean tests_packages "$PACKAGES_SELECTED"
          require_boolean runtime_payload "$PAYLOAD_SELECTED"
          require_boolean nebius_iac "$IAC_SELECTED"
          require_selected "$LINT_SELECTED" lint-and-static "$LINT_RESULT"
          require_selected "$LOCKED_SELECTED" locked-environments "$LOCKED_RESULT"
          require_selected "$ROOT_SELECTED" tests-root "$ROOT_RESULT"
          require_selected "$POOL_SELECTED" nebius-pool "$POOL_RESULT"
          require_selected "$PACKAGES_SELECTED" tests-packages "$PACKAGES_RESULT"
          require_selected "$PAYLOAD_SELECTED" runtime-payload "$PAYLOAD_RESULT"
          require_selected "$IAC_SELECTED" nebius-iac "$IAC_RESULT"
          require_selected "$GO_SELECTED" go-checks "$GO_RESULT"
          require_selected "$COVERAGE_SELECTED" fast-coverage "$FAST_COVERAGE_RESULT"
          require_selected "$WEB_SELECTED" web-checks "$WEB_RESULT"
          require_selected "$WEB_RUNTIME_SELECTED" web-runtime "$WEB_RUNTIME_RESULT"
          require_selected "$INTEGRATION_SELECTED" integration "$INTEGRATION_RESULT"
          require_selected "$DOCKER_SELECTED" integration-docker "$DOCKER_RESULT"
          require_selected "$COVERAGE_SELECTED" coverage-summary "$COVERAGE_RESULT"

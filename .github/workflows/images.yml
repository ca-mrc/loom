name: candidate Actions AB experiment
run-name: candidate-ab / ${{ inputs.role }} / source=${{ inputs.source_sha }} / cohort=${{ inputs.cohort }}
'on':
  workflow_dispatch:
    inputs:
      role:
        type: choice
        options:
        - producer
        - consumer
        required: true
        default: producer
      source_sha:
        type: string
        required: true
        default: c60ea0083a924c5708b18376fc5df32232a746d9
      producer_run_id:
        type: string
        default: ''
      cohort:
        type: string
        required: true
        default: native-v1
permissions:
  contents: read
  actions: read
concurrency:
  group: candidate-ab-experiment-${{ github.ref }}
  cancel-in-progress: false
jobs:
  producer:
    name: native-ab / producer
    if: github.ref == 'refs/heads/codex/candidate-artifact-transfer-20261016' && inputs.role == 'producer'
    runs-on: ${{ fromJSON('["self-hosted","linux","x64","loom-ci-exec","loom-ci-isolated-v1","ephemeral-kvm"]') }}
    timeout-minutes: 90
    env:
      PROBE_ROOT: /tmp/loom-candidate-ab-${{ github.run_id }}
      PROBE_SOURCE_SHA: ${{ inputs.source_sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - &id001
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        persist-credentials: false
    - &id002
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        ref: ${{ inputs.source_sha }}
        path: source
        persist-credentials: false
    - &id003
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      with:
        version: 0.11.26
        checksum: 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0
        enable-cache: false
    - &id004
      name: Install bounded experiment tooling
      shell: bash
      run: 'set -euo pipefail

        uv venv --python python3 "$RUNNER_TEMP/candidate-ab-venv"

        uv pip install --python "$RUNNER_TEMP/candidate-ab-venv/bin/python" -r experiments/candidate_ab/requirements.txt

        export PROBE_PYTHON="$RUNNER_TEMP/candidate-ab-venv/bin/python"

        echo "PROBE_PYTHON=$PROBE_PYTHON" >> "$GITHUB_ENV"

        test -s /etc/apt/sources.list.d/ubuntu.sources

        apt_sources=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-)

        sudo apt-get "${apt_sources[@]}" update

        sudo apt-get "${apt_sources[@]}" install -y --no-install-recommends skopeo=1.13.3+ds1-2ubuntu0.24.04.3

        # This runner is an owned ephemeral VM, never the shared OLDLAB host daemon.

        python3 source/scripts/configure_ci_registry_mirror.py

        "$PROBE_PYTHON" experiments/candidate_ab/run.py setup

        '
    - name: Build and validate same-SHA producer and format control
      run: '"$PROBE_PYTHON" experiments/candidate_ab/run.py producer'
    - name: Mark before all uploads
      run: '"$PROBE_PYTHON" experiments/candidate_ab/run.py mark --label upload-all-before'
    - name: Mark before upload service
      run: '"$PROBE_PYTHON" experiments/candidate_ab/run.py mark --label upload-service-before'
    - name: Upload raw service
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: service.tar
        path: ${{ env.PROBE_ROOT }}/payload/service.tar
        archive: false
        if-no-files-found: error
        retention-days: 1
    - name: Mark after upload service
      run: '"$PROBE_PYTHON" experiments/candidate_ab/run.py mark --label upload-service-after'
    - name: Mark before upload control_plane
      run: '"$PROBE_PYTHON" experiments/candidate_ab/run.py mark --label upload-control_plane-before'
    - name: Upload raw control_plane
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: control_plane.tar
        path: ${{ env.PROBE_ROOT }}/payload/control_plane.tar
        archive: false
        if-no-files-found: error
        retention-days: 1
    - name: Mark after upload control_plane
      run: '"$PROBE_PYTHON" experiments/candidate_ab/run.py mark --label upload-control_plane-after'
    - name: Mark before upload web
      run: '"$PROBE_PYTHON" experiments/candidate_ab/run.py mark --label upload-web-before'
    - name: Upload raw web
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: web.tar
        path: ${{ env.PROBE_ROOT }}/payload/web.tar
        archive: false
        if-no-files-found: error
        retention-days: 1
    - name: Mark after upload web
      run: '"$PROBE_PYTHON" experiments/candidate_ab/run.py mark --label upload-web-after'
    - name: Mark before upload gateway
      run: '"$PROBE_PYTHON" experiments/candidate_ab/run.py mark --label upload-gateway-before'
    - name: Upload raw gateway
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: gateway.tar
        path: ${{ env.PROBE_ROOT }}/payload/gateway.tar
        archive: false
        if-no-files-found: error
        retention-days: 1
    - name: Mark after upload gateway
      run: '"$PROBE_PYTHON" experiments/candidate_ab/run.py mark --label upload-gateway-after'
    - name: Mark before upload execution_runtime
      run: '"$PROBE_PYTHON" experiments/candidate_ab/run.py mark --label upload-execution_runtime-before'
    - name: Upload raw execution_runtime
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: execution_runtime.tar
        path: ${{ env.PROBE_ROOT }}/payload/execution_runtime.tar
        archive: false
        if-no-files-found: error
        retention-days: 1
    - name: Mark after upload execution_runtime
      run: '"$PROBE_PYTHON" experiments/candidate_ab/run.py mark --label upload-execution_runtime-after'
    - name: Mark before upload execution_actuator
      run: '"$PROBE_PYTHON" experiments/candidate_ab/run.py mark --label upload-execution_actuator-before'
    - name: Upload raw execution_actuator
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: execution_actuator.tar
        path: ${{ env.PROBE_ROOT }}/payload/execution_actuator.tar
        archive: false
        if-no-files-found: error
        retention-days: 1
    - name: Mark after upload execution_actuator
      run: '"$PROBE_PYTHON" experiments/candidate_ab/run.py mark --label upload-execution_actuator-after'
    - name: Mark before upload harbor_runtime
      run: '"$PROBE_PYTHON" experiments/candidate_ab/run.py mark --label upload-harbor_runtime-before'
    - name: Upload raw harbor_runtime
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: harbor_runtime.tar
        path: ${{ env.PROBE_ROOT }}/payload/harbor_runtime.tar
        archive: false
        if-no-files-found: error
        retention-days: 1
    - name: Mark after upload harbor_runtime
      run: '"$PROBE_PYTHON" experiments/candidate_ab/run.py mark --label upload-harbor_runtime-after'
    - name: Mark after all uploads
      run: '"$PROBE_PYTHON" experiments/candidate_ab/run.py mark --label upload-all-after'
    - name: Retain small and validation evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: candidate-ab-evidence-${{ inputs.role }}-${{ github.run_id }}
        path: '${{ env.PROBE_ROOT }}/metrics/

          ${{ env.PROBE_ROOT }}/setup.json'
        compression-level: 6
        retention-days: 3
        if-no-files-found: warn
    - name: Remove only experiment resources
      if: always()
      run: if [[ -n "${PROBE_PYTHON:-}" && -d "$PROBE_ROOT" ]]; then "$PROBE_PYTHON" experiments/candidate_ab/run.py cleanup; fi
  consumer:
    name: native-ab / consumer
    if: github.ref == 'refs/heads/codex/candidate-artifact-transfer-20261016' && inputs.role == 'consumer'
    runs-on: ${{ fromJSON('["self-hosted","linux","x64","loom-ci-exec","loom-ci-isolated-v1","ephemeral-kvm"]') }}
    timeout-minutes: 90
    env:
      PROBE_ROOT: /tmp/loom-candidate-ab-${{ github.run_id }}
      PROBE_SOURCE_SHA: ${{ inputs.source_sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - *id001
    - *id002
    - *id003
    - *id004
    - name: Start all-hit-old
      run: '"$PROBE_PYTHON" experiments/candidate_ab/run.py init --case all-hit-old'
    - name: Native download all-hit-old
      id: all_hit_old
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      continue-on-error: true
      timeout-minutes: 3
      with:
        github-token: ${{ github.token }}
        repository: ${{ github.repository }}
        run-id: ${{ inputs.producer_run_id }}
        pattern: '*.tar'
        merge-multiple: true
        digest-mismatch: error
        path: ${{ env.PROBE_ROOT }}/all-hit-old/download
    - name: Validate and publish all-hit-old
      env:
        NATIVE_DOWNLOAD_OUTCOME: ${{ steps.all_hit_old.outcome }}
      run: '"$PROBE_PYTHON" experiments/candidate_ab/run.py finish --case all-hit-old --outcome "$NATIVE_DOWNLOAD_OUTCOME"'
    - name: Start all-hit-new
      run: '"$PROBE_PYTHON" experiments/candidate_ab/run.py init --case all-hit-new'
    - name: Native download all-hit-new
      id: all_hit_new
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      continue-on-error: true
      timeout-minutes: 3
      with:
        github-token: ${{ github.token }}
        repository: ${{ github.repository }}
        run-id: ${{ inputs.producer_run_id }}
        pattern: '*.tar'
        merge-multiple: true
        digest-mismatch: error
        path: ${{ env.PROBE_ROOT }}/all-hit-new/download
    - name: Validate and publish all-hit-new
      env:
        NATIVE_DOWNLOAD_OUTCOME: ${{ steps.all_hit_new.outcome }}
      run: '"$PROBE_PYTHON" experiments/candidate_ab/run.py finish --case all-hit-new --outcome "$NATIVE_DOWNLOAD_OUTCOME"'
    - name: Start partial-hit-old
      run: '"$PROBE_PYTHON" experiments/candidate_ab/run.py init --case partial-hit-old'
    - name: Native download partial-hit-old
      id: partial_hit_old
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      continue-on-error: true
      timeout-minutes: 3
      with:
        github-token: ${{ github.token }}
        repository: ${{ github.repository }}
        run-id: ${{ inputs.producer_run_id }}
        pattern: '{service,control_plane,gateway,execution_runtime}.tar'
        merge-multiple: true
        digest-mismatch: error
        path: ${{ env.PROBE_ROOT }}/partial-hit-old/download
    - name: Validate and publish partial-hit-old
      env:
        NATIVE_DOWNLOAD_OUTCOME: ${{ steps.partial_hit_old.outcome }}
      run: '"$PROBE_PYTHON" experiments/candidate_ab/run.py finish --case partial-hit-old --outcome "$NATIVE_DOWNLOAD_OUTCOME"'
    - name: Start partial-hit-new
      run: '"$PROBE_PYTHON" experiments/candidate_ab/run.py init --case partial-hit-new'
    - name: Native download partial-hit-new
      id: partial_hit_new
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      continue-on-error: true
      timeout-minutes: 3
      with:
        github-token: ${{ github.token }}
        repository: ${{ github.repository }}
        run-id: ${{ inputs.producer_run_id }}
        pattern: '{service,control_plane,gateway,execution_runtime}.tar'
        merge-multiple: true
        digest-mismatch: error
        path: ${{ env.PROBE_ROOT }}/partial-hit-new/download
    - name: Validate and publish partial-hit-new
      env:
        NATIVE_DOWNLOAD_OUTCOME: ${{ steps.partial_hit_new.outcome }}
      run: '"$PROBE_PYTHON" experiments/candidate_ab/run.py finish --case partial-hit-new --outcome "$NATIVE_DOWNLOAD_OUTCOME"'
    - name: Start full-fallback-old
      run: '"$PROBE_PYTHON" experiments/candidate_ab/run.py init --case full-fallback-old'
    - name: Native download full-fallback-old
      id: full_fallback_old
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      continue-on-error: true
      timeout-minutes: 3
      with:
        github-token: ${{ github.token }}
        repository: ${{ github.repository }}
        run-id: ${{ inputs.producer_run_id }}
        pattern: '{service,control_plane,gateway,execution_runtime}.tar'
        merge-multiple: true
        digest-mismatch: error
        path: ${{ env.PROBE_ROOT }}/full-fallback-old/download
    - name: Validate and publish full-fallback-old
      env:
        NATIVE_DOWNLOAD_OUTCOME: ${{ steps.full_fallback_old.outcome }}
      run: '"$PROBE_PYTHON" experiments/candidate_ab/run.py finish --case full-fallback-old --outcome "$NATIVE_DOWNLOAD_OUTCOME"'
    - name: Start full-fallback-new
      run: '"$PROBE_PYTHON" experiments/candidate_ab/run.py init --case full-fallback-new'
    - name: Native download full-fallback-new
      id: full_fallback_new
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      continue-on-error: true
      timeout-minutes: 3
      with:
        github-token: ${{ github.token }}
        repository: ${{ github.repository }}
        run-id: ${{ inputs.producer_run_id }}
        pattern: '{service,control_plane,gateway,execution_runtime}.tar'
        merge-multiple: true
        digest-mismatch: error
        path: ${{ env.PROBE_ROOT }}/full-fallback-new/download
    - name: Validate and publish full-fallback-new
      env:
        NATIVE_DOWNLOAD_OUTCOME: ${{ steps.full_fallback_new.outcome }}
      run: '"$PROBE_PYTHON" experiments/candidate_ab/run.py finish --case full-fallback-new --outcome "$NATIVE_DOWNLOAD_OUTCOME"'
    - name: Retain small and validation evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: candidate-ab-evidence-${{ inputs.role }}-${{ github.run_id }}
        path: '${{ env.PROBE_ROOT }}/metrics/

          ${{ env.PROBE_ROOT }}/setup.json'
        compression-level: 6
        retention-days: 3
        if-no-files-found: warn
    - name: Remove only experiment resources
      if: always()
      run: if [[ -n "${PROBE_PYTHON:-}" && -d "$PROBE_ROOT" ]]; then "$PROBE_PYTHON" experiments/candidate_ab/run.py cleanup; fi

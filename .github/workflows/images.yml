name: candidate artifact transfer probe
run-name: artifact-probe / ${{ inputs.role }} / ${{ inputs.provider }} / source=${{ inputs.source_sha }} / producer=${{ inputs.producer_run_id
  }}
'on':
  workflow_dispatch:
    inputs:
      role:
        type: choice
        required: true
        options:
        - producer
        - consumer
        default: producer
      provider:
        type: choice
        required: true
        options:
        - oldlab
        - hosted
        default: oldlab
      source_sha:
        type: string
        required: true
        default: 3cb457b280e57b6a6f6df85cadc4c57f59162d53
      producer_run_id:
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: candidate-artifact-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  producer:
    name: producer / ${{ inputs.provider }}
    if: github.ref == 'refs/heads/codex/candidate-artifact-transfer-20261016' && inputs.role == 'producer'
    runs-on: ${{ inputs.provider == 'oldlab' && fromJSON('["self-hosted","linux","x64","loom-ci-exec","loom-ci-isolated-v1","oldlab-3"]')
      || 'ubuntu-24.04' }}
    timeout-minutes: 60
    env:
      PROBE_ROOT: /tmp/loom-artifact-probe-${{ github.run_id }}
      PROBE_SOURCE_SHA: ${{ inputs.source_sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - &id001
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        persist-credentials: false
    - &id002
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        ref: ${{ inputs.source_sha }}
        path: source
        persist-credentials: false
    - &id003
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
      with:
        version: 0.11.26
        checksum: 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0
        enable-cache: false
    - &id004
      name: prepare-isolated-tools
      run: 'set -euo pipefail

        mkdir -p "$PROBE_ROOT/metrics"

        uv venv --python python3 "$RUNNER_TEMP/probe-venv"

        uv pip install --python "$RUNNER_TEMP/probe-venv/bin/python" ''pydantic>=2.6,<3'' ''cryptography>=50,<51'' httpx pyyaml
        python-dotenv ''sqlalchemy[asyncio]>=2,<3'' pydantic-settings ''rfc8785>=0.1.4,<0.2'' structlog zstandard boto3 aiofiles
        tenacity alembic

        echo "PROBE_PYTHON=$RUNNER_TEMP/probe-venv/bin/python" >> "$GITHUB_ENV"

        python3 - <<''PY''

        import json,os,pathlib,platform,shutil

        root=pathlib.Path(os.environ[''PROBE_ROOT''])

        (root/''metrics/runner.json'').write_text(json.dumps({''runner'':os.environ.get(''RUNNER_NAME''),''environment'':os.environ.get(''RUNNER_ENVIRONMENT''),''cpus'':os.cpu_count(),''arch'':platform.machine(),''disk_free'':shutil.disk_usage(root).free,''source_sha'':os.environ[''PROBE_SOURCE_SHA''],''workflow_sha'':os.environ[''GITHUB_SHA''],''run_id'':os.environ[''GITHUB_RUN_ID'']},indent=2)+''\n'')

        PY'
    - name: configure-disposable-runner-mirror
      run: python3 source/scripts/configure_ci_registry_mirror.py
    - name: build-cold-hot-and-export-cache
      run: '"$PROBE_PYTHON" experiments/artifact_transfer/build_probe.py --source "$GITHUB_WORKSPACE/source" --root "$PROBE_ROOT"
        --phase producer --workers 7'
    - name: verify-producer
      run: '"$PROBE_PYTHON" experiments/artifact_transfer/transport_probe.py verify --root "$PROBE_ROOT" --label producer
        --input "$PROBE_ROOT/images" --source "$GITHUB_WORKSPACE/source" --sha "$PROBE_SOURCE_SHA" --scan'
    - name: before-upload-images-0
      run: '"$PROBE_PYTHON" experiments/artifact_transfer/transport_probe.py mark --root "$PROBE_ROOT" --label before-upload-images-0'
    - name: upload-probe-images-0
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: probe-images-0
        path: ${{ env.PROBE_ROOT }}/images/
        compression-level: 0
        if-no-files-found: error
        retention-days: 1
    - name: after-upload-images-0
      run: '"$PROBE_PYTHON" experiments/artifact_transfer/transport_probe.py mark --root "$PROBE_ROOT" --label after-upload-images-0'
    - name: before-upload-images-6
      run: '"$PROBE_PYTHON" experiments/artifact_transfer/transport_probe.py mark --root "$PROBE_ROOT" --label before-upload-images-6'
    - name: upload-probe-images-6
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: probe-images-6
        path: ${{ env.PROBE_ROOT }}/images/
        compression-level: 6
        if-no-files-found: error
        retention-days: 1
    - name: after-upload-images-6
      run: '"$PROBE_PYTHON" experiments/artifact_transfer/transport_probe.py mark --root "$PROBE_ROOT" --label after-upload-images-6'
    - name: before-upload-cache
      run: '"$PROBE_PYTHON" experiments/artifact_transfer/transport_probe.py mark --root "$PROBE_ROOT" --label before-upload-cache'
    - name: upload-probe-cache-min
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: probe-cache-min
        path: ${{ env.PROBE_ROOT }}/cache/
        compression-level: 0
        if-no-files-found: error
        retention-days: 1
    - name: after-upload-cache
      run: '"$PROBE_PYTHON" experiments/artifact_transfer/transport_probe.py mark --root "$PROBE_ROOT" --label after-upload-cache'
    - name: upload-small-evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: probe-metrics-${{ inputs.role }}-${{ inputs.provider }}-${{ github.run_id }}
        path: ${{ env.PROBE_ROOT }}/metrics/
        compression-level: 6
        retention-days: 3
        if-no-files-found: warn
    - name: cleanup-only-probe-root
      if: always()
      run: 'python3 - <<''PY''

        import os,pathlib,shutil

        p=pathlib.Path(os.environ["PROBE_ROOT"])

        assert p==pathlib.Path("/tmp")/("loom-artifact-probe-"+os.environ["GITHUB_RUN_ID"]) and not p.is_symlink()

        if p.exists(): shutil.rmtree(p)

        PY'
  consumer:
    name: consumer / ${{ inputs.provider }}
    if: github.ref == 'refs/heads/codex/candidate-artifact-transfer-20261016' && inputs.role == 'consumer'
    runs-on: ${{ inputs.provider == 'oldlab' && fromJSON('["self-hosted","linux","x64","loom-ci-exec","loom-ci-isolated-v1","oldlab-3"]')
      || 'ubuntu-24.04' }}
    timeout-minutes: 60
    env:
      PROBE_ROOT: /tmp/loom-artifact-probe-${{ github.run_id }}
      PROBE_SOURCE_SHA: ${{ inputs.source_sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - *id001
    - *id002
    - *id003
    - *id004
    - name: before-download-images-0
      run: '"$PROBE_PYTHON" experiments/artifact_transfer/transport_probe.py mark --root "$PROBE_ROOT" --label before-download-images-0'
    - name: download-probe-images-0
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: probe-images-0
        path: ${{ env.PROBE_ROOT }}/images-0
        run-id: ${{ inputs.producer_run_id }}
        repository: ${{ github.repository }}
        github-token: ${{ github.token }}
        skip-decompress: false
        digest-mismatch: error
    - name: after-download-images-0
      run: '"$PROBE_PYTHON" experiments/artifact_transfer/transport_probe.py mark --root "$PROBE_ROOT" --label after-download-images-0'
    - name: verify-images-0
      run: '"$PROBE_PYTHON" experiments/artifact_transfer/transport_probe.py verify --root "$PROBE_ROOT" --label images-0
        --input "$PROBE_ROOT/images-0" --source "$GITHUB_WORKSPACE/source" --sha "$PROBE_SOURCE_SHA" --scan'
    - name: remove-verified-images-0
      run: rm "$PROBE_ROOT/images-0"/*.tar
    - name: before-download-images-6
      run: '"$PROBE_PYTHON" experiments/artifact_transfer/transport_probe.py mark --root "$PROBE_ROOT" --label before-download-images-6'
    - name: download-probe-images-6
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: probe-images-6
        path: ${{ env.PROBE_ROOT }}/images-6
        run-id: ${{ inputs.producer_run_id }}
        repository: ${{ github.repository }}
        github-token: ${{ github.token }}
        skip-decompress: false
        digest-mismatch: error
    - name: after-download-images-6
      run: '"$PROBE_PYTHON" experiments/artifact_transfer/transport_probe.py mark --root "$PROBE_ROOT" --label after-download-images-6'
    - name: verify-images-6
      run: '"$PROBE_PYTHON" experiments/artifact_transfer/transport_probe.py verify --root "$PROBE_ROOT" --label images-6
        --input "$PROBE_ROOT/images-6" --source "$GITHUB_WORKSPACE/source" --sha "$PROBE_SOURCE_SHA"'
    - name: remove-verified-images-6
      run: rm "$PROBE_ROOT/images-6"/*.tar
    - name: before-download-raw
      run: '"$PROBE_PYTHON" experiments/artifact_transfer/transport_probe.py mark --root "$PROBE_ROOT" --label before-download-raw'
    - name: download-probe-images-0-raw
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: probe-images-0
        path: ${{ env.PROBE_ROOT }}/raw-images
        run-id: ${{ inputs.producer_run_id }}
        repository: ${{ github.repository }}
        github-token: ${{ github.token }}
        skip-decompress: true
        digest-mismatch: error
    - name: after-download-raw
      run: '"$PROBE_PYTHON" experiments/artifact_transfer/transport_probe.py mark --root "$PROBE_ROOT" --label after-download-raw'
    - name: extract-raw-diagnostic
      run: '"$PROBE_PYTHON" experiments/artifact_transfer/transport_probe.py extract --root "$PROBE_ROOT" --label raw-extracted
        --input "$PROBE_ROOT/raw-images"'
    - name: verify-raw-extracted
      run: '"$PROBE_PYTHON" experiments/artifact_transfer/transport_probe.py verify --root "$PROBE_ROOT" --label raw-extracted
        --input "$PROBE_ROOT/raw-extracted" --source "$GITHUB_WORKSPACE/source" --sha "$PROBE_SOURCE_SHA"'
    - name: remove-verified-diagnostic
      run: rm "$PROBE_ROOT/raw-extracted"/*.tar
    - name: before-download-cache
      run: '"$PROBE_PYTHON" experiments/artifact_transfer/transport_probe.py mark --root "$PROBE_ROOT" --label before-download-cache'
    - name: download-probe-cache-min
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: probe-cache-min
        path: ${{ env.PROBE_ROOT }}/cache
        run-id: ${{ inputs.producer_run_id }}
        repository: ${{ github.repository }}
        github-token: ${{ github.token }}
        skip-decompress: false
        digest-mismatch: error
    - name: after-download-cache
      run: '"$PROBE_PYTHON" experiments/artifact_transfer/transport_probe.py mark --root "$PROBE_ROOT" --label after-download-cache'
    - name: configure-disposable-runner-mirror
      run: python3 source/scripts/configure_ci_registry_mirror.py
    - name: cross-task-hot-cache-parallel-rebuild
      run: '"$PROBE_PYTHON" experiments/artifact_transfer/build_probe.py --source "$GITHUB_WORKSPACE/source" --root "$PROBE_ROOT"
        --phase cache-rebuild --workers 7 --import-cache "$PROBE_ROOT/cache"'
    - name: verify-cache-rebuild
      run: '"$PROBE_PYTHON" experiments/artifact_transfer/transport_probe.py verify --root "$PROBE_ROOT" --label cache-rebuild
        --input "$PROBE_ROOT/rebuilt-images" --source "$GITHUB_WORKSPACE/source" --sha "$PROBE_SOURCE_SHA" --scan'
    - name: upload-small-evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: probe-metrics-${{ inputs.role }}-${{ inputs.provider }}-${{ github.run_id }}
        path: ${{ env.PROBE_ROOT }}/metrics/
        compression-level: 6
        retention-days: 3
        if-no-files-found: warn
    - name: cleanup-only-probe-root
      if: always()
      run: 'python3 - <<''PY''

        import os,pathlib,shutil

        p=pathlib.Path(os.environ["PROBE_ROOT"])

        assert p==pathlib.Path("/tmp")/("loom-artifact-probe-"+os.environ["GITHUB_RUN_ID"]) and not p.is_symlink()

        if p.exists(): shutil.rmtree(p)

        PY'

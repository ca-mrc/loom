name: ci-dependency-cache

# setup-uv prunes downloaded wheels before saving by default, so CI's cache held
# only locally built packages (~180 KB) and every job re-downloaded ~150 wheels
# from PyPI: ~5s on GitHub VMs but 4-5 minutes, with timeouts, on OLDLAB guests.
# This is the only writer of the full, unpruned wheel cache (~200 MB compressed)
# that CI jobs restore read-only. It runs on protected dev or on a schedule,
# never on PR code, and saves once per uv.lock (an existing key is not
# overwritten). PRs and merge groups read dev's caches.
#
# It is also the only writer of the source-built MinIO fixture archives.
# quay.io/minio/minio no longer serves anonymous pulls, so a cache miss means a
# multi-minute Go build that fails when the Go module proxy resets. CI saves
# used to come only from trusted push runs, per selected image set and per
# RUNNER_TEMP path, so recipe changes left PR jobs cold until a dev run
# happened to select the same shards.

on:
  push:
    branches: [dev]
    paths: [uv.lock, tests/support/minio_images.py, .github/workflows/ci-dependency-cache.yml]
  # Backstop for an evicted or never-written key.
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch: {}

concurrency:
  group: ci-dependency-cache-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  wheel-cache:
    name: Save full CI wheel cache
    # GitHub-hosted for fast PyPI downloads; same OS/arch key as OLDLAB guests.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.26"
          checksum: 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0
          enable-cache: true
          save-cache: true
          prune-cache: false
          cache-suffix: ci-wheels-v2
          # Same path on GitHub-hosted and self-hosted runners; setup-uv's
          # defaults differ and the cache version hashes the path.
          cache-local-path: /home/runner/.cache/uv
          cache-dependency-glob: uv.lock

      - name: Install Python 3.11
        run: uv python install 3.11

      # Superset of every CI reader's sync, so no reader misses a wheel.
      - name: Download every CI dependency
        run: |
          uv sync --locked --all-packages --extra dev --extra cluster --extra rollout \
            --group ci-coverage --python 3.11

  minio-fixtures:
    name: Save source-built MinIO fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      # Without --test-paths-file every fixture is selected; readers use the
      # same key for any non-empty selection.
      - name: Compute fixture cache key
        id: key
        run: echo "key=$(python3 -m tests.support.minio_images --cache-key)" >> "$GITHUB_OUTPUT"

      - name: Check for an existing archive set
        id: existing
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /home/runner/.cache/loom-minio-fixtures
          key: ${{ runner.os }}-${{ steps.key.outputs.key }}
          lookup-only: true

      - name: Build and verify every pinned fixture
        if: steps.existing.outputs.cache-hit != 'true'
        run: |
          python3 -m tests.support.minio_images \
            --cache-dir /home/runner/.cache/loom-minio-fixtures --save-cache true
          # An incomplete set would stick under this key, so save only all of it.
          expected=$(python3 -c 'from tests.support.minio_images import SOURCE_FIXTURES; print(len(SOURCE_FIXTURES))')
          actual=$(find /home/runner/.cache/loom-minio-fixtures -name '*.tar' | wc -l)
          [ "$actual" -eq "$expected" ] || { echo "expected $expected fixture archives, found $actual" >&2; exit 1; }

      - name: Save fixture archives
        if: steps.existing.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /home/runner/.cache/loom-minio-fixtures
          key: ${{ runner.os }}-${{ steps.key.outputs.key }}

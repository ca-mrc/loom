name: ci-runner-bridge-probe
run-name: loom-ci-hosted slot=${{ inputs.slot }} request=${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      slot:
        type: string
        required: true
      request_id:
        type: string
        required: true
      mode:
        type: choice
        options:
        - capacity
        - payload
        - oldlab
        default: capacity
permissions:
  contents: read
jobs:
  capacity:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        persist-credentials: false
    - name: Serve one native Actions job on this disposable hosted VM
      env:
        LOOM_CI_JIT_CONFIG: ${{ secrets[format('LOOM_CI_HOSTED_JIT_{0}', inputs.slot)]
          }}
      run: python3 scripts/ops/ci_hosted_worker.py
    if: inputs.mode == 'capacity'
  bridge-payload:
    if: inputs.mode != 'capacity'
    runs-on: ${{ inputs.mode == 'oldlab' && fromJSON('["self-hosted","linux","x64","loom-ci-exec","loom-ci-isolated-v1"]')
      || fromJSON('["self-hosted","linux","x64","loom-ci-bridge-probe"]') }}
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        persist-credentials: false
    - name: Verify marked disposable Docker daemon
      run: python3 scripts/configure_ci_registry_mirror.py
    - name: Prove native checkout and isolated Docker execution
      shell: bash
      run: 'set -euo pipefail

        test "$RUNNER_ENVIRONMENT" = self-hosted

        test "$(uname -m)" = x86_64

        docker version

        timeout 90 docker run --rm hello-world

        python3 - <<''PY''

        import json,os,subprocess

        from pathlib import Path

        proof={"workflow_run_id":os.environ["GITHUB_RUN_ID"],"runner_name":os.environ["RUNNER_NAME"],"runner_environment":os.environ["RUNNER_ENVIRONMENT"],"checkout_sha":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),"native_checkout":"PASS","docker_run":"PASS"}

        Path("bridge-proof.json").write_text(json.dumps(proof,indent=2)+"\n")

        print(json.dumps(proof))

        PY

        '
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: hosted-vm-native-runner-proof
        path: bridge-proof.json
        if-no-files-found: error

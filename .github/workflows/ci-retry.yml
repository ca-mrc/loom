name: classified-ci-retry
run-name: >-
  ${{ inputs.purpose == 'runner_capacity' &&
      format('loom-ci-hosted slot={0} request={1}', inputs.slot, inputs.request_id) ||
      format('ci-retry-v1 source_run={0} failed_attempt={1} reason={2} actor={3}',
             inputs.source_run_id, inputs.failed_attempt, inputs.reason, github.actor) }}

on:
  workflow_dispatch:
    inputs:
      purpose:
        description: Classified retry or isolated single-job runner capacity
        type: choice
        options: [retry, runner_capacity]
        default: retry
      slot:
        description: Capacity controller slot (unused for retries)
        type: string
      request_id:
        description: Unique capacity request (unused for retries)
        type: string
      source_run_id:
        description: Terminal required-source workflow run ID
        required: true
        type: string
      failed_attempt:
        description: Current failed/cancelled attempt number
        required: true
        type: string
      reason:
        description: Root-cause classification
        required: true
        type: choice
        options: [platform_transient, external_dependency, capacity_queue, code_failure]
      evidence_url:
        description: Same-repository run, issue, or PR evidence URL
        required: true
        type: string
      mode:
        description: Retry failed jobs, or all jobs only after capacity/queue loss
        required: true
        type: choice
        options: [failed_jobs, all_jobs]

permissions:
  contents: read

# A retry request mutates the source workflow run. Serialize requests for the
# same source run and let an accepted request finish so a later dispatch cannot
# cancel it after GitHub has begun the rerun operation.
concurrency:
  group: >-
    ${{ inputs.purpose == 'runner_capacity' &&
        format('loom-ci-hosted-{0}', inputs.request_id) ||
        format('classified-ci-retry-{0}', inputs.source_run_id) }}
  cancel-in-progress: false

jobs:
  retry:
    if: inputs.purpose != 'runner_capacity'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout trusted retry policy
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Record classification and request bounded retry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          FAILED_ATTEMPT: ${{ inputs.failed_attempt }}
          RETRY_REASON: ${{ inputs.reason }}
          EVIDENCE_URL: ${{ inputs.evidence_url }}
          RETRY_MODE: ${{ inputs.mode }}
          RETRY_ACTOR: ${{ github.actor }}
        run: >-
          python3 scripts/ops/ci_retry_governance.py
          --repository "$GITHUB_REPOSITORY"
          --source-run-id "$SOURCE_RUN_ID"
          --failed-attempt "$FAILED_ATTEMPT"
          --reason "$RETRY_REASON"
          --evidence-url "$EVIDENCE_URL"
          --mode "$RETRY_MODE"
          --actor "$RETRY_ACTOR"

  capacity:
    if: inputs.purpose == 'runner_capacity'
    runs-on: ubuntu-24.04
    # A normal candidate build owns 180 minutes; leave bootstrap/teardown room.
    # Six-hour qualification runs directly on hosted capacity in the candidate workflow.
    timeout-minutes: 195
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Serve one native Actions job on this disposable hosted VM
        env:
          LOOM_CI_JIT_CONFIG: ${{ secrets[format('LOOM_CI_HOSTED_JIT_{0}', inputs.slot)] }}
        run: python3 scripts/ops/ci_hosted_worker.py

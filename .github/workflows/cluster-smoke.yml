name: cluster-smoke

# Credential-free candidate validation. Selected PRs run the manifest-owned
# cluster tests, environment-isolation policy, and render/audit both staging
# and production profiles. Live-cluster readiness remains a protected
# post-merge rollout/promotion concern.

run-name: >-
  ${{ github.event_name == 'workflow_dispatch' &&
      format('gate=manual / head={0} / base={1} / updated={2} / action={3} / label={4} / labels={5} / pull={6}',
             github.sha,
             github.event.before || github.sha,
             github.event.pull_request.updated_at || 'none',
             github.event.action || github.event_name,
             github.event.label.name || 'none',
             format('{0}{1}{2}{3}{4}{5}',
                    contains(github.event.pull_request.labels.*.name, 'ci:integration') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:integration-docker') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:images') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'cluster-smoke') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'staging-smoke') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:coverage-summary') && '1' || '0'),
             github.event.pull_request.number || 'none') ||
      github.event_name == 'pull_request' &&
      (github.event.pull_request.draft ||
       github.event.action == 'converted_to_draft') &&
      format('gate=filtered / head={0} / base={1} / updated={2} / action={3} / label={4} / labels={5} / pull={6}',
             github.event.pull_request.head.sha,
             github.event.pull_request.base.sha,
             github.event.pull_request.updated_at,
             github.event.action,
             github.event.label.name || 'none',
             format('{0}{1}{2}{3}{4}{5}',
                    contains(github.event.pull_request.labels.*.name, 'ci:integration') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:integration-docker') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:images') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'cluster-smoke') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'staging-smoke') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:coverage-summary') && '1' || '0'),
             github.event.pull_request.number || 'none') ||
      format('gate=full / head={0} / base={1} / updated={2} / action={3} / label={4} / labels={5} / pull={6}',
             github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha,
             github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || github.sha,
             github.event.pull_request.updated_at || 'none',
             github.event.action || github.event_name,
             github.event.label.name || 'none',
             format('{0}{1}{2}{3}{4}{5}',
                    contains(github.event.pull_request.labels.*.name, 'ci:integration') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:integration-docker') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:images') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'cluster-smoke') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'staging-smoke') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:coverage-summary') && '1' || '0'),
             github.event.pull_request.number || 'none') }}

# Validates Nebius and common disposable Kubernetes contracts. Historical
# staging render/isolation checks run only in explicit compatibility/main scope.
# This workflow does not deploy to live environments.
#
# Trigger model:
#   - workflow_dispatch (manual)
#   - PRs selected by changed paths or the additive `cluster-smoke` label
#   - push to dev when cluster CLI / templates change

on:
  workflow_dispatch:
    inputs:
      legacy_compatibility:
        description: "Include historical platform contracts (manual only)"
        required: false
        type: boolean
        default: false
  push:
    branches: [dev]
    paths:
      - "src/loom_cli/cluster_cmd.py"
      - "src/loom_cli/cluster_config.py"
      - "src/loom_cli/templates/k8s/**"
      - ".github/workflows/cluster-smoke.yml"
  pull_request:
    # Every non-draft PR event reports the protected gate name. The planner
    # selects smoke from changed paths or labels; drafts remain filtered.
    types: [labeled, unlabeled, opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: >-
    cluster-smoke-${{ github.event.pull_request.number || github.ref }}-${{
      github.event_name == 'pull_request' &&
      (github.event.pull_request.draft ||
       github.event.action == 'converted_to_draft') &&
      format('filtered-{0}', github.run_id) || 'authoritative' }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' &&
        !(github.event.pull_request.draft ||
          github.event.action == 'converted_to_draft') }}

env:
  CI_TEST_SCOPE: ${{ ((github.event_name == 'workflow_dispatch' && inputs.legacy_compatibility) || github.ref == 'refs/heads/main' || github.base_ref == 'main') && 'all' || 'nebius' }}
  CI_PYTEST_MARKERS: ${{ ((github.event_name == 'workflow_dispatch' && inputs.legacy_compatibility) || github.ref == 'refs/heads/main' || github.base_ref == 'main') && 'legacy_pool or not legacy_pool' || 'not legacy_pool' }}

jobs:
  plan:
    name: cluster smoke plan
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.plan.outputs.cluster_smoke || steps.event.outputs.required }}
      gate_mode: ${{ steps.plan.outputs.gate_mode || steps.event.outputs.gate_mode }}
      test_changes: ${{ steps.plan.outputs.test_changes }}
      cluster_smoke_matrix: ${{ steps.plan.outputs.cluster_smoke_matrix }}
    steps:
      - name: Classify filtered event before checkout
        id: event
        shell: bash
        env:
          FILTERED_EVENT: >-
            ${{ github.event_name == 'pull_request' &&
                (github.event.pull_request.draft ||
                 github.event.action == 'converted_to_draft') }}
        run: |
          set -euo pipefail
          if [[ "$FILTERED_EVENT" == "true" ]]; then
            {
              echo 'checkout_required=false'
              echo 'gate_mode=filtered'
              echo 'required=false'
            } >> "$GITHUB_OUTPUT"
          else
            echo 'checkout_required=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        if: steps.event.outputs.checkout_required == 'true'
        with:
          fetch-depth: 0

      - name: Plan required cluster smoke validation
        id: plan
        if: steps.event.outputs.checkout_required == 'true'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_ACTION: ${{ github.event.action }}
          PR_ACTION_LABEL: ${{ github.event.label.name }}
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
          PR_BASE_CHANGED: ${{ github.event.changes.base != null }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              git diff --name-only "$BASE_SHA...$HEAD_SHA" \
                > /tmp/loom-changed-files.txt
              ;;
            merge_group)
              git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
                > /tmp/loom-changed-files.txt
              ;;
            push)
              if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
                git ls-tree -r --name-only "$HEAD_SHA" \
                  > /tmp/loom-changed-files.txt
              else
                git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
                  > /tmp/loom-changed-files.txt
              fi
              ;;
            workflow_dispatch)
              git show --pretty=format: --name-only "$HEAD_SHA" \
                > /tmp/loom-changed-files.txt
              PR_LABELS_JSON='["cluster-smoke"]'
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac
          sort -u -o /tmp/loom-changed-files.txt /tmp/loom-changed-files.txt
          if [[ -z "$PR_LABELS_JSON" || "$PR_LABELS_JSON" == "null" ]]; then
            PR_LABELS_JSON='[]'
          fi
          python3 scripts/plan_ci_validations.py \
            --changed-files /tmp/loom-changed-files.txt \
            --labels-json "$PR_LABELS_JSON" \
            --event-name "$EVENT_NAME" \
            --pull-request-action "$PR_ACTION" \
            --pull-request-action-label "$PR_ACTION_LABEL" \
            --pull-request-draft "$PR_DRAFT" \
            --pull-request-base-changed "$PR_BASE_CHANGED" \
            --github-output "$GITHUB_OUTPUT"

  cluster-contract:
    name: cluster contract (${{ matrix.shard }}, live k3s topology)
    needs: [plan]
    if: >-
      needs.plan.outputs.gate_mode == 'full' &&
      needs.plan.outputs.required == 'true'
    runs-on: ubuntu-24.04
    # The expanded serial suite reached only 61% before its 35-minute limit.
    # Independent runners retain complete coverage and every per-test deadline.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.cluster_smoke_matrix) }}
    env:
      TEST_CHANGED_PATHS: ${{ needs.plan.outputs.test_changes }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Configure credential-free Docker Hub mirror
        run: python3 scripts/configure_ci_registry_mirror.py

      - name: Select nonempty cluster manifest
        id: manifest
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard_index }}
          SHARD_COUNT: ${{ matrix.shard_count }}
        run: |
          set -euo pipefail
          manifest_paths_file="${RUNNER_TEMP}/cluster-manifest.txt"
          python3 scripts/component_ownership.py test-paths --lane cluster-smoke --test-scope "${CI_TEST_SCOPE:-all}" \
            --changed-paths-json "$TEST_CHANGED_PATHS" \
            --shard-index "$SHARD_INDEX" --shard-count "$SHARD_COUNT" > "$manifest_paths_file"
          test -s "$manifest_paths_file"
          echo "paths_file=$manifest_paths_file" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.26"
          checksum: 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0
          enable-cache: true
          save-cache: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
          cache-dependency-glob: uv.lock

      - name: Sync cluster-contract dependencies
        run: |
          uv python install 3.11
          uv sync --locked --all-packages --extra dev --extra cluster --extra rollout --python 3.11
          uv pip check --python .venv/bin/python

      - name: Install pinned registry qualification tooling
        shell: bash
        run: |
          set -euo pipefail
          test -s /etc/apt/sources.list.d/ubuntu.sources
          apt_sources=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-)
          sudo apt-get "${apt_sources[@]}" update
          sudo apt-get "${apt_sources[@]}" install -y --no-install-recommends skopeo=1.13.3+ds1-2ubuntu0.24.04.3
          test "$(dpkg-query -W -f='${Version}' skopeo)" = '1.13.3+ds1-2ubuntu0.24.04.3'
          skopeo --version

      - name: Verify manifest-owned k3s and rollout candidate contracts
        env:
          LOOM_RUN_DISPOSABLE_K3S: "1"
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t test_paths < "${{ steps.manifest.outputs.paths_file }}"
          [[ ${#test_paths[@]} -gt 0 ]]
          uv run --no-sync pytest -m "${CI_PYTEST_MARKERS:-not legacy_pool}" "${test_paths[@]}" --durations=15

  cluster-smoke-gate:
    name: >-
      ${{ github.event_name == 'workflow_dispatch' && 'cluster-smoke-gate-manual' ||
          github.event_name == 'push' && 'cluster-smoke-gate-push' ||
          needs.plan.outputs.gate_mode == 'full' && 'cluster-smoke-gate' ||
          'cluster-smoke-gate-filtered' }}
    runs-on: ubuntu-latest
    if: always() && needs.plan.outputs.gate_mode != 'filtered'
    needs: [plan, cluster-contract]
    steps:
      - name: Enforce selected cluster smoke result
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          GATE_MODE: ${{ needs.plan.outputs.gate_mode }}
          REQUIRED: ${{ needs.plan.outputs.required }}
          CONTRACT_RESULT: ${{ needs.cluster-contract.result }}
        run: |
          set -euo pipefail
          [[ "$PLAN_RESULT" == "success" ]] || exit 1
          case "$GATE_MODE" in
            full|filtered) ;;
            *) echo "FAIL: invalid gate mode ${GATE_MODE@Q}" >&2; exit 1 ;;
          esac
          if [[ "$GATE_MODE" == "filtered" ]]; then
            [[ "$CONTRACT_RESULT" == "skipped" ]] || exit 1
            exit 0
          fi
          case "$REQUIRED" in
            true|false) ;;
            *) echo "FAIL: invalid planner boolean required=${REQUIRED@Q}" >&2; exit 1 ;;
          esac
          if [[ "$REQUIRED" == "true" ]]; then
            [[ "$CONTRACT_RESULT" == "success" ]] || exit 1
          else
            [[ "$CONTRACT_RESULT" == "skipped" || "$CONTRACT_RESULT" == "success" ]] || exit 1
          fi

name: nebius-rollout

on:
  schedule:
    - cron: "7-57/10 * * * *"
  workflow_run:
    workflows: [nebius-candidate]
    types: [completed]
    branches: [dev]
  workflow_dispatch:
    inputs:
      operation:
        description: Idle rollout, inventory, certificates, ingress, or protected management installation
        type: choice
        options: [rollout, recover, inspect, certificate, ingress, ingress-rollback, ingress-dns, management-preflight, management-install, management-diagnostic-preflight, management-diagnostic-install, management-recovery-preflight, management-recovery-install, management-refresh-preflight, management-refresh-install, management-pool-preflight, management-pool-install, management-pool-rollback]
        default: rollout
      recovery_run_id:
        description: With recover only, terminal failed rollout whose immutable candidate and guard are resumed
        type: string
        default: ""
      prepare_shared_inputs:
        description: With inspect only, retain application upgrade inputs privately on the gateway (no cluster writes)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  deployments: write

# Publication and PR CI never wait for this environment's deployment.
concurrency:
  group: nebius-integration-rollout
  # Periodic checks must not replace a queued manual recovery.
  queue: max
  cancel-in-progress: false

jobs:
  explain-skip:
    name: Explain why automatic rollout did not start
    if: >-
      github.repository == 'qianyi-sun/loom' &&
      (github.event_name == 'schedule' && vars.NEBIUS_AUTO_ROLLOUT_ENABLED != 'true' ||
       github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.conclusion != 'success' || vars.NEBIUS_AUTO_ROLLOUT_ENABLED != 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: dev
          persist-credentials: false
      - name: Explain publication or configuration skip
        env:
          AUTO_ROLLOUT_ENABLED: ${{ vars.NEBIUS_AUTO_ROLLOUT_ENABLED }}
        run: python3 scripts/ops/nebius_rollout_reporting.py publication

  check:
    name: Check deployment conditions
    if: >-
      github.repository == 'qianyi-sun/loom' &&
      vars.NEBIUS_AUTO_ROLLOUT_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev' && (inputs.operation == 'rollout' || inputs.operation == 'recover') ||
       github.event_name == 'schedule' && github.ref == 'refs/heads/dev' ||
       github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    outputs:
      status: ${{ steps.readiness.outputs.status || steps.publication.outputs.status }}
      candidate_sha: ${{ steps.publication.outputs.sha }}
      run_id: ${{ steps.publication.outputs.run_id }}
      artifact: ${{ steps.publication.outputs.artifact }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: nebius-integration
      deployment: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.26"
          checksum: 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0
          enable-cache: true
          save-cache: true
          cache-dependency-glob: uv.lock
      - name: Install deployment tooling
        run: uv sync --locked --no-dev --extra cluster
      - name: Select successful platform publication
        id: publication
        env:
          PUBLICATION_RUN_ID: ${{ github.event.workflow_run.id }}
          OPERATION: ${{ inputs.operation }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$OPERATION" == 'recover' ]]; then
            test -n "$RECOVERY_RUN_ID"
            args+=(--recovery-run-id "$RECOVERY_RUN_ID" --recovery-dir "$RUNNER_TEMP/recovery")
          elif [[ -n "$PUBLICATION_RUN_ID" ]]; then
            args+=(--trigger-run-id "$PUBLICATION_RUN_ID")
          fi
          uv run --no-sync python scripts/ops/nebius_idle_rollout.py select "${args[@]}"
      - name: Check deployment conditions
        id: readiness
        if: steps.publication.outputs.status == 'ready' && inputs.operation != 'recover'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.NEBIUS_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.NEBIUS_DEPLOY_SSH_KNOWN_HOSTS }}
          LOOM_DEPLOY_SSH_TARGET: ${{ vars.NEBIUS_DEPLOY_SSH_TARGET }}
          REMOTE_KUBECONFIG: ${{ vars.NEBIUS_DEPLOY_KUBECONFIG_PATH }}
          CLUSTER_ID: ${{ vars.NEBIUS_DEPLOY_CLUSTER_ID }}
          CANDIDATE_SHA: ${{ steps.publication.outputs.sha }}
          AUTOMATIC: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_run' }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export LOOM_DEPLOY_SSH_KEY_FILE="$RUNNER_TEMP/nebius-check-key"
          export LOOM_DEPLOY_SSH_KNOWN_HOSTS_FILE="$RUNNER_TEMP/nebius-check-known-hosts"
          trap 'rm -f -- "$LOOM_DEPLOY_SSH_KEY_FILE" "$LOOM_DEPLOY_SSH_KNOWN_HOSTS_FILE"' EXIT
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$LOOM_DEPLOY_SSH_TARGET"
          test -n "$REMOTE_KUBECONFIG"
          test -n "$CLUSTER_ID"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$LOOM_DEPLOY_SSH_KEY_FILE"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$LOOM_DEPLOY_SSH_KNOWN_HOSTS_FILE"
          unset DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS
          extra_args=()
          if [[ "$AUTOMATIC" == 'true' ]]; then extra_args+=(--automatic); fi
          uv run --no-sync python scripts/ops/nebius_idle_rollout.py check \
            --candidate "$CANDIDATE_SHA" --kubeconfig "$REMOTE_KUBECONFIG" \
            --expected-cluster-id "$CLUSTER_ID" \
            --github "${extra_args[@]}"

  rollout:
    name: Deploy selected candidate
    needs: check
    if: >-
      needs.check.outputs.status == 'ready' &&
      github.repository == 'qianyi-sun/loom' &&
      vars.NEBIUS_AUTO_ROLLOUT_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev' && (inputs.operation == 'rollout' || inputs.operation == 'recover') ||
       github.event_name == 'schedule' && github.ref == 'refs/heads/dev' ||
       github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment:
      name: nebius-integration
      deployment: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.26"
          checksum: 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0
          enable-cache: true
          save-cache: true
          cache-dependency-glob: uv.lock
      - name: Install deployment tooling
        run: uv sync --locked --no-dev --extra cluster
      - name: Load original recovery evidence
        id: recovery
        if: inputs.operation == 'recover'
        env:
          OPERATION: ${{ inputs.operation }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$OPERATION" == 'recover' ]]; then
            test -n "$RECOVERY_RUN_ID"
            args+=(--recovery-run-id "$RECOVERY_RUN_ID" --recovery-dir "$RUNNER_TEMP/recovery")
          fi
          uv run --no-sync python scripts/ops/nebius_idle_rollout.py select "${args[@]}"
      - name: Download selected candidate
        env:
          PUBLICATION_RUN_ID: ${{ needs.check.outputs.run_id }}
          ARTIFACT_NAME: ${{ needs.check.outputs.artifact }}
        run: >-
          gh run download "$PUBLICATION_RUN_ID" --repo "$GITHUB_REPOSITORY"
          --name "$ARTIFACT_NAME" --dir "$RUNNER_TEMP/publication"
      - name: Deploy once if idle
        env:
          DEPLOY_SSH_KEY: ${{ secrets.NEBIUS_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.NEBIUS_DEPLOY_SSH_KNOWN_HOSTS }}
          LOOM_DEPLOY_SSH_TARGET: ${{ vars.NEBIUS_DEPLOY_SSH_TARGET }}
          REMOTE_KUBECONFIG: ${{ vars.NEBIUS_DEPLOY_KUBECONFIG_PATH }}
          CLUSTER_ID: ${{ vars.NEBIUS_DEPLOY_CLUSTER_ID }}
          CANDIDATE_SHA: ${{ needs.check.outputs.candidate_sha }}
          AUTOMATIC: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_run' }}
          RECOVERY_EVIDENCE: ${{ steps.recovery.outputs.recovery_evidence }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export LOOM_DEPLOY_SSH_KEY_FILE="$RUNNER_TEMP/nebius-deploy-key"
          export LOOM_DEPLOY_SSH_KNOWN_HOSTS_FILE="$RUNNER_TEMP/nebius-deploy-known-hosts"
          trap 'rm -f -- "$LOOM_DEPLOY_SSH_KEY_FILE" "$LOOM_DEPLOY_SSH_KNOWN_HOSTS_FILE"' EXIT
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$LOOM_DEPLOY_SSH_TARGET"
          test -n "$REMOTE_KUBECONFIG"
          test -n "$CLUSTER_ID"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$LOOM_DEPLOY_SSH_KEY_FILE"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$LOOM_DEPLOY_SSH_KNOWN_HOSTS_FILE"
          unset DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS
          extra_args=()
          if [[ "$AUTOMATIC" == 'true' ]]; then extra_args+=(--automatic); fi
          if [[ -n "$RECOVERY_EVIDENCE" ]]; then extra_args+=(--recovery-evidence "$RECOVERY_EVIDENCE"); fi
          uv run --no-sync python scripts/ops/nebius_idle_rollout.py run \
            --publication-dir "$RUNNER_TEMP/publication" \
            --candidate "$CANDIDATE_SHA" --kubeconfig "$REMOTE_KUBECONFIG" \
            --expected-cluster-id "$CLUSTER_ID" \
            --evidence-dir "$RUNNER_TEMP/nebius-rollout" --github "${extra_args[@]}"
      - name: Preserve sanitized deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nebius-rollout-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nebius-rollout/deployment-*.json
          if-no-files-found: ignore
          retention-days: 30

  certificate:
    if: >-
      github.repository == 'qianyi-sun/loom' &&
      github.ref == 'refs/heads/dev' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'certificate'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    environment:
      name: nebius-integration
      deployment: false
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.26"
          checksum: 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0
          enable-cache: true
          save-cache: true
          cache-dependency-glob: uv.lock
      - name: Install isolated locked certificate tooling
        run: |
          uv sync --locked --only-group nebius-certificates --no-install-project --no-install-workspace
          uv export --locked --only-group nebius-certificates --no-emit-project --no-emit-workspace \
            --format requirements-txt --no-header --quiet --output-file "$RUNNER_TEMP/certificate-requirements.txt"
      - name: Qualify certificate on the private gateway
        env:
          DEPLOY_SSH_KEY: ${{ secrets.NEBIUS_CERTIFICATE_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.NEBIUS_DEPLOY_SSH_KNOWN_HOSTS }}
          LOOM_DEPLOY_SSH_TARGET: ${{ vars.NEBIUS_DEPLOY_SSH_TARGET }}
          NEBIUS_CERTIFICATE_INSTALLATION_JSON: ${{ vars.NEBIUS_CERTIFICATE_INSTALLATION_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export LOOM_DEPLOY_SSH_KEY_FILE="$RUNNER_TEMP/nebius-certificate-key"
          export LOOM_DEPLOY_SSH_KNOWN_HOSTS_FILE="$RUNNER_TEMP/nebius-certificate-known-hosts"
          trap 'rm -f -- "$LOOM_DEPLOY_SSH_KEY_FILE" "$LOOM_DEPLOY_SSH_KNOWN_HOSTS_FILE"' EXIT
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$LOOM_DEPLOY_SSH_TARGET"
          test -n "$NEBIUS_CERTIFICATE_INSTALLATION_JSON"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$LOOM_DEPLOY_SSH_KEY_FILE"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$LOOM_DEPLOY_SSH_KNOWN_HOSTS_FILE"
          unset DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS
          uv run --no-sync python scripts/ops/nebius_certificate_rollout.py \
            --requirements "$RUNNER_TEMP/certificate-requirements.txt" \
            --evidence-dir "$RUNNER_TEMP/nebius-certificate"
      - name: Preserve sanitized certificate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nebius-certificate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nebius-certificate/certificate-result.json
          if-no-files-found: ignore
          retention-days: 30

  ingress:
    if: >-
      github.repository == 'qianyi-sun/loom' &&
      github.ref == 'refs/heads/dev' &&
      github.event_name == 'workflow_dispatch' &&
      (inputs.operation == 'ingress' || inputs.operation == 'ingress-rollback' || inputs.operation == 'ingress-dns')
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: read
    environment:
      name: nebius-integration
      deployment: false
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false
      - name: Select the exact integrated ingress authority source
        id: tooling
        env:
          NEBIUS_INGRESS_INSTALLATION_JSON: ${{ vars.NEBIUS_INGRESS_INSTALLATION_JSON }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          value = json.loads(os.environ['NEBIUS_INGRESS_INSTALLATION_JSON'])
          sha = value['source_sha']
          if not isinstance(sha, str) or not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('Exact ingress source commit required')
          subprocess.run(['git', 'merge-base', '--is-ancestor', sha, 'refs/remotes/origin/dev'], check=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('sha=' + sha + '\n')
          PY
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ steps.tooling.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.26"
          checksum: 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0
          enable-cache: true
          save-cache: true
          cache-dependency-glob: uv.lock
      - name: Prepare locked ingress tooling
        shell: bash
        run: |
          set -euo pipefail
          uv sync --locked --no-default-groups --extra cluster --group nebius-certificates
          uv export --locked --no-default-groups --extra cluster --group nebius-certificates --no-emit-workspace \
            --format requirements-txt --no-header --quiet --output-file "$RUNNER_TEMP/ingress-requirements.txt"
      - name: Install qualified registry transport
        if: inputs.operation == 'ingress'
        shell: bash
        run: |
          set -euo pipefail
          test -s /etc/apt/sources.list.d/ubuntu.sources
          apt_sources=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-)
          sudo apt-get "${apt_sources[@]}" update
          sudo apt-get "${apt_sources[@]}" install -y --no-install-recommends skopeo=1.13.3+ds1-2ubuntu0.24.04.3
          test "$(dpkg-query -W -f='${Version}' skopeo)" = '1.13.3+ds1-2ubuntu0.24.04.3'
      - name: Run the exact ingress operation
        env:
          INGRESS_OPERATION: ${{ inputs.operation }}
          DEPLOY_SSH_KEY: ${{ secrets.NEBIUS_INGRESS_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.NEBIUS_DEPLOY_SSH_KNOWN_HOSTS }}
          LOOM_DEPLOY_SSH_TARGET: ${{ vars.NEBIUS_DEPLOY_SSH_TARGET }}
          NEBIUS_INGRESS_INSTALLATION_JSON: ${{ vars.NEBIUS_INGRESS_INSTALLATION_JSON }}
          NEBIUS_REGISTRY_SERVICE_ACCOUNT_JSON: ${{ inputs.operation == 'ingress' && secrets.NEBIUS_REGISTRY_SERVICE_ACCOUNT_JSON || '' }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export LOOM_DEPLOY_SSH_KEY_FILE="$RUNNER_TEMP/nebius-ingress-key"
          export LOOM_DEPLOY_SSH_KNOWN_HOSTS_FILE="$RUNNER_TEMP/nebius-ingress-known-hosts"
          trap 'rm -f -- "$LOOM_DEPLOY_SSH_KEY_FILE" "$LOOM_DEPLOY_SSH_KNOWN_HOSTS_FILE"' EXIT
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$LOOM_DEPLOY_SSH_TARGET"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$LOOM_DEPLOY_SSH_KEY_FILE"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$LOOM_DEPLOY_SSH_KNOWN_HOSTS_FILE"
          unset DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS
          case "$INGRESS_OPERATION" in
            ingress) operation=install ;;
            ingress-rollback) operation=rollback ;;
            ingress-dns) operation=dns ;;
            *) exit 1 ;;
          esac
          uv run --no-sync python -m scripts.ops.nebius_ingress_rollout \
            --operation "$operation" --requirements "$RUNNER_TEMP/ingress-requirements.txt" \
            --evidence-dir "$RUNNER_TEMP/nebius-ingress"
      - name: Preserve bounded ingress evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nebius-ingress-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/nebius-ingress/*.json
            ${{ runner.temp }}/nebius-ingress/scan/ingress-policy.json
          if-no-files-found: ignore
          retention-days: 30

  management:
    if: >-
      github.repository == 'qianyi-sun/loom' &&
      github.ref == 'refs/heads/dev' &&
      github.event_name == 'workflow_dispatch' &&
      (inputs.operation == 'management-preflight' || inputs.operation == 'management-install' ||
       inputs.operation == 'management-diagnostic-preflight' || inputs.operation == 'management-diagnostic-install' ||
       inputs.operation == 'management-recovery-preflight' || inputs.operation == 'management-recovery-install' ||
       inputs.operation == 'management-refresh-preflight' || inputs.operation == 'management-refresh-install' ||
       inputs.operation == 'management-pool-preflight' || inputs.operation == 'management-pool-install' ||
       inputs.operation == 'management-pool-rollback')
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
    environment:
      name: nebius-integration
      deployment: false
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false
      - name: Select exact integrated management authority source
        id: tooling
        env:
          MANAGEMENT_OPERATION: ${{ inputs.operation }}
          NEBIUS_MANAGEMENT_OPERATION_JSON: ${{ vars.NEBIUS_MANAGEMENT_OPERATION_JSON }}
          NEBIUS_MANAGEMENT_DIAGNOSTIC_OPERATION_JSON: ${{ vars.NEBIUS_MANAGEMENT_DIAGNOSTIC_OPERATION_JSON }}
          NEBIUS_MANAGEMENT_RECOVERY_OPERATION_JSON: ${{ vars.NEBIUS_MANAGEMENT_RECOVERY_OPERATION_JSON }}
          NEBIUS_MANAGEMENT_REFRESH_OPERATION_JSON: ${{ vars.NEBIUS_MANAGEMENT_REFRESH_OPERATION_JSON }}
          NEBIUS_MANAGEMENT_POOL_OPERATION_JSON: ${{ vars.NEBIUS_MANAGEMENT_POOL_OPERATION_JSON }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          action = os.environ['MANAGEMENT_OPERATION']
          if action not in {'management-preflight', 'management-install', 'management-diagnostic-preflight', 'management-diagnostic-install', 'management-recovery-preflight', 'management-recovery-install', 'management-refresh-preflight', 'management-refresh-install', 'management-pool-preflight', 'management-pool-install', 'management-pool-rollback'}:
              raise SystemExit('Fixed management operation required')
          diagnostic = action.startswith('management-diagnostic-')
          recovery = action.startswith('management-recovery-')
          refresh = action.startswith('management-refresh-')
          pool = action.startswith('management-pool-')
          key = ('NEBIUS_MANAGEMENT_POOL_OPERATION_JSON' if pool else
                 'NEBIUS_MANAGEMENT_REFRESH_OPERATION_JSON' if refresh else
                 'NEBIUS_MANAGEMENT_RECOVERY_OPERATION_JSON' if recovery else
                 'NEBIUS_MANAGEMENT_DIAGNOSTIC_OPERATION_JSON' if diagnostic else 'NEBIUS_MANAGEMENT_OPERATION_JSON')
          value = json.loads(os.environ[key])
          if (diagnostic != (value['schema'] == 'loom.nebius-management-retirement-diagnostic-operation.v1') or
              recovery != (value['schema'] == 'loom.nebius-management-retirement-recovery-operation.v1') or
              refresh != (value['schema'] == 'loom.nebius-management-refresh-operation.v1') or
              pool != (value['schema'] == 'loom.nebius-pool-cutover-operation.v1')):
              raise SystemExit('Management operation schema differs from selected authority')
          sha = value['source_sha']
          if not isinstance(sha, str) or not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('Exact management source commit required')
          subprocess.run(['git', 'merge-base', '--is-ancestor', sha, 'refs/remotes/origin/dev'], check=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('sha=' + sha + '\n')
          PY
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ steps.tooling.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.26"
          checksum: 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0
          enable-cache: true
          save-cache: true
          cache-dependency-glob: uv.lock
      - name: Prepare locked management tooling
        shell: bash
        run: |
          set -euo pipefail
          uv sync --locked --no-default-groups --extra cluster --group nebius-certificates
          uv export --locked --no-default-groups --extra cluster --group nebius-certificates --no-emit-workspace \
            --format requirements-txt --no-header --quiet --output-file "$RUNNER_TEMP/management-requirements.txt"
      - name: Run fixed management operation
        env:
          MANAGEMENT_OPERATION: ${{ inputs.operation }}
          DEPLOY_SSH_KEY: ${{ secrets.NEBIUS_MANAGEMENT_SSH_KEY }}
          DIAGNOSTIC_SSH_KEY: ${{ secrets.NEBIUS_MANAGEMENT_DIAGNOSTIC_SSH_KEY }}
          RECOVERY_SSH_KEY: ${{ secrets.NEBIUS_MANAGEMENT_RECOVERY_SSH_KEY }}
          REFRESH_SSH_KEY: ${{ secrets.NEBIUS_MANAGEMENT_REFRESH_SSH_KEY }}
          POOL_SSH_KEY: ${{ secrets.NEBIUS_MANAGEMENT_POOL_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.NEBIUS_DEPLOY_SSH_KNOWN_HOSTS }}
          LOOM_DEPLOY_SSH_TARGET: ${{ vars.NEBIUS_DEPLOY_SSH_TARGET }}
          NEBIUS_MANAGEMENT_OPERATION_JSON: ${{ vars.NEBIUS_MANAGEMENT_OPERATION_JSON }}
          NEBIUS_MANAGEMENT_DIAGNOSTIC_OPERATION_JSON: ${{ vars.NEBIUS_MANAGEMENT_DIAGNOSTIC_OPERATION_JSON }}
          NEBIUS_MANAGEMENT_RECOVERY_OPERATION_JSON: ${{ vars.NEBIUS_MANAGEMENT_RECOVERY_OPERATION_JSON }}
          NEBIUS_MANAGEMENT_REFRESH_OPERATION_JSON: ${{ vars.NEBIUS_MANAGEMENT_REFRESH_OPERATION_JSON }}
          NEBIUS_MANAGEMENT_POOL_OPERATION_JSON: ${{ vars.NEBIUS_MANAGEMENT_POOL_OPERATION_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          case "$MANAGEMENT_OPERATION" in
            management-preflight) operation=preflight ;;
            management-install) operation=install ;;
            management-diagnostic-preflight|management-diagnostic-install)
              operation="${MANAGEMENT_OPERATION##*-}"
              DEPLOY_SSH_KEY="$DIAGNOSTIC_SSH_KEY"
              export NEBIUS_MANAGEMENT_OPERATION_JSON="$NEBIUS_MANAGEMENT_DIAGNOSTIC_OPERATION_JSON"
              ;;
            management-recovery-preflight|management-recovery-install)
              operation="${MANAGEMENT_OPERATION##*-}"
              DEPLOY_SSH_KEY="$RECOVERY_SSH_KEY"
              export NEBIUS_MANAGEMENT_OPERATION_JSON="$NEBIUS_MANAGEMENT_RECOVERY_OPERATION_JSON"
              ;;
            management-refresh-preflight|management-refresh-install)
              operation="${MANAGEMENT_OPERATION##*-}"
              DEPLOY_SSH_KEY="$REFRESH_SSH_KEY"
              export NEBIUS_MANAGEMENT_OPERATION_JSON="$NEBIUS_MANAGEMENT_REFRESH_OPERATION_JSON"
              ;;
            management-pool-preflight|management-pool-install|management-pool-rollback)
              operation="${MANAGEMENT_OPERATION##*-}"
              DEPLOY_SSH_KEY="$POOL_SSH_KEY"
              export NEBIUS_MANAGEMENT_OPERATION_JSON="$NEBIUS_MANAGEMENT_POOL_OPERATION_JSON"
              ;;
            *) exit 1 ;;
          esac
          unset DIAGNOSTIC_SSH_KEY RECOVERY_SSH_KEY REFRESH_SSH_KEY POOL_SSH_KEY NEBIUS_MANAGEMENT_DIAGNOSTIC_OPERATION_JSON NEBIUS_MANAGEMENT_RECOVERY_OPERATION_JSON NEBIUS_MANAGEMENT_REFRESH_OPERATION_JSON NEBIUS_MANAGEMENT_POOL_OPERATION_JSON
          export LOOM_DEPLOY_SSH_KEY_FILE="$RUNNER_TEMP/nebius-management-key"
          export LOOM_DEPLOY_SSH_KNOWN_HOSTS_FILE="$RUNNER_TEMP/nebius-management-known-hosts"
          trap 'rm -f -- "$LOOM_DEPLOY_SSH_KEY_FILE" "$LOOM_DEPLOY_SSH_KNOWN_HOSTS_FILE"' EXIT
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$LOOM_DEPLOY_SSH_TARGET"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$LOOM_DEPLOY_SSH_KEY_FILE"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$LOOM_DEPLOY_SSH_KNOWN_HOSTS_FILE"
          unset DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS
          uv run --no-sync python -m scripts.ops.nebius_management_rollout \
            --operation "$operation" --requirements "$RUNNER_TEMP/management-requirements.txt" \
            --evidence-dir "$RUNNER_TEMP/nebius-management"
      - name: Preserve bounded management evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nebius-management-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nebius-management/management-result.json
          if-no-files-found: ignore
          retention-days: 30

  inspect:
    if: >-
      github.repository == 'qianyi-sun/loom' &&
      github.ref == 'refs/heads/dev' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'inspect'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    environment:
      name: nebius-integration
      deployment: false
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.26"
          checksum: 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0
          enable-cache: true
          save-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --no-dev --extra cluster
      - name: Inspect installation prerequisites without changing cluster state
        env:
          PREPARE_SHARED_INPUTS: ${{ inputs.prepare_shared_inputs }}
          NEBIUS_INGRESS_INSTALLATION_JSON: ${{ vars.NEBIUS_INGRESS_INSTALLATION_JSON }}
          NEBIUS_MANAGEMENT_OPERATION_JSON: ${{ vars.NEBIUS_MANAGEMENT_OPERATION_JSON }}
          DEPLOY_SSH_KEY: ${{ secrets.NEBIUS_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.NEBIUS_DEPLOY_SSH_KNOWN_HOSTS }}
          LOOM_DEPLOY_SSH_TARGET: ${{ vars.NEBIUS_DEPLOY_SSH_TARGET }}
          REMOTE_KUBECONFIG: ${{ vars.NEBIUS_DEPLOY_KUBECONFIG_PATH }}
          CLUSTER_ID: ${{ vars.NEBIUS_DEPLOY_CLUSTER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export LOOM_DEPLOY_SSH_KEY_FILE="$RUNNER_TEMP/nebius-inspect-key"
          export LOOM_DEPLOY_SSH_KNOWN_HOSTS_FILE="$RUNNER_TEMP/nebius-inspect-known-hosts"
          trap 'rm -f -- "$LOOM_DEPLOY_SSH_KEY_FILE" "$LOOM_DEPLOY_SSH_KNOWN_HOSTS_FILE"' EXIT
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$LOOM_DEPLOY_SSH_TARGET"
          test -n "$REMOTE_KUBECONFIG"
          test -n "$CLUSTER_ID"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$LOOM_DEPLOY_SSH_KEY_FILE"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$LOOM_DEPLOY_SSH_KNOWN_HOSTS_FILE"
          unset DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS
          extra_args=()
          if [[ "$PREPARE_SHARED_INPUTS" == 'true' ]]; then
            extra_args+=(--prepare-shared-inputs)
          fi
          uv run --no-sync python scripts/ops/nebius_management_preflight.py \
            --kubeconfig "$REMOTE_KUBECONFIG" --expected-cluster-id "$CLUSTER_ID" \
            --evidence-dir "$RUNNER_TEMP/nebius-inspect" "${extra_args[@]}"
      - name: Preserve sanitized installation inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nebius-inspect-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nebius-inspect/management-preflight.json
          if-no-files-found: ignore
          retention-days: 30
